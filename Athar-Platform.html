<!DOCTYPE html>
<html lang="ar" dir="rtl" data-lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>أَثَرْ | ATHAR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
/* ══════════════════════════════════════════
   ATHAR DESIGN SYSTEM — Production v2
   ══════════════════════════════════════════ */
:root {
  --olive:       #5a6b3a;
  --olive-mid:   #6b7a4f;
  --olive-light: #8a9a6a;
  --olive-pale:  #eef1e8;
  --olive-glow:  rgba(90,107,58,0.35);
  --sand:        #f5ede1;
  --sand-dark:   #e8d9c4;
  --warm-white:  #fdfaf6;
  --charcoal:    #1a1a1a;
  --charcoal-80: #333333;
  --charcoal-50: #888888;
  --charcoal-20: #d4d4d4;
  --white:       #ffffff;
  --red:         #c84c3c;
  --success:     #2d7a4f;
  --warn:        #c47d1a;

  --r-sm:   0.5rem;
  --r-md:   1rem;
  --r-lg:   1.25rem;
  --r-xl:   1.75rem;
  --r-2xl:  2.5rem;
  --r-full: 9999px;

  --shadow-sm: 0 1px 4px rgba(0,0,0,0.06);
  --shadow-md: 0 4px 20px rgba(0,0,0,0.08);
  --shadow-lg: 0 12px 40px rgba(0,0,0,0.12);
  --shadow-xl: 0 24px 60px rgba(0,0,0,0.16);

  /* ── SPACING SCALE (Phase 1 — shared spacing system) ── */
  --sp-1: 0.25rem;
  --sp-2: 0.5rem;
  --sp-3: 0.75rem;
  --sp-4: 1rem;
  --sp-5: 1.25rem;
  --sp-6: 1.5rem;
  --sp-7: 2rem;
  --sp-8: 2.5rem;
  --sp-9: 3rem;

  /* ── TYPOGRAPHY SCALE (Phase 1 — shared type system) ── */
  --fs-xs:   0.7rem;
  --fs-sm:   0.8rem;
  --fs-base: 0.9rem;
  --fs-md:   1rem;
  --fs-lg:   1.25rem;
  --fs-xl:   1.5rem;
  --fs-2xl:  2rem;
  --fs-3xl:  clamp(2.2rem, 7vw, 3.6rem);

  --fw-regular:  400;
  --fw-medium:   500;
  --fw-semibold: 600;
  --fw-bold:     700;
  --fw-black:    900;

  /* ── SURFACE + STATUS COLOR TOKENS (Phase 1 — fill audit gaps) ── */
  --surface-dark:   #121810;
  --surface-dark-2: #1a2010;

  --success-bg: #f0fdf4;  --success-fg: #166534;
  --red-bg:     #fef2f2;  --red-fg:     #991b1b;
  --warn-bg:    #fef9ec;  --warn-fg:    #92400e;

  /* ── ALPHA / LINE HELPERS (replace repeated rgba literals) ── */
  --line-sand:        rgba(232,217,196,0.5);
  --line-sand-soft:   rgba(232,217,196,0.4);
  --line-sand-strong: rgba(232,217,196,0.7);
  --olive-a40:        rgba(90,107,58,0.4);
  --scrim:            rgba(0,0,0,0.5);
}

/* ── RESET ── */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; -webkit-text-size-adjust:100%; }
body {
  background: var(--warm-white);
  color: var(--charcoal);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── TYPOGRAPHY SYSTEM ── */
/* Arabic */
[data-lang="ar"] body,
[data-lang="ar"] button,
[data-lang="ar"] input,
[data-lang="ar"] select,
[data-lang="ar"] textarea {
  font-family: 'Tajawal', sans-serif;
}

/* English */
[data-lang="en"] body,
[data-lang="en"] button,
[data-lang="en"] input,
[data-lang="en"] select,
[data-lang="en"] textarea {
  font-family: 'Inter', sans-serif;
}

/* ── SCROLLBAR ── */
::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-thumb { background: var(--olive-light); border-radius: 2px; }

/* ══════════════════════════════════════════
   LAYOUT FOUNDATIONS
   ══════════════════════════════════════════ */
.app-wrap {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* ══════════════════════════════════════════
   NAVBAR
   ══════════════════════════════════════════ */
.navbar {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 60px;
  z-index: 500;
  background: rgba(253,250,246,0.95);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border-bottom: 1px solid rgba(232,217,196,0.4);
}

.navbar-inner {
  max-width: 1280px;
  margin: 0 auto;
  height: 100%;
  padding: 0 1.25rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
}

.nav-logo {
  font-size: 1.5rem;
  font-weight: 900;
  color: var(--olive);
  letter-spacing: 2px;
  cursor: pointer;
  flex-shrink: 0;
  font-family: 'Tajawal', sans-serif !important;
}

.nav-end {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  flex-shrink: 0;
}

.pill-btn {
  height: 34px;
  padding: 0 0.9rem;
  border-radius: var(--r-full);
  font-size: 0.78rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
  border: 1.5px solid var(--sand-dark);
  background: transparent;
  color: var(--charcoal);
  white-space: nowrap;
}
.pill-btn:hover { background: var(--sand); }

.pill-btn-olive {
  background: var(--olive);
  color: var(--white);
  border-color: transparent;
}
.pill-btn-olive:hover { background: var(--olive-mid); }

.pill-btn-red {
  color: var(--red);
  border-color: rgba(200,76,60,0.25);
}
.pill-btn-red:hover { background: rgba(200,76,60,0.06); }

.user-tag {
  height: 34px;
  padding: 0 0.8rem;
  background: var(--olive-pale);
  border-radius: var(--r-full);
  font-size: 0.75rem;
  font-weight: 700;
  color: var(--olive);
  display: none;
  align-items: center;
}
.user-tag.show { display: flex; }

/* ══════════════════════════════════════════
   LOGIN SCREEN
   ══════════════════════════════════════════ */
#loginScreen {
  min-height: 100vh;
  background: #121810;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}

.login-glow-1 {
  position: absolute;
  width: 600px; height: 600px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(90,107,58,0.4) 0%, transparent 70%);
  top: -150px; left: -150px;
  pointer-events: none;
}

.login-glow-2 {
  position: absolute;
  width: 400px; height: 400px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(90,107,58,0.2) 0%, transparent 70%);
  bottom: -100px; right: -100px;
  pointer-events: none;
}

.login-card {
  position: relative;
  z-index: 2;
  max-width: 360px;
  width: 90%;
  text-align: center;
  animation: fadeUp 0.5s ease both;
}

.login-logo {
  font-family: 'Tajawal', sans-serif !important;
  font-size: 3rem;
  font-weight: 900;
  color: var(--white);
  letter-spacing: 6px;
  margin-bottom: 0.4rem;
}

.login-tagline {
  font-size: 0.82rem;
  color: rgba(255,255,255,0.3);
  margin-bottom: 0.8rem;
  letter-spacing: 1px;
  font-family: 'Tajawal', sans-serif;
}

.login-divider {
  width: 36px; height: 2px;
  background: linear-gradient(90deg, var(--olive-light), transparent);
  margin: 0 auto 2.5rem;
  border-radius: 1px;
}

.login-actions { display: grid; gap: 0.7rem; }

.login-btn-primary {
  width: 100%; height: 52px;
  background: var(--olive);
  color: var(--white);
  border: none;
  border-radius: var(--r-full);
  font-size: 0.95rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.25s;
  letter-spacing: 0.3px;
}
.login-btn-primary:hover {
  background: var(--olive-mid);
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(90,107,58,0.4);
}

.login-btn-secondary {
  width: 100%; height: 52px;
  background: rgba(255,255,255,0.06);
  color: rgba(255,255,255,0.6);
  border: 1.5px solid rgba(255,255,255,0.12);
  border-radius: var(--r-full);
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.25s;
}
.login-btn-secondary:hover {
  background: rgba(255,255,255,0.1);
  color: rgba(255,255,255,0.85);
}

/* ══════════════════════════════════════════
   APP SHELL
   ══════════════════════════════════════════ */
#appScreen {
  display: none;
  padding-top: 60px;
  padding-bottom: 70px;
  min-height: 100vh;
}
#appScreen.show { display: block; }

/* ── PAGES ── */
.page {
  display: none;
  background: var(--warm-white);
}
.page.active {
  display: block;
  animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ══════════════════════════════════════════
   HOME PAGE — HERO
   ══════════════════════════════════════════ */
.hero {
  min-height: 68vh;
  background: #121810;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
}

.hero-glow {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 70% at 10% 60%, rgba(90,107,58,0.45) 0%, transparent 55%),
    radial-gradient(ellipse 40% 50% at 90% 20%, rgba(90,107,58,0.1) 0%, transparent 50%);
  pointer-events: none;
}

.hero-grid {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px);
  background-size: 52px 52px;
  pointer-events: none;
}

.hero-ring {
  position: absolute;
  border-radius: 50%;
  border: 1px solid rgba(90,107,58,0.12);
  pointer-events: none;
}

.hero-ring-1 { width: 400px; height: 400px; top: -150px; right: -100px; }
.hero-ring-2 { width: 280px; height: 280px; top: -60px;  right: -40px; border-color: rgba(90,107,58,0.06); }

.hero-arc {
  position: absolute;
  bottom: -1px; left: 0; right: 0;
  height: 56px;
  background: var(--warm-white);
  clip-path: ellipse(55% 100% at 50% 100%);
  z-index: 3;
}

.hero-content {
  position: relative;
  z-index: 2;
  padding: 4rem 1.5rem 4.5rem;
  max-width: 1280px;
  width: 100%;
  margin: 0 auto;
}

.hero-eyebrow {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  margin-bottom: 2rem;
}

.hero-eyebrow-dot {
  width: 5px; height: 5px;
  background: var(--olive-light);
  border-radius: 50%;
  flex-shrink: 0;
}

.hero-eyebrow-text {
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 3.5px;
  color: rgba(255,255,255,0.3);
  text-transform: uppercase;
}

.hero-title {
  font-size: clamp(2.2rem, 7vw, 3.6rem);
  font-weight: 900;
  color: var(--white);
  line-height: 1.18;
  margin-bottom: 1.4rem;
  letter-spacing: 0.8px;
}

.hero-title-accent {
  color: var(--olive-light);
  display: block;
}

.hero-rule {
  width: 28px; height: 2px;
  background: linear-gradient(90deg, var(--olive-light), transparent);
  margin-bottom: 1.4rem;
  border-radius: 1px;
}

.hero-subtitle {
  font-size: 0.95rem;
  color: rgba(255,255,255,0.42);
  line-height: 1.9;
  max-width: 360px;
  margin-bottom: 2.2rem;
  font-weight: 400;
}

.hero-actions {
  display: flex;
  align-items: center;
  gap: 1.2rem;
  flex-wrap: wrap;
}

.hero-btn {
  height: 44px;
  padding: 0 1.5rem;
  background: var(--olive);
  color: var(--white);
  border: none;
  border-radius: var(--r-full);
  font-size: 0.85rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.25s;
  white-space: nowrap;
}
.hero-btn:hover {
  background: var(--olive-mid);
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(90,107,58,0.4);
}

.hero-link {
  font-size: 0.82rem;
  color: rgba(255,255,255,0.32);
  cursor: pointer;
  transition: color 0.2s;
  white-space: nowrap;
}
.hero-link:hover { color: rgba(255,255,255,0.6); }

/* ══════════════════════════════════════════
   IMPACT COUNTER
   ══════════════════════════════════════════ */
.impact-wrap {
  padding: 0 1.25rem;
  background: var(--warm-white);
  position: relative;
  z-index: 10;
}

.impact-card {
  max-width: 1280px;
  margin: -24px auto 0;
  background: var(--white);
  border-radius: var(--r-xl);
  border: 1px solid rgba(232,217,196,0.7);
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  overflow: hidden;
  box-shadow: var(--shadow-md);
  position: relative;
  z-index: 5;
}

.impact-item {
  text-align: center;
  padding: 1.3rem 0.6rem;
  border-inline-end: 1px solid rgba(232,217,196,0.6);
  transition: background 0.2s;
}
.impact-item:last-child { border-inline-end: none; }
.impact-item:hover { background: var(--sand); }

.impact-num {
  font-size: 1.4rem;
  font-weight: 900;
  color: var(--olive);
  line-height: 1;
  font-family: 'Inter', sans-serif;
}

.impact-lbl {
  font-size: 0.62rem;
  color: var(--charcoal-50);
  margin-top: 0.35rem;
  font-weight: 600;
  line-height: 1.3;
}

/* ══════════════════════════════════════════
   SECTION WRAPPER
   ══════════════════════════════════════════ */
.section {
  max-width: 1280px;
  margin: 0 auto;
  padding: 2rem 1.25rem 2.5rem;
}

.section-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 1.25rem;
  padding-bottom: 0.9rem;
  border-bottom: 1px solid rgba(232,217,196,0.5);
}

.section-title {
  font-size: 1.1rem;
  font-weight: 800;
  color: var(--charcoal);
}

.section-link {
  font-size: 0.8rem;
  color: var(--olive);
  font-weight: 700;
  cursor: pointer;
  transition: opacity 0.2s;
}
.section-link:hover { opacity: 0.65; }

/* ══════════════════════════════════════════
   CAMPAIGN CARDS
   ══════════════════════════════════════════ */
.camps-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 1.1rem;
}

.camp-card {
  background: var(--white);
  border-radius: var(--r-xl);
  overflow: hidden;
  border: 1px solid rgba(232,217,196,0.5);
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
}
.camp-card:hover {
  transform: translateY(-6px);
  box-shadow: var(--shadow-lg);
  border-color: transparent;
}

.camp-img {
  height: 185px;
  position: relative;
  overflow: hidden;
}

.camp-img img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.5s ease;
}
.camp-card:hover .camp-img img { transform: scale(1.04); }

.camp-img-fallback {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2.8rem;
}

.camp-img-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,0.5) 0%, transparent 50%);
}

.camp-badge {
  position: absolute;
  top: 0.9rem;
  padding: 0.28rem 0.65rem;
  border-radius: var(--r-full);
  font-size: 0.68rem;
  font-weight: 700;
  backdrop-filter: blur(8px);
}

[data-lang="ar"] .camp-badge { right: 0.9rem; }
[data-lang="en"] .camp-badge { left: 0.9rem; }

.camp-badge-cat {
  position: absolute;
  top: 0.9rem;
  background: rgba(255,255,255,0.88);
  color: var(--olive);
}
[data-lang="ar"] .camp-badge-cat { left: 0.9rem; }
[data-lang="en"] .camp-badge-cat { right: 0.9rem; }

.status-approved { background: rgba(220,252,231,0.9); color: #166534; }
.status-pending  { background: rgba(254,243,199,0.9); color: #92400e; }
.status-rejected { background: rgba(254,226,226,0.9); color: #991b1b; }
.status-done     { background: rgba(224,231,255,0.9); color: #3730a3; }

.camp-body { padding: 1.2rem; }

.camp-title {
  font-size: 0.98rem;
  font-weight: 800;
  margin-bottom: 0.4rem;
  color: var(--charcoal);
  line-height: 1.35;
}

.camp-desc {
  font-size: 0.8rem;
  color: var(--charcoal-50);
  line-height: 1.65;
  margin-bottom: 0.9rem;
}

.camp-meta {
  display: grid;
  gap: 0.28rem;
  margin-bottom: 0.9rem;
}

.camp-meta-row {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.76rem;
  color: var(--charcoal-50);
}

.camp-meta-dot {
  width: 4px; height: 4px;
  background: var(--olive-light);
  border-radius: 50%;
  flex-shrink: 0;
}

.prog-track {
  height: 4px;
  background: var(--sand);
  border-radius: 2px;
  overflow: hidden;
  margin-bottom: 0.28rem;
}
.prog-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--olive), var(--olive-light));
  border-radius: 2px;
  transition: width 0.8s ease;
}

.prog-label {
  font-size: 0.7rem;
  color: var(--charcoal-50);
  margin-bottom: 0.9rem;
}

.camp-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.8rem;
}

.camp-pct {
  font-size: 0.78rem;
  color: var(--charcoal-50);
}
.camp-pct strong { color: var(--olive); }

.join-btn {
  height: 36px;
  padding: 0 1.1rem;
  background: var(--olive);
  color: var(--white);
  border: none;
  border-radius: var(--r-full);
  font-size: 0.78rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
  flex-shrink: 0;
}
.join-btn:hover:not(:disabled) {
  background: var(--olive-mid);
  transform: translateY(-1px);
}
.join-btn:disabled {
  background: var(--olive-pale);
  color: var(--olive-light);
  cursor: not-allowed;
}

/* ══════════════════════════════════════════
   CAMPAIGN DETAIL PAGE
   ══════════════════════════════════════════ */
.detail-hero {
  height: 320px;
  position: relative;
  overflow: hidden;
  background: #1a2010;
  display: flex;
  align-items: center;
  justify-content: center;
}

.detail-hero img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  display: block;
}

.detail-hero-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.05) 70%);
}

.detail-back {
  position: absolute;
  top: 1rem;
  width: 38px; height: 38px;
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(8px);
  border: none;
  border-radius: 50%;
  color: white;
  font-size: 1.1rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2;
  transition: background 0.2s;
}
.detail-back:hover { background: rgba(255,255,255,0.25); }
[data-lang="ar"] .detail-back { right: 1rem; }
[data-lang="en"] .detail-back { left: 1rem; }

.detail-body {
  max-width: 800px;
  margin: 0 auto;
  padding: 1.75rem 1.25rem 3rem;
}

.detail-cat {
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 2.5px;
  color: var(--olive-light);
  text-transform: uppercase;
  margin-bottom: 0.5rem;
}

.detail-title {
  font-size: 1.65rem;
  font-weight: 900;
  color: var(--charcoal);
  line-height: 1.2;
  margin-bottom: 0.75rem;
}

.detail-desc {
  font-size: 0.92rem;
  color: var(--charcoal-50);
  line-height: 1.85;
  margin-bottom: 1.75rem;
}

.detail-info-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.85rem;
  margin-bottom: 1.5rem;
}

.detail-info-card {
  background: var(--white);
  border: 1px solid rgba(232,217,196,0.6);
  border-radius: var(--r-lg);
  padding: 1rem 1.1rem;
}

.detail-info-label {
  font-size: 0.65rem;
  font-weight: 700;
  letter-spacing: 1.5px;
  color: var(--charcoal-50);
  text-transform: uppercase;
  margin-bottom: 0.35rem;
}

.detail-info-value {
  font-size: 0.92rem;
  font-weight: 700;
  color: var(--charcoal);
}

.detail-progress-card {
  background: var(--white);
  border: 1px solid rgba(232,217,196,0.6);
  border-radius: var(--r-lg);
  padding: 1.2rem;
  margin-bottom: 1.5rem;
}

.detail-progress-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 0.75rem;
}

.detail-progress-label {
  font-size: 0.8rem;
  color: var(--charcoal-50);
  font-weight: 600;
}

.detail-progress-pct {
  font-size: 0.85rem;
  font-weight: 800;
  color: var(--olive);
}

.detail-join-btn {
  width: 100%;
  height: 52px;
  background: var(--olive);
  color: var(--white);
  border: none;
  border-radius: var(--r-full);
  font-size: 0.95rem;
  font-weight: 800;
  cursor: pointer;
  transition: all 0.25s;
  letter-spacing: 0.3px;
}
.detail-join-btn:hover:not(:disabled) {
  background: var(--olive-mid);
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(90,107,58,0.35);
}
.detail-join-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

/* ══════════════════════════════════════════
   EXPLORE PAGE
   ══════════════════════════════════════════ */
.explore-header {
  background: var(--charcoal);
  padding: 2rem 1.25rem 2.5rem;
  position: relative;
  overflow: hidden;
}

.explore-header::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse 80% 100% at 0% 100%, var(--olive-glow) 0%, transparent 60%);
}

.explore-header h1 {
  position: relative;
  font-size: 1.8rem;
  font-weight: 900;
  color: var(--white);
  margin-bottom: 0.4rem;
}

.explore-header p {
  position: relative;
  font-size: 0.88rem;
  color: rgba(255,255,255,0.4);
}

/* ══════════════════════════════════════════
   CREATE PAGE
   ══════════════════════════════════════════ */
.create-hero {
  background: var(--charcoal);
  padding: 2.5rem 1.25rem 3rem;
  position: relative;
  overflow: hidden;
  text-align: center;
}
.create-hero::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse 60% 80% at 50% 50%, rgba(90,107,58,0.3) 0%, transparent 60%);
}
.create-hero > * { position: relative; z-index: 1; }

.create-hero h1 {
  font-size: 1.6rem;
  font-weight: 900;
  color: var(--white);
  margin-bottom: 0.5rem;
}

.create-hero p {
  font-size: 0.85rem;
  color: rgba(255,255,255,0.38);
  margin-bottom: 1.75rem;
  line-height: 1.7;
}

.create-btn {
  height: 48px;
  padding: 0 2rem;
  background: var(--olive);
  color: var(--white);
  border: none;
  border-radius: var(--r-full);
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.25s;
}
.create-btn:hover {
  background: var(--olive-mid);
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(90,107,58,0.4);
}

.my-camps-section {
  max-width: 1280px;
  margin: 1.75rem auto 0;
  padding: 0 1.25rem;
}

.my-camps-title {
  font-size: 1rem;
  font-weight: 800;
  margin-bottom: 1rem;
  color: var(--charcoal);
}

.my-camp-row {
  background: var(--white);
  border: 1px solid rgba(232,217,196,0.6);
  border-radius: var(--r-lg);
  padding: 1rem 1.1rem;
  margin-bottom: 0.7rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 1rem;
}

.my-camp-info-title { font-size: 0.9rem; font-weight: 700; margin-bottom: 0.2rem; }
.my-camp-info-sub { font-size: 0.75rem; color: var(--charcoal-50); }

.status-chip {
  padding: 0.3rem 0.75rem;
  border-radius: var(--r-full);
  font-size: 0.7rem;
  font-weight: 700;
  white-space: nowrap;
  flex-shrink: 0;
}

/* ══════════════════════════════════════════
   PROFILE PAGE
   ══════════════════════════════════════════ */
.profile-cover {
  height: 180px;
  background: var(--charcoal);
  position: relative;
  overflow: visible;
}

.profile-cover::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse 80% 100% at 0% 100%, rgba(90,107,58,0.45) 0%, transparent 55%);
}

.profile-avatar-ring {
  position: absolute;
  top: 20px;
  width: 88px;
  height: 88px;
  border-radius: 50%;
  background: var(--warm-white);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10;
  box-shadow: 0 4px 20px rgba(0,0,0,0.15);
}

[data-lang="ar"] .profile-avatar-ring { right: 20px; }
[data-lang="en"] .profile-avatar-ring { left: 20px; }

.profile-avatar {
  width: 78px;
  height: 78px;
  border-radius: 50%;
  border: 3px solid var(--warm-white);
  background: var(--sand);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2rem;
  position: relative;
}

.profile-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  display: block;
}

.profile-meta-bar {
  max-width: 1280px;
  margin: 0 auto;
  padding: 2rem 1.25rem 1.25rem;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 1rem;
}

.profile-name-wrap .name {
  font-size: 1.2rem;
  font-weight: 900;
  margin-bottom: 0.2rem;
}

.profile-name-wrap .loc {
  font-size: 0.78rem;
  color: var(--charcoal-50);
}

.change-pic-label {
  height: 34px;
  padding: 0 0.9rem;
  border: 1.5px solid var(--sand-dark);
  border-radius: var(--r-full);
  font-size: 0.75rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  background: transparent;
  transition: background 0.2s;
  white-space: nowrap;
  flex-shrink: 0;
}
.change-pic-label:hover { background: var(--sand); }
.change-pic-label:hover { background: var(--sand); }

.profile-stats {
  max-width: 1280px;
  margin: 0 auto;
  padding: 0 1.25rem;
}

.stats-card {
  background: var(--white);
  border: 1px solid rgba(232,217,196,0.6);
  border-radius: var(--r-xl);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  overflow: hidden;
  margin-bottom: 1.25rem;
}

.stat-cell {
  text-align: center;
  padding: 1.2rem 0.5rem;
  border-inline-end: 1px solid rgba(232,217,196,0.6);
}
.stat-cell:last-child { border-inline-end: none; }

.stat-num {
  font-size: 1.7rem;
  font-weight: 900;
  color: var(--olive);
  font-family: 'Inter', sans-serif;
}

.stat-lbl {
  font-size: 0.65rem;
  color: var(--charcoal-50);
  margin-top: 0.25rem;
  font-weight: 600;
}

/* Profile Menu */
.profile-menu {
  max-width: 1280px;
  margin: 0 auto;
  padding: 0 1.25rem 2rem;
}

.menu-card {
  background: var(--white);
  border: 1px solid rgba(232,217,196,0.6);
  border-radius: var(--r-xl);
  overflow: hidden;
}

.menu-row {
  display: flex;
  align-items: center;
  gap: 0.9rem;
  padding: 1rem 1.2rem;
  cursor: pointer;
  transition: background 0.18s;
  border-bottom: 1px solid rgba(232,217,196,0.4);
}
.menu-row:last-child { border-bottom: none; }
.menu-row:hover { background: var(--sand); }

.menu-icon {
  width: 38px; height: 38px;
  border-radius: var(--r-sm);
  background: var(--olive-pale);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.05rem;
  flex-shrink: 0;
}

.menu-texts { flex: 1; min-width: 0; }
.menu-title { font-size: 0.88rem; font-weight: 700; }
.menu-sub { font-size: 0.72rem; color: var(--charcoal-50); margin-top: 0.1rem; }

.menu-arrow {
  font-size: 1rem;
  color: var(--charcoal-20);
  transition: transform 0.2s;
}

.menu-section-body {
  display: none;
  background: var(--sand);
  padding: 1rem 1.2rem;
  border-bottom: 1px solid rgba(232,217,196,0.4);
}

.info-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0.75rem 0.9rem;
  background: var(--white);
  border-radius: var(--r-md);
  margin-bottom: 0.5rem;
}
.info-item:last-child { margin-bottom: 0; }
.info-lbl { font-size: 0.75rem; color: var(--charcoal-50); }
.info-val { font-size: 0.82rem; font-weight: 700; }

.status-banner-wrap {
  max-width: 1280px;
  margin: 0 auto;
  padding: 0.75rem 1.25rem;
}

.status-banner {
  padding: 0.85rem 1.1rem;
  border-radius: var(--r-lg);
  font-size: 0.83rem;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}
.banner-pending  { background: #fef9ec; color: #92400e; }
.banner-approved { background: #f0fdf4; color: #166534; }
.banner-rejected { background: #fef2f2; color: #991b1b; }

/* ══════════════════════════════════════════
   ABOUT PAGE
   ══════════════════════════════════════════ */
.about-hero {
  background: var(--charcoal);
  padding: 3.5rem 1.25rem 4rem;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.about-hero::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse 70% 80% at 50% 30%, rgba(90,107,58,0.35) 0%, transparent 60%);
}
.about-hero > * { position: relative; z-index: 1; }

.about-hero-title {
  font-size: clamp(2rem, 6vw, 3rem);
  font-weight: 900;
  color: var(--white);
  line-height: 1.2;
  margin-bottom: 1rem;
}
.about-hero-title em { color: var(--olive-light); font-style: normal; display: block; }

.about-hero-sub {
  font-size: 0.9rem;
  color: rgba(255,255,255,0.38);
  line-height: 1.85;
  max-width: 420px;
  margin: 0 auto;
}

.about-content {
  max-width: 1280px;
  margin: 0 auto;
  padding: 2rem 1.25rem;
}

.about-block {
  background: var(--white);
  border: 1px solid rgba(232,217,196,0.6);
  border-radius: var(--r-xl);
  padding: 2rem;
  margin-bottom: 1rem;
}
.about-block h2 {
  font-size: 1.1rem;
  font-weight: 900;
  color: var(--olive);
  margin-bottom: 0.75rem;
}
.about-block p {
  font-size: 0.88rem;
  color: var(--charcoal-50);
  line-height: 1.85;
}

/* Partnership */
.partner-section {
  background: #121810;
  border-radius: var(--r-2xl);
  padding: 2.5rem 1.5rem;
  margin-bottom: 1rem;
  position: relative;
  overflow: hidden;
  text-align: center;
}
.partner-section::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse 70% 70% at 50% 50%, rgba(90,107,58,0.28) 0%, transparent 55%);
}
.partner-section > * { position: relative; z-index: 1; }

.partner-title {
  font-size: 1.5rem;
  font-weight: 900;
  color: var(--white);
  margin-bottom: 0.75rem;
  line-height: 1.25;
}

.partner-sub {
  font-size: 0.84rem;
  color: rgba(255,255,255,0.38);
  line-height: 1.8;
  max-width: 400px;
  margin: 0 auto 2rem;
}

.partner-form {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: var(--r-xl);
  padding: 1.75rem;
  text-align: start;
  max-width: 560px;
  margin: 0 auto;
}

.partner-form-title {
  font-size: 1rem;
  font-weight: 800;
  color: var(--white);
  margin-bottom: 0.35rem;
}

.partner-form-sub {
  font-size: 0.78rem;
  color: rgba(255,255,255,0.35);
  margin-bottom: 1.4rem;
  line-height: 1.6;
}

.dark-field { margin-bottom: 0.75rem; }
.dark-field label {
  display: block;
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 1.5px;
  color: rgba(255,255,255,0.3);
  text-transform: uppercase;
  margin-bottom: 0.35rem;
}

.dark-input {
  width: 100%;
  height: 44px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: var(--r-md);
  color: var(--white);
  font-size: 0.88rem;
  padding: 0 0.9rem;
  transition: all 0.2s;
}
.dark-input::placeholder { color: rgba(255,255,255,0.2); }
.dark-input:focus {
  outline: none;
  border-color: var(--olive-light);
  background: rgba(255,255,255,0.08);
}

.dark-textarea {
  height: 90px;
  resize: none;
  padding: 0.75rem 0.9rem;
}

.dark-select { cursor: pointer; appearance: none; }

.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }

.dark-submit {
  width: 100%;
  height: 48px;
  background: var(--olive);
  color: var(--white);
  border: none;
  border-radius: var(--r-full);
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.25s;
  margin-top: 0.5rem;
}
.dark-submit:hover {
  background: var(--olive-mid);
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(90,107,58,0.4);
}

/* ══════════════════════════════════════════
   ADMIN PAGE
   ══════════════════════════════════════════ */
.admin-page {
  max-width: 1280px;
  margin: 0 auto;
  padding: 2rem 1.25rem;
  background: var(--warm-white);
}

.admin-page-title { font-size: 1.6rem; font-weight: 900; margin-bottom: 0.3rem; }
.admin-page-sub { font-size: 0.85rem; color: var(--charcoal-50); margin-bottom: 1.5rem; }

.tab-bar {
  display: flex;
  gap: 0.4rem;
  background: var(--sand);
  padding: 0.3rem;
  border-radius: var(--r-full);
  width: fit-content;
  margin-bottom: 1.5rem;
}

.tab-btn {
  height: 32px;
  padding: 0 1rem;
  border: none;
  border-radius: var(--r-full);
  font-size: 0.78rem;
  font-weight: 700;
  cursor: pointer;
  background: transparent;
  color: var(--charcoal-50);
  transition: all 0.2s;
  white-space: nowrap;
}
.tab-btn.active {
  background: var(--white);
  color: var(--charcoal);
  box-shadow: var(--shadow-sm);
}

.admin-card {
  background: var(--white);
  border: 1px solid rgba(232,217,196,0.6);
  border-radius: var(--r-xl);
  padding: 1.4rem;
  margin-bottom: 1rem;
}

.admin-card-head {
  display: flex;
  gap: 1rem;
  margin-bottom: 1rem;
  align-items: flex-start;
}

.admin-ava {
  width: 50px; height: 50px;
  border-radius: 50%;
  background: var(--sand);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.4rem;
  flex-shrink: 0;
  overflow: hidden;
  border: 2px solid var(--sand-dark);
}
.admin-ava img { width:100%; height:100%; object-fit:cover; }

.admin-info { flex: 1; min-width: 0; }
.admin-info-name { font-size: 0.95rem; font-weight: 800; margin-bottom: 0.25rem; }
.admin-info-row {
  font-size: 0.78rem;
  color: var(--charcoal-50);
  margin-top: 0.2rem;
  line-height: 1.4;
}

.admin-id-img {
  max-width: 220px;
  border-radius: var(--r-md);
  border: 1.5px solid var(--sand-dark);
  margin-top: 0.75rem;
  display: block;
}

.admin-actions { display: flex; gap: 0.6rem; }

.approve-btn {
  flex: 1;
  height: 40px;
  background: var(--olive);
  color: var(--white);
  border: none;
  border-radius: var(--r-full);
  font-size: 0.82rem;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.2s;
}
.approve-btn:hover { background: var(--olive-mid); }

.reject-btn {
  flex: 1;
  height: 40px;
  background: transparent;
  color: var(--red);
  border: 1.5px solid rgba(200,76,60,0.25);
  border-radius: var(--r-full);
  font-size: 0.82rem;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.2s;
}
.reject-btn:hover { background: rgba(200,76,60,0.06); }

.admin-section-label {
  font-size: 0.9rem;
  font-weight: 800;
  color: var(--charcoal);
  margin-bottom: 1rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.count-pill {
  background: var(--olive-pale);
  color: var(--olive);
  padding: 0.1rem 0.55rem;
  border-radius: var(--r-full);
  font-size: 0.7rem;
  font-weight: 700;
}

/* ══════════════════════════════════════════
   MODAL — BOTTOM SHEET
   ══════════════════════════════════════════ */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 600;
  align-items: flex-end;
  justify-content: center;
  backdrop-filter: blur(6px);
}
.modal-overlay.open { display: flex; }

.modal-sheet {
  background: var(--white);
  border-radius: var(--r-2xl) var(--r-2xl) 0 0;
  padding: 0 1.5rem 3rem;
  width: 100%;
  max-width: 580px;
  max-height: 92vh;
  overflow-y: auto;
  animation: sheetUp 0.32s cubic-bezier(0.4,0,0.2,1);
}

@keyframes sheetUp {
  from { transform: translateY(100%); }
  to   { transform: translateY(0); }
}

.modal-handle {
  width: 36px; height: 4px;
  background: var(--sand-dark);
  border-radius: 2px;
  margin: 1.1rem auto 1.5rem;
}

.modal-title {
  font-size: 1.3rem;
  font-weight: 900;
  margin-bottom: 1.5rem;
  text-align: center;
}

/* Form fields */
.field { margin-bottom: 1rem; }
.field label {
  display: block;
  font-size: 0.72rem;
  font-weight: 700;
  color: var(--charcoal-50);
  letter-spacing: 0.5px;
  margin-bottom: 0.4rem;
}

.field input,
.field textarea,
.field select {
  width: 100%;
  height: 46px;
  padding: 0 1rem;
  background: var(--sand);
  border: 1.5px solid transparent;
  border-radius: var(--r-md);
  font-size: 0.9rem;
  color: var(--charcoal);
  transition: all 0.2s;
}

.field textarea { height: 90px; padding: 0.75rem 1rem; resize: none; }

.field input:focus,
.field textarea:focus,
.field select:focus {
  outline: none;
  border-color: var(--olive);
  background: var(--white);
  box-shadow: 0 0 0 3px rgba(90,107,58,0.08);
}

.field input[type="file"] {
  height: auto;
  padding: 0.65rem;
  cursor: pointer;
}

input[type="file"]::file-selector-button {
  background: var(--olive);
  color: white;
  padding: 0.35rem 0.8rem;
  border: none;
  border-radius: var(--r-full);
  font-size: 0.76rem;
  font-weight: 700;
  cursor: pointer;
  margin-inline-end: 0.6rem;
}

.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; }

.submit-btn {
  width: 100%;
  height: 52px;
  background: var(--olive);
  color: var(--white);
  border: none;
  border-radius: var(--r-full);
  font-size: 0.95rem;
  font-weight: 800;
  cursor: pointer;
  transition: all 0.25s;
  margin-top: 0.5rem;
  letter-spacing: 0.3px;
}
.submit-btn:hover {
  background: var(--olive-mid);
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(90,107,58,0.35);
}

/* ══════════════════════════════════════════
   BOTTOM NAV
   ══════════════════════════════════════════ */
.bottom-nav {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: 64px;
  z-index: 400;
  background: rgba(253,250,246,0.97);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid rgba(232,217,196,0.5);
  display: none;
}
.bottom-nav.show { display: block; }

.bottom-nav-inner {
  max-width: 1280px;
  margin: 0 auto;
  height: 100%;
  display: flex;
  justify-content: space-around;
  align-items: center;
  padding: 0 0.5rem;
  padding-bottom: env(safe-area-inset-bottom);
}

.nav-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.22rem;
  flex: 1;
  height: 100%;
  border: none;
  background: none;
  cursor: pointer;
  color: var(--charcoal-50);
  font-size: 0.62rem;
  font-weight: 700;
  transition: color 0.2s;
  padding: 0.6rem 0;
}
.nav-btn:hover { color: var(--olive); }
.nav-btn.active { color: var(--olive); }

.nav-btn svg {
  width: 22px; height: 22px;
  stroke: currentColor;
  stroke-width: 1.8;
  fill: none;
  transition: stroke 0.2s;
}

.nav-btn-text { line-height: 1; }

/* ══════════════════════════════════════════
   EMPTY STATE
   ══════════════════════════════════════════ */
.empty-state {
  text-align: center;
  padding: 3.5rem 1.5rem;
  background: var(--white);
  border-radius: var(--r-xl);
  border: 1px solid rgba(232,217,196,0.5);
}
.empty-icon { font-size: 2.5rem; margin-bottom: 0.75rem; }
.empty-title { font-size: 1rem; font-weight: 800; margin-bottom: 0.35rem; }
.empty-sub { font-size: 0.82rem; color: var(--charcoal-50); line-height: 1.6; }

/* ══════════════════════════════════════════
   TOAST
   ══════════════════════════════════════════ */
.toast {
  position: fixed;
  bottom: 5rem;
  left: 50%;
  transform: translateX(-50%) translateY(10px);
  background: var(--charcoal);
  color: var(--white);
  padding: 0.75rem 1.4rem;
  border-radius: var(--r-full);
  font-size: 0.82rem;
  font-weight: 600;
  z-index: 999;
  white-space: nowrap;
  animation: toastAnim 0.3s ease forwards;
  box-shadow: var(--shadow-lg);
  max-width: 90vw;
  text-align: center;
}
.toast.success { background: var(--olive); }
.toast.error   { background: var(--red); }
.toast.warning { background: var(--warn); }

@keyframes toastAnim {
  to { transform: translateX(-50%) translateY(0); opacity: 1; }
}

/* ══════════════════════════════════════════
   RESPONSIVE
   ══════════════════════════════════════════ */
@media (max-width: 640px) {
  .camps-grid { grid-template-columns: 1fr; }
  .impact-card { grid-template-columns: repeat(2,1fr); }
  .impact-item:nth-child(2) { border-inline-end: none; }
  .detail-info-grid { grid-template-columns: 1fr 1fr; }
  .form-grid { grid-template-columns: 1fr; }
  .field-row { grid-template-columns: 1fr; }
  .admin-card-head { flex-direction: column; }
  .partner-form { padding: 1.25rem; }
}

@media (max-width: 380px) {
  .hero-title { font-size: 2rem; }
  .hero-content { padding: 3rem 1.25rem 4rem; }
  .nav-end { gap: 0.4rem; }
  .pill-btn { padding: 0 0.7rem; font-size: 0.72rem; }
}

/* ══════════════════════════════════════════
   ADMIN DASHBOARD — Shell Architecture
   ══════════════════════════════════════════ */

#adminPage { padding-top: 60px; }

.adm-shell {
  min-height: calc(100vh - 60px);
  display: flex;
  flex-direction: column;
  background: #f7f4ee;
  padding-bottom: calc(72px + env(safe-area-inset-bottom));
}

/* ── Header ── */
.adm-header {
  position: sticky;
  top: 60px;
  z-index: 50;
  display: flex;
  align-items: center;
  gap: 0.6rem;
  padding: 0.65rem 0.9rem;
  background: rgba(253,250,246,0.97);
  border-bottom: 1px solid rgba(232,217,196,0.5);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}

.adm-sidebar-toggle,
.adm-header-back {
  width: 40px; height: 40px;
  flex: none;
  border: none;
  background: var(--sand);
  border-radius: 0.65rem;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background 0.2s;
}
.adm-sidebar-toggle:active,
.adm-header-back:active { background: var(--sand-dark); }
.adm-sidebar-toggle svg,
.adm-header-back svg {
  width: 20px; height: 20px;
  stroke: var(--charcoal-80);
  stroke-width: 2;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.adm-header-title {
  font-size: 1rem;
  font-weight: 900;
  color: var(--charcoal);
  margin: 0;
  flex: none;
  white-space: nowrap;
}

.adm-header-search { flex: 1; min-width: 0; }
.adm-header-search input {
  width: 100%;
  box-sizing: border-box;
  padding: 0.5rem 0.8rem;
  border: 1.5px solid rgba(232,217,196,0.7);
  border-radius: 0.65rem;
  background: var(--white);
  font-size: 0.85rem;
  font-family: inherit;
  color: var(--charcoal);
}
.adm-header-search input:focus {
  outline: none;
  border-color: var(--olive-light);
}

/* ── Sidebar (mobile drawer) ── */
.adm-sidebar {
  position: fixed;
  top: 0;
  inset-inline-start: 0;
  bottom: 0;
  width: 272px;
  max-width: 80vw;
  background: var(--white);
  z-index: 620;
  transform: translateX(-110%);
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  display: flex;
  flex-direction: column;
  box-shadow: 4px 0 24px rgba(0,0,0,0.12);
  padding-top: env(safe-area-inset-top);
}
[dir="rtl"] .adm-sidebar { transform: translateX(110%); }
.adm-sidebar.open { transform: translateX(0) !important; }

.adm-sidebar-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 610;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}
.adm-sidebar-overlay.show { opacity: 1; pointer-events: auto; }

.adm-sidebar-header {
  padding: 1.25rem 1.1rem 1rem;
  border-bottom: 1px solid rgba(232,217,196,0.5);
}
.adm-sidebar-logo { display: flex; align-items: baseline; gap: 0.5rem; }
.adm-logo-text {
  font-size: 1.5rem;
  font-weight: 900;
  color: var(--olive);
  letter-spacing: 2px;
}
.adm-logo-sub {
  font-size: 0.75rem;
  font-weight: 700;
  color: var(--charcoal-50);
  text-transform: uppercase;
  letter-spacing: 1px;
}

.adm-sidebar-nav { padding: 0.75rem 0; display: flex; flex-direction: column; }

.adm-nav-item {
  display: flex;
  align-items: center;
  gap: 0.8rem;
  width: 100%;
  padding: 0.85rem 1.1rem;
  border: none;
  background: transparent;
  cursor: pointer;
  font-family: inherit;
  font-size: 0.92rem;
  font-weight: 700;
  color: var(--charcoal-80);
  border-inline-start: 3px solid transparent;
  text-align: start;
  transition: all 0.15s;
}
.adm-nav-item svg {
  width: 20px; height: 20px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex: none;
}
.adm-nav-item.active {
  color: var(--olive);
  background: var(--olive-pale);
  border-inline-start-color: var(--olive);
}
.adm-nav-badge {
  margin-inline-start: auto;
  background: var(--sand);
  border-radius: 9999px;
  font-size: 0.7rem;
  padding: 0.15rem 0.55rem;
  font-weight: 800;
  color: var(--charcoal-80);
}
.adm-nav-item.active .adm-nav-badge { background: var(--white); color: var(--olive); }

/* ── Content & Panels ── */
.adm-content { flex: 1; min-width: 0; }
.adm-content-inner {
  padding: 1rem;
  max-width: 1100px;
  margin: 0 auto;
  width: 100%;
  box-sizing: border-box;
}

.adm-panel { display: none; }
.adm-panel.active { display: block; animation: fadeIn 0.25s ease; }

.adm-panel-header {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.75rem;
  justify-content: space-between;
  margin-bottom: 1rem;
}
.adm-panel-header h2 {
  margin: 0;
  font-size: 1.25rem;
  font-weight: 900;
  color: var(--charcoal);
}
.adm-search {
  padding: 0.55rem 0.85rem;
  border: 1.5px solid rgba(232,217,196,0.7);
  border-radius: 0.65rem;
  font-size: 0.85rem;
  background: var(--white);
  font-family: inherit;
  color: var(--charcoal);
  flex: 1;
  min-width: 0;
  max-width: 260px;
  box-sizing: border-box;
}
.adm-search:focus { outline: none; border-color: var(--olive-light); }

/* ── Stats Grid ── */
.adm-stats-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 0.75rem;
  margin-bottom: 1.25rem;
}
.adm-stat-card {
  background: var(--white);
  border: 1px solid rgba(232,217,196,0.5);
  border-radius: 1rem;
  padding: 1rem;
  cursor: pointer;
  box-shadow: 0 1px 4px rgba(0,0,0,0.05);
  transition: all 0.2s;
  min-width: 0;
}
.adm-stat-card:active { transform: scale(0.98); }
.adm-stat-num {
  font-size: 1.6rem;
  font-weight: 900;
  color: var(--charcoal);
  line-height: 1.2;
}
.adm-stat-lbl {
  font-size: 0.74rem;
  font-weight: 700;
  color: var(--charcoal-50);
  margin-top: 0.25rem;
}
.adm-stat-card .adm-stat-accent { color: var(--olive); }

/* ── Generic Card ── */
.adm-card {
  background: var(--white);
  border: 1px solid rgba(232,217,196,0.5);
  border-radius: 1rem;
  padding: 1.1rem;
  margin-bottom: 0.85rem;
  box-shadow: 0 1px 4px rgba(0,0,0,0.04);
}
.adm-card h2 {
  margin: 0 0 0.8rem;
  font-size: 1.05rem;
  font-weight: 900;
  color: var(--charcoal);
}

/* ── Desktop layout ── */
@media (min-width: 1024px) {
  .adm-shell {
    display: grid;
    grid-template-columns: 260px 1fr;
    grid-template-rows: auto 1fr;
    padding-bottom: 0;
  }
  .adm-header { grid-column: 1 / -1; grid-row: 1; }
  .adm-sidebar {
    position: static;
    grid-column: 1;
    grid-row: 2;
    transform: none !important;
    width: auto;
    max-width: none;
    box-shadow: none;
    border-inline-end: 1px solid rgba(232,217,196,0.5);
    z-index: 1;
    padding-top: 0;
  }
  .adm-sidebar-overlay { display: none; }
  .adm-sidebar-toggle { display: none; }
  .adm-content { grid-column: 2; grid-row: 2; }
  .adm-stats-grid { grid-template-columns: repeat(3, 1fr); }
}

@media (max-width: 380px) {
  .adm-header-title { display: none; }
}


/* ── Admin: Quick Actions ── */
.adm-quick-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 0.6rem;
  margin-bottom: 1.25rem;
}
.adm-quick-btn {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  padding: 0.8rem 0.9rem;
  border: 1px solid rgba(232,217,196,0.6);
  background: var(--white);
  border-radius: 0.85rem;
  cursor: pointer;
  font-family: inherit;
  font-size: 0.82rem;
  font-weight: 800;
  color: var(--charcoal-80);
  transition: all 0.15s;
  text-align: start;
}
.adm-quick-btn:active { transform: scale(0.97); background: var(--olive-pale); }
.adm-quick-ico { font-size: 1.1rem; flex: none; }

/* ── Admin: Filter Chips ── */
.adm-chips {
  display: flex;
  gap: 0.45rem;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  padding-bottom: 0.35rem;
  margin-bottom: 0.9rem;
  scrollbar-width: none;
}
.adm-chips::-webkit-scrollbar { display: none; }
.adm-chip {
  flex: none;
  padding: 0.45rem 0.95rem;
  border-radius: 9999px;
  border: 1.5px solid rgba(232,217,196,0.8);
  background: var(--white);
  font-family: inherit;
  font-size: 0.78rem;
  font-weight: 800;
  color: var(--charcoal-80);
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
.adm-chip.active {
  background: var(--olive);
  border-color: var(--olive);
  color: var(--white);
}

/* ── Admin: Modal ── */
.adm-modal-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 700;
  align-items: flex-end;
  justify-content: center;
}
.adm-modal-backdrop.open { display: flex; }
.adm-modal {
  position: relative;
  background: var(--warm-white);
  width: 100%;
  max-width: 640px;
  max-height: 86vh;
  border-radius: 1.5rem 1.5rem 0 0;
  display: flex;
  flex-direction: column;
  animation: admSlideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 0 -8px 40px rgba(0,0,0,0.2);
}
@keyframes admSlideUp {
  from { transform: translateY(60px); opacity: 0; }
  to   { transform: translateY(0); opacity: 1; }
}
.adm-modal-close {
  position: absolute;
  top: 0.85rem;
  inset-inline-end: 0.85rem;
  width: 34px; height: 34px;
  border: none;
  border-radius: 50%;
  background: var(--sand);
  color: var(--charcoal-80);
  font-size: 0.95rem;
  font-weight: 800;
  cursor: pointer;
  z-index: 2;
  display: flex; align-items: center; justify-content: center;
}
.adm-modal-body {
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 1.5rem 1.1rem;
  padding-bottom: calc(1.5rem + env(safe-area-inset-bottom));
}
.adm-modal-title {
  font-size: 1.2rem;
  font-weight: 900;
  color: var(--charcoal);
  margin: 0 0 1rem;
  padding-inline-end: 2.5rem;
}
@media (min-width: 768px) {
  .adm-modal-backdrop { align-items: center; padding: 1.5rem; }
  .adm-modal { border-radius: 1.5rem; max-height: 80vh; }
}

/* ── Admin: Analytics ── */
.adm-bar-row { margin-bottom: 0.8rem; }
.adm-bar-top {
  display: flex;
  justify-content: space-between;
  font-size: 0.8rem;
  font-weight: 800;
  color: var(--charcoal-80);
  margin-bottom: 0.3rem;
  gap: 0.5rem;
}
.adm-bar-track {
  height: 10px;
  background: var(--sand);
  border-radius: 9999px;
  overflow: hidden;
}
.adm-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--olive), var(--olive-light));
  border-radius: 9999px;
  transition: width 0.5s ease;
}

.adm-lead-row {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 0.6rem 0;
  border-bottom: 1px solid rgba(232,217,196,0.4);
}
.adm-lead-row:last-child { border-bottom: none; }
.adm-lead-rank {
  width: 30px; height: 30px;
  flex: none;
  border-radius: 50%;
  background: var(--olive-pale);
  color: var(--olive);
  font-size: 0.8rem;
  font-weight: 900;
  display: flex; align-items: center; justify-content: center;
}
.adm-lead-name {
  flex: 1;
  min-width: 0;
  font-size: 0.88rem;
  font-weight: 800;
  color: var(--charcoal);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.adm-lead-val {
  flex: none;
  font-size: 0.78rem;
  font-weight: 800;
  color: var(--olive);
}

/* ── Admin: Notifications ── */
.adm-notif {
  display: flex;
  align-items: flex-start;
  gap: 0.75rem;
  background: var(--white);
  border: 1px solid rgba(232,217,196,0.5);
  border-radius: 1rem;
  padding: 0.9rem 1rem;
  margin-bottom: 0.65rem;
  cursor: pointer;
  transition: all 0.15s;
}
.adm-notif:active { transform: scale(0.99); background: var(--olive-pale); }
.adm-notif-ico { font-size: 1.25rem; flex: none; }
.adm-notif-txt { flex: 1; min-width: 0; }
.adm-notif-title { font-size: 0.86rem; font-weight: 800; color: var(--charcoal); }
.adm-notif-sub { font-size: 0.75rem; color: var(--charcoal-50); margin-top: 0.15rem; }

/* ── Admin: detail rows inside modal ── */
.adm-detail-row {
  display: flex;
  justify-content: space-between;
  gap: 0.75rem;
  padding: 0.6rem 0;
  border-bottom: 1px solid rgba(232,217,196,0.4);
  font-size: 0.85rem;
}
.adm-detail-row:last-of-type { border-bottom: none; }
.adm-detail-k { color: var(--charcoal-50); font-weight: 700; flex: none; }
.adm-detail-v { color: var(--charcoal); font-weight: 800; text-align: end; word-break: break-word; min-width: 0; }

</style>

/* ══════════════════════════════════════════
   3. VALIDATORS
   ══════════════════════════════════════════ */
const Validators = {
  /** Check email format (RFC 5322) */
  isEmail(v) {
    return typeof v === 'string' && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim());
  },
  /** Check phone — allows digits, spaces, dashes, plus */
  isPhone(v) {
    return !v || /^\+?[\d\s\-\(\)]{7,}$/.test(v.trim());
  },
  /** Non-empty string after trim */
  isRequired(v) {
    return v !== null && v !== undefined && String(v).trim().length > 0;
  },
  /** Password: 8+ characters */
  isPassword(v) {
    return typeof v === 'string' && v.length >= 8;
  },
  /** Name: 2–100 characters */
  isName(v) {
    return typeof v === 'string' && v.trim().length >= 2 && v.trim().length <= 100;
  },
  /** Positive integer */
  isPositiveInt(v) {
    const n = parseInt(v);
    return !isNaN(n) && n >= 1;
  },
  /** Valid campaign category key */
  isCampCategory(v) {
    return Object.keys(CONFIG.CAMP_CATEGORIES).includes(v);
  },
  /** Valid sponsor type */
  isSponsorType(v) {
    return ['gov','private','ngo','individual'].includes(v);
  },

  /** Validate full signup form — returns { valid, errors:{field:msg} } */
  signup(data) {
    const errors = {};
    if (!this.isName(data.name))      errors.name     = t('errorNameLength');
    if (!this.isEmail(data.email))    errors.email    = t('errorEmailFormat');
    if (!this.isPassword(data.password)) errors.password = t('errorPasswordLength');
    if (!this.isRequired(data.phone)) errors.phone    = t('errorRequired');
    if (!this.isRequired(data.country)) errors.country = t('errorRequired');
    if (!this.isRequired(data.city))  errors.city     = t('errorRequired');
    return { valid: Object.keys(errors).length === 0, errors };
  },

  /** Validate login form */
  login(data) {
    const errors = {};
    if (!this.isRequired(data.identifier)) errors.identifier = t('errorRequired');
    if (!this.isRequired(data.password))   errors.password   = t('errorRequired');
    return { valid: Object.keys(errors).length === 0, errors };
  },

  /** Validate campaign creation form */
  campaign(data) {
    const errors = {};
    if (!this.isRequired(data.title))       errors.title    = t('errorRequired');
    if (!this.isCampCategory(data.category)) errors.category = t('errorRequired');
    if (!this.isRequired(data.location))    errors.location = t('errorRequired');
    if (!this.isRequired(data.date))        errors.date     = t('errorRequired');
    if (!this.isPositiveInt(data.needed))   errors.needed   = t('errorRequired');
    return { valid: Object.keys(errors).length === 0, errors };
  },

  /** Validate partner request form */
  partner(data) {
    const errors = {};
    if (!this.isRequired(data.org))      errors.org     = t('errorRequired');
    if (!this.isRequired(data.contact))  errors.contact = t('errorRequired');
    if (!this.isEmail(data.email))       errors.email   = t('errorEmailFormat');
    if (!this.isRequired(data.phone))    errors.phone   = t('errorRequired');
    if (!this.isSponsorType(data.type))  errors.type    = t('errorRequired');
    if (!this.isRequired(data.msg))      errors.msg     = t('errorRequired');
    return { valid: Object.keys(errors).length === 0, errors };
  }
};

/* ══════════════════════════════════════════
   4. DATABASE (Persistence Layer)
   ══════════════════════════════════════════ */
const DB = {
  get(key) {
    try {
      const raw = localStorage.getItem(key);
      if (!raw) return [];
      const parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : [];
    } catch (e) {
      console.error('[DB.get] Failed to parse key:', key, e);
      return [];
    }
  },
  getObj(key) {
    try {
      const raw = localStorage.getItem(key);
      if (!raw) return null;
      return JSON.parse(raw);
    } catch (e) {
      console.error('[DB.getObj] Failed to parse key:', key, e);
      return null;
    }
  },
  set(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
      return true;
    } catch (e) {
      console.error('[DB.set] Failed to save key:', key, e);
      return false;
    }
  },
  setObj(key, value) {
    return this.set(key, value);
  },
  remove(key) {
    try { localStorage.removeItem(key); return true; }
    catch (e) { return false; }
  }
};

  /** Safely get text from campaign for current language */
  getCampText(c) {
    if (!c) return { title: 'Campaign', desc: '', cat: 'مبادرة' };
    const obj = c[State.lang] || c.ar || c.en;
    if (obj && obj.title) return obj;
    return {
      title: c.title || 'Campaign',
      desc:  c.desc  || '',
      cat:   c.category || 'مبادرة'
    };
  },

  /** Get status display info */
  getStatusInfo(status) {
    return CONFIG.CAMP_STATUS[status] || CONFIG.CAMP_STATUS.pending;
  }
};

/* ══════════════════════════════════════════
   7. SERVICES (Business Logic)
   ══════════════════════════════════════════ */
const UserService = {
  getAll() { return DB.get(CONFIG.DB_KEYS.USERS); },

  getById(id) {
    if (!id) return null;
    return this.getAll().find(u => u.id === id) || null;
  },

  getByEmail(email) {
    if (!email) return null;
    const lower = email.toLowerCase().trim();
    return this.getAll().find(u => u.email === lower) || null;
  },

  getByPhone(phone) {
    if (!phone) return null;
    return this.getAll().find(u => u.phone === phone.trim()) || null;
  },

  save(users) { return DB.set(CONFIG.DB_KEYS.USERS, users); },

  updateById(id, changes) {
    const users = this.getAll();
    const idx = users.findIndex(u => u.id === id);
    if (idx === -1) return false;
    users[idx] = { ...users[idx], ...changes, updatedAt: new Date().toISOString() };
    this.save(users);
    // Keep session in sync
    if (State.cu && State.cu.id === id) {
      State.setUser(users[idx]);
      DB.setObj(CONFIG.DB_KEYS.SESSION, users[idx]);
    }
    return users[idx];
  },

  approve(id) { return this.updateById(id, { status: 'approved', joinedDate: new Date().toISOString() }); },
  reject(id)  { return this.updateById(id, { status: 'rejected' }); }
};

const CampaignService = {
  getAll()   { return DB.get(CONFIG.DB_KEYS.CAMPS); },

  getById(id) {
    if (!id) return null;
    return this.getAll().find(c => c.id === id) || null;
  },

  /** Get visible campaigns (approved, under_process, done, OR created by current user) */
  getVisible() {
    return this.getAll().filter(c =>
      c.status === 'approved' ||
      c.status === 'under_process' ||
      c.status === 'done' ||
      (State.cu && c.createdBy === State.cu.id)
    );
  },

  save(camps) { return DB.set(CONFIG.DB_KEYS.CAMPS, camps); },

  add(camp) {
    const camps = this.getAll();
    camps.unshift(camp);
    return this.save(camps);
  },

  updateById(id, changes) {
    const camps = this.getAll();
    const idx = camps.findIndex(c => c.id === id);
    if (idx === -1) return false;
    camps[idx] = { ...camps[idx], ...changes, updatedAt: new Date().toISOString() };
    this.save(camps);
    return camps[idx];
  },

  approve(id)       { return this.updateById(id, { status: 'approved' }); },
  reject(id)        { return this.updateById(id, { status: 'rejected' }); },
  markUnderProcess(id) { return this.updateById(id, { status: 'under_process' }); },
  markDone(id)      {
    const camp = this.getById(id);
    if (!camp) return false;
    // Grant achievements to all joined users
    const users = UserService.getAll();
    (camp.joinedUsers || []).forEach(uid => {
      const idx = users.findIndex(u => u.id === uid);
      if (idx !== -1) {
        users[idx].achievements = (users[idx].achievements || 0) + 1;
        users[idx].updatedAt = new Date().toISOString();
      }
    });
    DB.set(CONFIG.DB_KEYS.USERS, users);
    return this.updateById(id, { status: 'done', completedAt: new Date().toISOString() });
  },

  /** Join a campaign — returns { success, message } */
  join(campId, user) {
    if (!user) return { success: false, message: t('errorLogin') };
    if (user.status !== 'approved') return { success: false, message: t('errorStatus') };

    const camps = this.getAll();
    const ci = camps.findIndex(c => c.id === campId);
    if (ci === -1) return { success: false, message: 'Campaign not found' };

    const camp = camps[ci];
    if ((camp.joinedUsers || []).includes(user.id)) return { success: false, message: t('joinedBtn') };
    if (camp.status === 'done')     return { success: false, message: t('campDone') };
    if (camp.status === 'rejected') return { success: false, message: t('campUnavailable') };
    if (camp.status === 'pending')  return { success: false, message: t('campUnavailable') };
    if (camp.volunteers >= camp.needed) return { success: false, message: t('campFull') };

    // Update campaign
    camps[ci].volunteers = (camps[ci].volunteers || 0) + 1;
    camps[ci].joinedUsers = [...(camps[ci].joinedUsers || []), user.id];
    if (camps[ci].volunteers >= camps[ci].needed) {
      camps[ci].status = 'under_process';
    }
    camps[ci].updatedAt = new Date().toISOString();
    this.save(camps);

    // Update user
    const hours = camp.volunteerHours || 2;
    const updated = UserService.updateById(user.id, {
      volunteerHours:   (user.volunteerHours   || 0) + hours,
      activitiesJoined: (user.activitiesJoined || 0) + 1,
      joinedCamps:      [...(user.joinedCamps  || []), campId]
    });

    const msg = `✓ ${t('successJoined')} +${hours} ${State.lang === 'ar' ? 'ساعة' : 'hrs'}`;
    return { success: true, message: msg, updatedUser: updated };
  }
};

const PartnerService = {
  getAll()    { return DB.get(CONFIG.DB_KEYS.PARTNERS); },
  add(p)      {
    const list = this.getAll();
    list.unshift(p);
    return DB.set(CONFIG.DB_KEYS.PARTNERS, list);
  }
};

/** Show a toast notification */
function toast(msg, type = 'success') {
  // Remove existing toasts
  document.querySelectorAll('.toast').forEach(el => el.remove());
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => { if (el.parentNode) el.remove(); }, 3200);
}

/** Set button loading state */
function setLoading(btn, loading) {
  if (!btn) return;
  btn.disabled = loading;
  if (loading) {
    btn._origText = btn.textContent;
    btn.textContent = State.lang === 'ar' ? '⏳ جاري...' : '⏳ Loading...';
  } else {
    btn.textContent = btn._origText || btn.textContent;
  }
}

/** Show inline form error under a field */
function showFieldError(form, fieldName, msg) {
  if (!form) return;
  const input = form.querySelector(`[name="${fieldName}"]`);
  if (!input) return;
  // Remove old error
  const old = form.querySelector(`.field-err-${fieldName}`);
  if (old) old.remove();
  if (!msg) return;
  const err = document.createElement('div');
  err.className = `field-err field-err-${fieldName}`;
  err.style.cssText = 'color:#c84c3c;font-size:0.75rem;margin-top:0.25rem;';
  err.textContent = msg;
  input.parentNode.insertBefore(err, input.nextSibling);
  input.style.borderColor = '#c84c3c';
}

/** Clear all field errors in a form */
function clearFieldErrors(form) {
  if (!form) return;
  form.querySelectorAll('.field-err').forEach(el => el.remove());
  form.querySelectorAll('input, select, textarea').forEach(el => {
    el.style.borderColor = '';
  });
}

/** Convert file to base64 */
function b64(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload  = () => res(r.result);
    r.onerror = () => rej(new Error('File read error'));
    r.readAsDataURL(file);
  });
}

/** Open image viewer overlay */
function openImageViewer(src) {
  if (!src) return;
  const modal = document.createElement('div');
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.95);display:flex;align-items:center;justify-content:center;z-index:9999;cursor:zoom-out;';
  modal.innerHTML = `
    <div style="position:relative;max-width:92vw;max-height:92vh;" onclick="event.stopPropagation()">
      <img src="${src}" style="max-width:100%;max-height:88vh;object-fit:contain;border-radius:0.5rem;">
      <button onclick="this.closest('[style*=fixed]').remove()" style="position:absolute;top:-1rem;right:-1rem;background:rgba(255,255,255,0.15);color:white;border:none;width:36px;height:36px;border-radius:50%;font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);">✕</button>
    </div>`;
  modal.onclick = () => modal.remove();
  document.body.appendChild(modal);
}

/** Render a single campaign card HTML */
function campCardHTML(c) {
  try {
    const joined = (State.cu?.joinedCamps || []).includes(c.id);
    const txt    = Models.getCampText(c);
    const pct    = c.needed ? Math.min(100, Math.round(((c.volunteers || 0) / c.needed) * 100)) : 0;
    const si     = Models.getStatusInfo(c.status);
    const fallbackColor = ['#3a4a28','#2d3a1e','#4a5a32','#1e2a14'][parseInt(String(c.id).slice(-1)) % 4] || '#3a4a28';
    const title    = txt.title   || 'Campaign';
    const desc     = txt.desc    || '';
    const cat      = txt.cat     || 'مبادرة';
    const location = c.location  || '';
    const date     = c.date      || '';
    const phone    = c.creatorPhone || '';
    const vol      = c.volunteers   || 0;
    const needed   = c.needed       || 0;

    const imgHtml = c.img
      ? `<img src="${c.img}" alt="${title}" loading="lazy" style="width:100%;height:100%;object-fit:cover;display:block;" onclick="event.stopPropagation();openImageViewer('${c.img}')" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
        + `<div class="camp-img-fallback" style="display:none;background:${fallbackColor}">🌿</div>`
      : `<div class="camp-img-fallback" style="background:${fallbackColor}">🌿</div>`;

    let joinBtnHtml = '';
    if (c.status === 'done') {
      joinBtnHtml = `<button class="join-btn" disabled style="opacity:0.5;">✓ ${State.lang === 'ar' ? 'منتهية' : 'Ended'}</button>`;
    } else if (c.status === 'rejected') {
      joinBtnHtml = `<button class="join-btn" disabled style="opacity:0.5;background:#ef4444;">✕ ${State.lang === 'ar' ? 'مرفوضة' : 'Rejected'}</button>`;
    } else if (vol >= needed && needed > 0) {
      joinBtnHtml = `<button class="join-btn" disabled style="opacity:0.5;background:#f59e0b;">📋 ${State.lang === 'ar' ? 'امتلأت' : 'Full'}</button>`;
    } else if (c.status === 'approved' || c.status === 'under_process') {
      joinBtnHtml = `<button class="join-btn" onclick="event.stopPropagation();handleJoin('${c.id}')" ${joined ? 'disabled' : ''}>${joined ? t('joinedBtn') : t('joinBtn')}</button>`;
    } else {
      joinBtnHtml = `<button class="join-btn" disabled>${t('unavailBtn')}</button>`;
    }

    return `
    <div class="camp-card" onclick="openDetail('${c.id}')">
      <div class="camp-img">${imgHtml}<div class="camp-img-overlay"></div>
        <span class="camp-badge camp-badge-status ${si.cls}">${si[State.lang]}</span>
        <span class="camp-badge camp-badge-cat">${cat}</span>
      </div>
      <div class="camp-body">
        <div class="camp-title">${title}</div>
        <div class="camp-desc">${desc}</div>
        <div class="camp-meta">
          ${location ? `<div class="camp-meta-row"><div class="camp-meta-dot"></div>${location}</div>` : ''}
          ${date     ? `<div class="camp-meta-row"><div class="camp-meta-dot"></div>${date}</div>`     : ''}
          ${phone    ? `<div class="camp-meta-row"><div class="camp-meta-dot"></div>📞 ${phone}</div>` : ''}
        </div>
        <div class="prog-track"><div class="prog-fill" style="width:${pct}%"></div></div>
        <div class="prog-label">${vol} ${t('of')} ${needed}</div>
        <div class="camp-footer">
          <div class="camp-pct"><strong>${pct}%</strong> ${t('complete')}</div>
          ${joinBtnHtml}
        </div>
      </div>
    </div>`;
  } catch (e) {
    console.error('[campCardHTML] Error:', e);
    return '';
  }
}

function admTimeAgo(iso) {
  if (!iso) return '';
  const isAr = State.lang === 'ar';
  const diff = Date.now() - new Date(iso).getTime();
  const m = Math.floor(diff / 60000);
  if (m < 1)    return isAr ? 'الآن' : 'now';
  if (m < 60)   return isAr ? ('منذ ' + m + ' د') : (m + 'm ago');
  const h = Math.floor(m / 60);
  if (h < 24)   return isAr ? ('منذ ' + h + ' س') : (h + 'h ago');
  const d = Math.floor(h / 24);
  if (d < 30)   return isAr ? ('منذ ' + d + ' يوم') : (d + 'd ago');
  return new Date(iso).toLocaleDateString();
}

function admRenderOverview(users, camps, partners) {
  try {
    users    = users    || UserService.getAll();
    camps    = camps    || CampaignService.getAll();
    partners = partners || PartnerService.getAll();
    const isAr = State.lang === 'ar';

    const approvedUsers = users.filter(u => u.status === 'approved').length;
    const pendingUsers  = users.filter(u => u.status === 'pending');
    const activeCamps   = camps.filter(c => c.status === 'approved' || c.status === 'under_process').length;
    const pendingCamps  = camps.filter(c => c.status === 'pending');
    const totalHours    = Math.round(users.reduce((s, u) => s + (parseFloat(u.volunteerHours) || 0), 0));

    const stats = [
      { num: users.length,        lbl: isAr ? 'إجمالي المستخدمين' : 'Total Users',      kind: 'totalUsers' },
      { num: approvedUsers,       lbl: isAr ? 'مستخدمين مفعّلين'  : 'Approved Users',   kind: 'approvedUsers' },
      { num: pendingUsers.length, lbl: isAr ? 'بانتظار الموافقة'  : 'Pending Users',    kind: 'pendingUsers', accent: true },
      { num: camps.length,        lbl: isAr ? 'إجمالي الحملات'    : 'Total Campaigns',  kind: 'totalCamps' },
      { num: activeCamps,         lbl: isAr ? 'حملات نشطة'        : 'Active Campaigns', kind: 'activeCamps', accent: true },
      { num: totalHours,          lbl: isAr ? 'ساعات التطوع'      : 'Volunteer Hours',  kind: 'hours' }
    ];

    const grid = admEl('admStatsGrid');
    if (grid) {
      grid.innerHTML = stats.map(s =>

          '<div class="adm-stat-lbl">' + s.lbl + '</div>' +
        '</div>'
      ).join('');
    }

    // Quick actions
    const qa = admEl('admQuickActions');
    if (qa) {
      const acts = [
        { icon: '👥', ar: 'المستخدمين',  en: 'Users',     panel: 'users' },
        { icon: '📋', ar: 'الحملات',     en: 'Campaigns', panel: 'campaigns' },
        { icon: '🤝', ar: 'الشراكات',    en: 'Partners',  panel: 'partners' },
        { icon: '📊', ar: 'الإحصائيات',  en: 'Analytics', panel: 'analytics' }
      ];
      qa.innerHTML = acts.map(a =>
        '<button class="adm-quick-btn" onclick="admSwitchPanel(\'' + a.panel + '\')">' +

          '<span>' + (isAr ? a.ar : a.en) + '</span>' +

      ).join('');

      pendingUsers.forEach(u => {
        html +=
          '<div class="admin-card" onclick="admViewUser(\'' + u.id + '\')" style="cursor:pointer;">' +
            '<div class="admin-card-head">' +
              '<div class="admin-ava">' + (u.profilePic ? '<img src="' + u.profilePic + '" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">' : '👤') + '</div>' +
              '<div class="admin-info">' +
                '<div class="admin-info-name">' + (u.name || '') + '</div>' +
                '<div class="admin-info-row">' + (isAr ? 'حساب جديد بانتظار الموافقة' : 'New account awaiting approval') + ' · ' + admTimeAgo(u.createdAt) + '</div>' +

            '</div>' +
            '<div class="admin-actions">' +
              '<button class="approve-btn" onclick="event.stopPropagation();handleApproveUser(\'' + u.id + '\')">✓ ' + (isAr ? 'قبول' : 'Approve') + '</button>' +
              '<button class="reject-btn" onclick="event.stopPropagation();handleRejectUser(\'' + u.id + '\')">✕ ' + (isAr ? 'رفض' : 'Reject') + '</button>' +
            '</div>' +
          '</div>';
      });
      pendingCamps.forEach(c => {
        const txt = Models.getCampText(c);
        html +=
          '<div class="admin-card" onclick="admViewCamp(\'' + c.id + '\')" style="cursor:pointer;">' +
            '<div class="admin-info">' +
              '<div class="admin-info-name">📍 ' + (txt.title || '') + '</div>' +

              '<button class="reject-btn" onclick="event.stopPropagation();handleRejectCamp(\'' + c.id + '\')">✕ ' + (isAr ? 'رفض' : 'Reject') + '</button>' +
            '</div>' +
          '</div>';
      });
      pl.innerHTML = html || admEmpty('✅', isAr ? 'لا يوجد طلبات معلّقة' : 'No pending reviews');
    }

    // Recent activity
    const al = admEl('admActivityList');
    if (al) {
      const events = [];
      users.forEach(u => { if (u.createdAt) events.push({ d: u.createdAt, icon: '👤', txt: (isAr ? 'انضم: ' : 'Joined: ') + (u.name || '') }); });
      camps.forEach(c => { if (c.createdAt) events.push({ d: c.createdAt, icon: '📋', txt: (isAr ? 'حملة: ' : 'Campaign: ') + (Models.getCampText(c).title || '') }); });
      partners.forEach(p => { if (p.date) events.push({ d: p.date, icon: '🤝', txt: (isAr ? 'طلب شراكة: ' : 'Partner request: ') + (p.org || '') }); });
      events.sort((a, b) => new Date(b.d) - new Date(a.d));
      al.innerHTML = events.length === 0
        ? admEmpty('🕐', isAr ? 'لا يوجد نشاطات بعد' : 'No activity yet')

            '<span style="flex:none;font-size:0.72rem;color:#999;">' + admTimeAgo(ev.d) + '</span>' +
          '</div>'
        ).join('');
    }
  } catch (e) {
    console.error('[admRenderOverview] Error:', e);
  }
}

/* ── Stat detail modal ── */
function admStatDetail(kind) {
  try {
    const isAr = State.lang === 'ar';
    const users = UserService.getAll();
    const camps = CampaignService.getAll();
    let title = '', rows = [], panel = 'users';

    const userRow = u =>
      '<div style="display:flex;align-items:center;gap:0.6rem;padding:0.55rem 0;border-bottom:1px solid #f0ece2;cursor:pointer;" onclick="admViewUser(\'' + u.id + '\')">' +
        '<span style="flex:1;font-size:0.88rem;font-weight:700;color:#1a1a1a;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + (u.name || '') + '</span>' +
        admStatusChip(u.status) +
      '</div>';
    const campRow = c => {
      const txt = Models.getCampText(c);
      return '<div style="display:flex;align-items:center;gap:0.6rem;padding:0.55rem 0;border-bottom:1px solid #f0ece2;cursor:pointer;" onclick="admViewCamp(\'' + c.id + '\')">' +
        '<span style="flex:1;font-size:0.88rem;font-weight:700;color:#1a1a1a;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + (txt.title || '') + '</span>' +
        admStatusChip(c.status) +
      '</div>';
    };

    if (kind === 'totalUsers')    { title = isAr ? 'إجمالي المستخدمين' : 'Total Users';      rows = users.map(userRow); panel = 'users'; }
    if (kind === 'approvedUsers') { title = isAr ? 'مستخدمين مفعّلين'  : 'Approved Users';   rows = users.filter(u => u.status === 'approved').map(userRow); panel = 'users'; }
    if (kind === 'pendingUsers')  { title = isAr ? 'بانتظار الموافقة'  : 'Pending Users';    rows = users.filter(u => u.status === 'pending').map(userRow); panel = 'users'; }
    if (kind === 'totalCamps')    { title = isAr ? 'إجمالي الحملات'    : 'Total Campaigns';  rows = camps.map(campRow); panel = 'campaigns'; }
    if (kind === 'activeCamps')   { title = isAr ? 'حملات نشطة'        : 'Active Campaigns'; rows = camps.filter(c => c.status === 'approved' || c.status === 'under_process').map(campRow); panel = 'campaigns'; }
    if (kind === 'hours') {
      title = isAr ? 'ساعات التطوع' : 'Volunteer Hours';
      panel = 'analytics';
      rows = users.filter(u => (u.volunteerHours || 0) > 0)
        .sort((a, b) => (b.volunteerHours || 0) - (a.volunteerHours || 0))
        .map(u =>
          '<div style="display:flex;align-items:center;gap:0.6rem;padding:0.55rem 0;border-bottom:1px solid #f0ece2;cursor:pointer;" onclick="admViewUser(\'' + u.id + '\')">' +
            '<span style="flex:1;font-size:0.88rem;font-weight:700;color:#1a1a1a;">' + (u.name || '') + '</span>' +
            '<span style="font-weight:800;color:#5a6b3a;font-size:0.85rem;">' + (u.volunteerHours || 0) + (isAr ? ' س' : ' h') + '</span>' +
          '</div>');
    }

    admOpenModal(
      '<h3 style="margin:0 0 1rem;font-size:1.15rem;font-weight:900;color:#1a1a1a;">' + title + ' <span style="font-size:0.8rem;font-weight:800;color:#888;">(' + rows.length + ')</span></h3>' +
      (rows.length ? rows.join('') : admEmpty('📭', isAr ? 'لا يوجد بيانات' : 'No data')) +
      '<button style="margin-top:1.1rem;width:100%;padding:0.8rem;border:none;border-radius:0.75rem;background:#5a6b3a;color:#fff;font-weight:800;font-size:0.9rem;cursor:pointer;font-family:inherit;" onclick="admSwitchPanel(\'' + panel + '\')">' + (isAr ? 'عرض القسم كاملاً' : 'Open full section') + '</button>'
    );
  } catch (e) {
    console.error('[admStatDetail] Error:', e);
  }
}

/* ── Users panel (with filter chips) ── */
function admSetUserFilter(f) { AdminUI.userFilter = f; admRenderUsers(); }

function admRenderUsers() {
  try {
    const list = admEl('admUsersList');
    if (!list) return;
    const isAr = State.lang === 'ar';
    const local = String((admEl('admUserSearch') || {}).value || '').toLowerCase().trim();
    const q = local || AdminUI.q;

    // Chips
    const chips = admEl('admUserChips');
    if (chips) {
      const all = UserService.getAll();
      const opts = [
        { k: 'all',      ar: 'الكل',          en: 'All',      n: all.length },
        { k: 'pending',  ar: 'قيد المراجعة',  en: 'Pending',  n: all.filter(u => u.status === 'pending').length },
        { k: 'approved', ar: 'مفعّل',          en: 'Approved', n: all.filter(u => u.status === 'approved').length },
        { k: 'rejected', ar: 'مرفوض',          en: 'Rejected', n: all.filter(u => u.status === 'rejected').length }
      ];
      chips.innerHTML = opts.map(o =>
        '<button class="adm-chip' + (AdminUI.userFilter === o.k ? ' active' : '') + '" onclick="admSetUserFilter(\'' + o.k + '\')">' + (isAr ? o.ar : o.en) + ' (' + o.n + ')</button>'
      ).join('');
    }

    let users = UserService.getAll();
    if (AdminUI.userFilter !== 'all') users = users.filter(u => u.status === AdminUI.userFilter);
    if (q) {
      users = users.filter(u =>
        String(u.name  || '').toLowerCase().includes(q) ||
        String(u.email || '').toLowerCase().includes(q) ||
        String(u.phone || '').toLowerCase().includes(q) ||
        String(u.city  || '').toLowerCase().includes(q)
      );
    }

    list.innerHTML = users.length === 0
      ? admEmpty('👤', isAr ? 'لا يوجد مستخدمين' : 'No users found')
      : users.map(u =>
        '<div class="admin-card" onclick="admViewUser(\'' + u.id + '\')" style="cursor:pointer;">' +
          '<div class="admin-card-head">' +
            '<div class="admin-ava">' + (u.profilePic ? '<img src="' + u.profilePic + '" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">' : '👤') + '</div>' +
            '<div class="admin-info">' +
              '<div class="admin-info-name">' + (u.name || '') + ' ' + admStatusChip(u.status) + '</div>' +
              '<div class="admin-info-row">📧 ' + (u.email || '') + '</div>' +
              '<div class="admin-info-row">🏙️ ' + [u.city, u.country].filter(Boolean).join(', ') + ' · 🕐 ' + (u.volunteerHours || 0) + (isAr ? ' س' : ' h') + '</div>' +
            '</div>' +
          '</div>' +
          (u.status === 'pending'
            ? '<div class="admin-actions">' +
                '<button class="approve-btn" onclick="event.stopPropagation();handleApproveUser(\'' + u.id + '\')">✓ ' + (isAr ? 'قبول' : 'Approve') + '</button>' +
                '<button class="reject-btn" onclick="event.stopPropagation();handleRejectUser(\'' + u.id + '\')">✕ ' + (isAr ? 'رفض' : 'Reject') + '</button>' +
              '</div>'
            : '') +
        '</div>'
      ).join('');
  } catch (e) {
    console.error('[admRenderUsers] Error:', e);
  }
}

    let camps = CampaignService.getAll();

        return String(txt.title || '').toLowerCase().includes(q) ||
               String(c.location || '').toLowerCase().includes(q) ||
               String(c.creatorName || '').toLowerCase().includes(q);

    list.innerHTML = camps.length === 0
      ? admEmpty('📋', isAr ? 'لا يوجد حملات' : 'No campaigns found')
      : camps.map(c => {
        const txt = Models.getCampText(c);

          actions = '<button class="approve-btn" style="flex:1;" onclick="event.stopPropagation();handleCampUnderProcess(\'' + c.id + '\')">' + (isAr ? 'قيد التنفيذ' : 'In Progress') + '</button>' +
                    '<button class="approve-btn" style="flex:1;background:#8b5cf6;" onclick="event.stopPropagation();handleCampDone(\'' + c.id + '\')">' + (isAr ? 'تم انجازها' : 'Mark Done') + '</button>';
        } else if (c.status === 'under_process') {
          actions = '<button class="approve-btn" style="flex:1;" onclick="event.stopPropagation();handleCampDone(\'' + c.id + '\')">' + (isAr ? 'تم انجازها' : 'Mark Done') + '</button>';
        }

          '</div>' +

      }).join('');
  } catch (e) {
    console.error('[admRenderCampaigns] Error:', e);
  }
}
