/* ── Analytics panel ── */
function admRenderAnalytics(users, camps) {
  try {
    users = users || UserService.getAll();
    camps = camps || CampaignService.getAll();
    const isAr = State.lang === 'ar';

    // Campaigns by category
    const catEl = admEl('admChartCats');
    if (catEl) {
      const counts = {};
      camps.forEach(c => { const k = c.category || 'other'; counts[k] = (counts[k] || 0) + 1; });
      const keys = Object.keys(counts);
      const max = Math.max.apply(null, keys.map(k => counts[k]).concat([1]));
      const colors = ['#5a6b3a', '#8a9a6a', '#c47d1a', '#1d4ed8', '#7c3aed', '#c84c3c'];
      catEl.innerHTML = keys.length === 0
        ? admEmpty('📊', isAr ? 'لا يوجد حملات بعد' : 'No campaigns yet')
        : keys.map((k, i) => {
            const cfg = (CONFIG.CAMP_CATEGORIES || {})[k] || {};
            const label = isAr ? (cfg.ar || k) : (cfg.en || k);
            return admBar(label, counts[k], max, colors[i % colors.length]);
          }).join('');
    }

    // Top volunteers leaderboard
    const lb = admEl('admLeaderboard');
    if (lb) {
      const top = users.filter(u => (u.volunteerHours || 0) > 0)
        .sort((a, b) => (b.volunteerHours || 0) - (a.volunteerHours || 0))
        .slice(0, 5);
      const medals = ['🥇', '🥈', '🥉', '4', '5'];
      lb.innerHTML = top.length === 0
        ? admEmpty('🏆', isAr ? 'لا يوجد ساعات تطوع بعد' : 'No volunteer hours yet')
        : top.map((u, i) =>
          '<div class="adm-lead-row" style="display:flex;align-items:center;gap:0.7rem;padding:0.6rem 0;border-bottom:1px solid #f0ece2;cursor:pointer;" onclick="admViewUser(\'' + u.id + '\')">' +
            '<span style="flex:none;width:28px;text-align:center;font-weight:900;font-size:' + (i < 3 ? '1.1rem' : '0.85rem') + ';color:#888;">' + medals[i] + '</span>' +
            '<span style="flex:1;font-size:0.88rem;font-weight:700;color:#1a1a1a;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + (u.name || '') + '</span>' +
            '<span style="flex:none;font-weight:800;color:#5a6b3a;font-size:0.85rem;">' + (u.volunteerHours || 0) + (isAr ? ' س' : ' h') + '</span>' +
          '</div>'
        ).join('');
    }

    // Volunteers by city
    const cityEl = admEl('admChartCities');
    if (cityEl) {
      const counts = {};
      users.forEach(u => { const k = (u.city || '').trim(); if (k) counts[k] = (counts[k] || 0) + 1; });
      const keys = Object.keys(counts).sort((a, b) => counts[b] - counts[a]).slice(0, 6);
      const max = Math.max.apply(null, keys.map(k => counts[k]).concat([1]));
      cityEl.innerHTML = keys.length === 0
        ? admEmpty('🏙️', isAr ? 'لا يوجد بيانات مدن' : 'No city data')
        : keys.map(k => admBar(k, counts[k], max, '#8a9a6a')).join('');
    }
  } catch (e) {
    console.error('[admRenderAnalytics] Error:', e);
  }
}

/** Open campaign detail page */
function openDetail(id) {
  try {
    const c = CampaignService.getById(id);
    if (!c) { console.warn('[openDetail] Campaign not found:', id); return; }

    State.prevPage = State.currentPage;
    State.detailCampId = id;

    const txt = Models.getCampText(c);
    const si  = Models.getStatusInfo(c.status);
    const pct = c.needed ? Math.min(100, Math.round(((c.volunteers || 0) / c.needed) * 100)) : 0;

    // Hero
    const hero = document.getElementById('detailHero');
    if (hero) {
      hero.innerHTML = '';
      hero.style.background = '';
      if (c.img) {
        const img = document.createElement('img');
        img.src = c.img;
        img.alt = txt.title;
        img.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block;';
        img.onerror = () => { hero.style.background = 'linear-gradient(135deg,#3a4a28,#5a6b3a)'; img.remove(); };
        hero.appendChild(img);
      } else {
        hero.style.background = 'linear-gradient(135deg,#3a4a28,#5a6b3a)';
      }
      const overlay = document.createElement('div');
      overlay.className = 'detail-hero-overlay';
      hero.appendChild(overlay);

      const backBtn = document.createElement('button');
      backBtn.className = 'detail-back';
      backBtn.id = 'detailBackBtn';
      backBtn.textContent = State.lang === 'ar' ? '‹' : '›';
      backBtn.addEventListener('click', goBack);
      hero.appendChild(backBtn);
    }

    const set = (id, val) => { const el = document.getElementById(id); if (el) el.textContent = val; };
    set('dCat',      txt.cat || '');
    set('dTitle',    txt.title || '');
    set('dDesc',     txt.desc || '');
    set('dDate',     c.date || '');
    set('dLoc',      c.location || '');
    set('dVol',      `${c.volunteers || 0} / ${c.needed || 0}`);
    set('dOrg',      c.creatorName || '');
    set('dPhone',    c.creatorPhone ? `📞 ${c.creatorPhone}` : '');
    set('dPct',      pct + '%');
    set('dVolCount', `${c.volunteers || 0} ${t('of')} ${c.needed || 0}`);

    const bar = document.getElementById('dBar');
    if (bar) bar.style.width = pct + '%';

    _updateDetailJoinBtn(id);
    goPage('detail');
  } catch (e) {
    console.error('[openDetail] Error:', e);
  }
}

function _updateDetailJoinBtn(id) {
  const btn = document.getElementById('dJoinBtn');
  if (!btn) return;
  const c = CampaignService.getById(id);
  if (!c) return;
  const joined = (State.cu?.joinedCamps || []).includes(id);
  btn.textContent = joined ? t('joinedBtn') : t('joinBtn');
  btn.disabled    = joined || (c.status !== 'approved' && c.status !== 'under_process');
  btn.onclick     = () => handleJoin(id);
}

/** Animate home stat counters */
function animateCounters() {
  try {
    const users = UserService.getAll();
    const camps = CampaignService.getAll();
    const targets = {
      cUsers: users.length,
      cCamps: camps.filter(c => c.status === 'done').length,
      cHours: users.reduce((s, u) => s + (u.volunteerHours || 0), 0),
      cCities: 20
    };
    Object.entries(targets).forEach(([id, target]) => {
      const el = document.getElementById(id);
      if (!el) return;
      let count = 0;
      const step = Math.max(1, Math.ceil(target / 60));
      const timer = setInterval(() => {
        count = Math.min(count + step, target);
        el.textContent = id === 'cCities' ? count + '+' : count.toLocaleString('en-US');
        if (count >= target) clearInterval(timer);
      }, 22);
    });
  } catch (e) { console.error('[animateCounters] Error:', e); }
}

function goPage(name) {
  try {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(n => n.classList.remove('active'));

    const pg = document.getElementById(name + 'Page');
    const nb = document.getElementById('nav-' + name);
    if (pg) pg.classList.add('active');
    if (nb) nb.classList.add('active');

    State.setPage(name);

    if (name === 'home' || name === 'explore') renderCampaigns();
    if (name === 'create') { renderCampaigns(); renderMyCamps(); }
    if (name === 'profile') renderProfile();
    if (name === 'admin')   renderAdmin();
    window.scrollTo(0, 0);
  } catch (e) { console.error('[goPage] Error:', e); }
}

function goBack() { goPage(State.prevPage || 'home'); }

function toggleMenu(id) {
  const body = document.getElementById(id);
  const arr  = document.getElementById('arr-' + id);
  if (!body) return;
  const isOpen = body.style.display === 'block';
  document.querySelectorAll('.menu-section-body').forEach(b => b.style.display = 'none');
  document.querySelectorAll('[id^="arr-"]').forEach(a => a.textContent = '›');
  if (!isOpen) { body.style.display = 'block'; if (arr) arr.textContent = '⌄'; }
}

function openModal(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.classList.add('open');
  if (id === 'createModal') {
    const today = new Date().toISOString().split('T')[0];
    const di = document.getElementById('campDate');
    if (di) { di.min = today; if (!di.value) di.value = today; }
  }
}

function closeModal(id) {
  const el = document.getElementById(id);
  if (el) el.classList.remove('open');
}

function switchTab(tab) {
  State.activeAdminTab = tab;
  ['accounts', 'campaigns', 'partners'].forEach(name => {
    const panel = document.getElementById('admin' + name.charAt(0).toUpperCase() + name.slice(1));
    const tabEl = document.getElementById('tab-' + name);
    if (panel) panel.style.display = (name === tab) ? 'block' : 'none';
    if (tabEl) tabEl.classList.toggle('active', name === tab);

/* ── AUTH ── */
async function doSignup(e) {
  e.preventDefault();
  const form = e.target;
  const btn  = form.querySelector('.submit-btn');
  clearFieldErrors(form);

  const data = {
    name:     form.querySelector('[name="name"]')?.value    || '',
    email:    form.querySelector('[name="email"]')?.value   || '',
    password: form.querySelector('[name="password"]')?.value || '',
    phone:    form.querySelector('[name="phone"]')?.value   || '',
    country:  form.querySelector('[name="country"]')?.value || '',
    city:     form.querySelector('[name="city"]')?.value    || '',
    dob:      form.querySelector('[name="dob"]')?.value     || '',
    special:  form.querySelector('[name="special"]')?.value || ''
  };

  // Validate
  const { valid, errors } = Validators.signup(data);
  if (!valid) {
    Object.entries(errors).forEach(([field, msg]) => showFieldError(form, field, msg));
    btn && (btn.disabled = false);
    return;
  }

  // Check uniqueness
  if (UserService.getByEmail(data.email)) {
    showFieldError(form, 'email', t('errorEmail'));
    return;
  }

  setLoading(btn, true);
  try {
    const ppFile = form.querySelector('[name="profilePic"]');
    const idFile = form.querySelector('[name="idPhoto"]');
    const pp = ppFile?.files[0] ? await b64(ppFile.files[0]) : null;
    const id = idFile?.files[0] ? await b64(idFile.files[0]) : null;

    const user = Models.createUser({ ...data, profilePic: pp, idPhoto: id });
    const users = UserService.getAll();
    users.push(user);
    UserService.save(users);

    closeModal('signupModal');
    form.reset();
    toast(t('successAccount') + ' — ' + t('errorStatus'), 'success');
  } catch (err) {
    console.error('[doSignup] Error:', err);
    toast(State.lang === 'ar' ? 'حدث خطأ، حاول مجدداً' : 'An error occurred, please try again', 'error');
  }
  setLoading(btn, false);
}

function doLogin(e) {
  e.preventDefault();
  const form  = e.target;
  clearFieldErrors(form);
  const identifier = form.querySelector('[name="email"]')?.value?.trim()    || '';
  const password   = form.querySelector('[name="password"]')?.value?.trim() || '';

  if (!identifier || !password) {
    if (!identifier) showFieldError(form, 'email', t('errorRequired'));
    if (!password)   showFieldError(form, 'password', t('errorRequired'));
    return;
  }

  // Admin check
  if (identifier === CONFIG.ADMIN_EMAIL && password === CONFIG.ADMIN_PASS) {
    const adminUser = { id: 'admin', name: 'Admin', email: CONFIG.ADMIN_EMAIL, status: 'approved', volunteerHours: 0, activitiesJoined: 0, achievements: 0, joinedCamps: [] };
    State.setUser(adminUser);
    DB.setObj(CONFIG.DB_KEYS.SESSION, adminUser);
    closeModal('loginModal');
    enterApp();
    return;
  }

  // Regular user check
  const users = UserService.getAll();
  const u = users.find(u =>
    (u.email === identifier.toLowerCase() || u.phone === identifier || u.name === identifier) &&
    u.password === password
  );

  if (!u) {
    showFieldError(form, 'email', t('errorLogin'));
    showFieldError(form, 'password', ' ');
    return;
  }

  if (u.status === 'rejected') {
    toast(t('rejectedBanner'), 'error');
    return;
  }

  State.setUser(u);
  DB.setObj(CONFIG.DB_KEYS.SESSION, u);
  closeModal('loginModal');
  enterApp();
}

function doLogout() {
  State.setUser(null);
  State.isAdmin = false;
  DB.remove(CONFIG.DB_KEYS.SESSION);
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('appScreen').classList.remove('show');
  document.getElementById('navbar').style.display = 'none';
  document.getElementById('bottomNav').classList.remove('show');
}

function enterApp() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appScreen').classList.add('show');
  document.getElementById('navbar').style.display = 'block';
  document.getElementById('bottomNav').classList.add('show');

  const ut = document.getElementById('userTag');
  if (ut) { ut.textContent = State.cu.name; ut.classList.add('show'); }
  const lb = document.getElementById('logoutBtn');
  if (lb) lb.style.display = 'block';

  const adminNav = document.getElementById('nav-admin');
  if (adminNav) adminNav.style.display = State.isAdmin ? 'flex' : 'none';

  goPage('home');
  animateCounters();
}

/* ── CAMPAIGNS ── */
async function doCreate(e) {
  e.preventDefault();
  const form = e.target;
  const btn  = form.querySelector('.submit-btn');
  clearFieldErrors(form);

  if (!State.isAdmin && State.cu?.status !== 'approved') {
    toast(t('errorStatus'), 'warning');
    return;
  }

  const data = {
    title:    form.querySelector('[name="title"]')?.value    || '',
    category: form.querySelector('[name="category"]')?.value || '',
    location: form.querySelector('[name="location"]')?.value || '',
    date:     form.querySelector('[name="date"]')?.value     || '',
    needed:   form.querySelector('[name="needed"]')?.value   || '',
    hours:    form.querySelector('[name="hours"]')?.value    || '2',
    desc:     form.querySelector('[name="desc"]')?.value     || ''
  };

  const { valid, errors } = Validators.campaign(data);
  if (!valid) {
    Object.entries(errors).forEach(([field, msg]) => showFieldError(form, field, msg));
    return;
  }

  setLoading(btn, true);
  try {
    const imgFile = form.querySelector('[name="img"]');
    const img = imgFile?.files[0] ? await b64(imgFile.files[0]) : null;

    const camp = Models.createCampaign({ ...data, img }, State.cu, State.isAdmin);
    CampaignService.add(camp);

    // Increment activity count for creator
    UserService.updateById(State.cu.id, {
      activitiesJoined: (State.cu.activitiesJoined || 0) + 1
    });

    closeModal('createModal');
    form.reset();
    toast(State.isAdmin ? t('campCreated') : t('campPending'), 'success');
    renderCampaigns();
    renderMyCamps();
  } catch (err) {
    console.error('[doCreate] Error:', err);
    toast(State.lang === 'ar' ? 'حدث خطأ' : 'An error occurred', 'error');
  }
  setLoading(btn, false);
}

function handleJoin(id) {
  const result = CampaignService.join(id, State.cu);
  if (result.success) {
    toast(result.message, 'success');
    if (result.updatedUser) State.setUser(result.updatedUser);
    renderCampaigns();
    _updateDetailJoinBtn(id);
    animateCounters();
  } else {
    toast(result.message, 'warning');
  }
}

/* ── ADMIN ACTIONS ── */
function handleApproveUser(id) {
  const result = UserService.approve(id);
  if (result) { toast(t('approved'), 'success'); renderAdmin(); }
}

function handleRejectUser(id) {
  const result = UserService.reject(id);
  if (result) { toast(t('rejected'), 'warning'); renderAdmin(); }
}

function handleApproveCamp(id) {
  CampaignService.approve(id);
  toast(t('approved'), 'success');
  renderAdmin();
  renderCampaigns();
}

function handleRejectCamp(id) {
  CampaignService.reject(id);
  toast(t('rejected'), 'warning');
  renderAdmin();
  renderCampaigns();
}

function handleCampUnderProcess(id) {
  CampaignService.markUnderProcess(id);
  toast(t('campStatusUpdated'), 'success');
  renderAdmin();
  renderCampaigns();
}

function handleCampDone(id) {
  CampaignService.markDone(id);
  toast(t('campDoneMsg'), 'success');
  renderAdmin();
  renderCampaigns();
  animateCounters();
}

/* ── PROFILE ── */
async function uploadAvatar(event) {
  const file = event.target.files[0];
  if (!file || !State.cu || State.isAdmin) return;
  try {
    const data  = await b64(file);
    const result = UserService.updateById(State.cu.id, { profilePic: data });
    if (result) {
      toast(t('photoUpdated'), 'success');
      renderProfile();
    }
  } catch (e) {
    console.error('[uploadAvatar] Error:', e);
    toast(t('uploadError'), 'error');
  }
  event.target.value = '';
}

/* ── PARTNER FORM ── */
function submitPartner(e) {
  e.preventDefault();
  const form = e.target;
  const btn  = form.querySelector('.submit-btn') || form.querySelector('button[type="submit"]');
  clearFieldErrors(form);

  const data = {
    org:     form.querySelector('[name="org"]')?.value     || '',
    contact: form.querySelector('[name="contact"]')?.value || '',
    email:   form.querySelector('[name="email"]')?.value   || '',
    phone:   form.querySelector('[name="phone"]')?.value   || '',
    type:    form.querySelector('[name="type"]')?.value    || '',
    msg:     form.querySelector('[name="msg"]')?.value     || ''
  };

  const { valid, errors } = Validators.partner(data);
  if (!valid) {
    Object.entries(errors).forEach(([field, msg]) => showFieldError(form, field, msg));
    return;
  }

  setLoading(btn, true);
  const partner = Models.createPartner(data);
  PartnerService.add(partner);
  form.reset();
  toast(t('successSent'), 'success');
  setLoading(btn, false);
}

/* ── BOOTSTRAP ── */
document.addEventListener('DOMContentLoaded', () => {
  try {
    initData();
    applyI18n();

    // Restore session
    const session = DB.getObj(CONFIG.DB_KEYS.SESSION);
    if (session && session.id) {
      // Sync with latest user data from DB (admin stays as-is)
      const freshUser = session.email === CONFIG.ADMIN_EMAIL
        ? session
        : (UserService.getById(session.id) || session);
      State.setUser(freshUser);
      enterApp();
    }

    // Attach modal backdrop close handlers
    document.querySelectorAll('.modal-overlay').forEach(m => {
      m.addEventListener('click', e => {
        if (e.target === m) m.classList.remove('open');
      });
    });
  } catch (e) {
    console.error('[ATHAR Bootstrap] Fatal error:', e);
  }
});
