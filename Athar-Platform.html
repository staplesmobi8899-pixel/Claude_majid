/* ── NOTIFICATIONS (Phase 3 — per-user, unread badge) ── */
const NotificationService = {
  _all() { return DB.getObj(CONFIG.DB_KEYS.NOTIFS) || {}; },
  _save(m) { DB.setObj(CONFIG.DB_KEYS.NOTIFS, m); },
  getFor(uid) { return (uid && this._all()[uid]) || []; },
  add(uid, ar, en, type) {
    if (!uid) return;
    const m = this._all();
    if (!m[uid]) m[uid] = [];
    m[uid].push({ id: 'n' + Date.now() + Math.random().toString(36).slice(2, 5),
      ar, en, type: type || 'info', read: false, createdAt: new Date().toISOString() });
    this._save(m);
  },
  unreadCount(uid) { return this.getFor(uid).filter(n => !n.read).length; },
  markAllRead(uid) {
    const m = this._all(); if (!uid || !m[uid]) return;
    m[uid].forEach(n => { n.read = true; }); this._save(m);
  },
  ensureWelcome(user) {
    if (!user || !user.id || user.isGuest || user.email === CONFIG.ADMIN_EMAIL) return;
    if (this.getFor(user.id).length) return;
    this.add(user.id, 'أهلاً بك في أثر 👋 رحلتك في صناعة الأثر بدأت.',
                       'Welcome to ATHAR 👋 Your impact journey begins.', 'welcome');
  }
};

/* ── ROLES & PERMISSIONS (Phase 2 — scalable, no hardcoded roles) ── */
const Permissions = {
  roleOf(user) {
    if (!user) return null;
    if (user.email === CONFIG.ADMIN_EMAIL) return 'admin';
    return user.role || CONFIG.DEFAULT_ROLE;
  },
  meta(role) { return CONFIG.ROLES[role] || CONFIG.ROLES[CONFIG.DEFAULT_ROLE]; },
  roleLabel(user) {
    const m = this.meta(this.roleOf(user) || CONFIG.DEFAULT_ROLE);
    return State.lang === 'ar' ? m.ar : m.en;
  },
  can(user, action) {
    const role = this.roleOf(user);
    if (!role) return false;
    const perms = this.meta(role).permissions || [];
    return perms.includes('*') || perms.includes(action);
  },
  hasRole(user, role) { return this.roleOf(user) === role; },
  isAdmin(user) { return this.roleOf(user) === 'admin'; },
  canManageCampaign(user, camp) {
    if (!user || !camp) return false;
    if (this.isAdmin(user) || this.hasRole(user, 'moderator')) return true;
    return camp.createdBy === user.id;
  }
};

/* ── OTP / VERIFICATION (Phase 2 — stub, backend/SMS-ready architecture) ── */
const OtpService = {
  generate() { return String(Math.floor(100000 + Math.random() * 900000)); },
  send(userId, channel) {
    const user = UserService.getById(userId);
    if (!user) return null;
    if (!user.verification) user.verification = {
      email: { verified: false, code: null, sentAt: null },
      phone: { verified: false, code: null, sentAt: null }
    };
    if (!user.verification[channel]) user.verification[channel] = { verified: false, code: null, sentAt: null };
    const code = this.generate();
    user.verification[channel].code = code;
    user.verification[channel].sentAt = new Date().toISOString();
    UserService.updateById(userId, { verification: user.verification });
    return code; // a real backend sends via email/SMS; returned here for stub/testing
  },
  verify(userId, channel, code) {
    const user = UserService.getById(userId);
    if (!user || !user.verification || !user.verification[channel]) return false;
    if (String(user.verification[channel].code) !== String(code)) return false;
    user.verification[channel].verified = true;
    user.verification[channel].code = null;
    UserService.updateById(userId, { verification: user.verification });
    return true;
  }
};

/* ── AUTH (Phase 2 — single source of truth for auth flows) ── */
const AuthService = {
  buildAdminUser() {
    return { id: 'admin', name: 'Admin', email: CONFIG.ADMIN_EMAIL, role: 'admin',
             status: 'approved', volunteerHours: 0, activitiesJoined: 0, achievements: 0, joinedCamps: [] };
  },
  startSession(user, persist = true) {
    State.setUser(user);
    if (persist) DB.setObj(CONFIG.DB_KEYS.SESSION, user);
    else DB.remove(CONFIG.DB_KEYS.SESSION);
    return user;
  },
  restoreSession() {
    const session = DB.getObj(CONFIG.DB_KEYS.SESSION);
    if (!session || !session.id) return null;
    const fresh = (session.email === CONFIG.ADMIN_EMAIL) ? session : (UserService.getById(session.id) || session);
    State.setUser(fresh);
    return fresh;
  },
  login(identifier, password) {
    identifier = String(identifier || '').trim();
    password   = String(password || '').trim();
    if (!identifier || !password) return { ok: false, error: 'required' };
    if (identifier === CONFIG.ADMIN_EMAIL && password === CONFIG.ADMIN_PASS) {
      return { ok: true, user: this.buildAdminUser() };
    }
    const id = identifier.toLowerCase();
    const u = UserService.getAll().find(x =>
      (x.email === id || x.phone === identifier || x.name === identifier) && x.password === password);
    if (!u) return { ok: false, error: 'invalid' };
    if (UserService.isBanned(u)) return { ok: false, error: 'banned', user: u };
    if (u.status === 'rejected') return { ok: false, error: 'rejected', user: u };
    return { ok: true, user: u, status: u.status };
  },
  register(data) {
    const { valid, errors } = Validators.signup(data);
    if (!valid) return { ok: false, errors };
    if (UserService.getByEmail(data.email)) return { ok: false, errors: { email: t('errorEmail') } };
    const user = Models.createUser(data);
    const users = UserService.getAll();
    users.push(user);
    UserService.save(users);
    return { ok: true, user };
  },
  continueAsGuest() {
    const guest = { id: 'guest', name: t('guest'), email: '', role: 'guest', status: 'guest', isGuest: true,
                    volunteerHours: 0, activitiesJoined: 0, achievements: 0, joinedCamps: [] };
    this.startSession(guest, false);
    enterApp();
    return guest;
  },
  logout() {
    State.setUser(null);
    DB.remove(CONFIG.DB_KEYS.SESSION);
  },
  // Phase 2.5 (forgot password) — architecture-ready
  requestReset(identifier) {
    const u = UserService.getByEmail(identifier) || UserService.getByPhone(identifier);
    if (!u) return { ok: false, error: 'not_found' };
    const channel = Validators.isEmail(identifier) ? 'email' : 'phone';
    const code = OtpService.send(u.id, channel);
    return { ok: true, userId: u.id, channel, code };
  },
  resetPassword(userId, code, newPassword) {
    const u = UserService.getById(userId);
    if (!u) return { ok: false, error: 'not_found' };
    if (!Validators.isPassword(newPassword)) return { ok: false, error: 'weak' };
    UserService.updateById(userId, { password: newPassword });
    return { ok: true };
  }
};

const CampaignService = {
  getAll()   { return DB.get(CONFIG.DB_KEYS.CAMPS); },

  getById(id) {
    if (!id) return null;
    return this.getAll().find(c => c.id === id) || null;
  },

  /** Get visible campaigns (approved, under_process, done, OR created by current user) */
  getVisible() {
    return this.getAll().filter(c =>
      c.status === 'approved' ||
      c.status === 'under_process' ||
      c.status === 'done' ||
      (State.cu && c.createdBy === State.cu.id)
    );
  },

  save(camps) { return DB.set(CONFIG.DB_KEYS.CAMPS, camps); },

  add(camp) {
    const camps = this.getAll();
    camps.unshift(camp);
    return this.save(camps);
  },

  updateById(id, changes) {
    const camps = this.getAll();
    const idx = camps.findIndex(c => c.id === id);
    if (idx === -1) return false;
    camps[idx] = { ...camps[idx], ...changes, updatedAt: new Date().toISOString() };
    this.save(camps);
    return camps[idx];
  },

  approve(id) {
    const c = this.getById(id);
    const r = this.updateById(id, { status: 'approved' });
    if (c && c.createdBy) NotificationService.add(c.createdBy, 'تمت الموافقة على مبادرتك ✓', 'Your initiative was approved ✓', 'campaign');
    return r;
  },
  reject(id) {
    const c = this.getById(id);
    const r = this.updateById(id, { status: 'rejected' });
    if (c && c.createdBy) NotificationService.add(c.createdBy, 'لم تتم الموافقة على مبادرتك', 'Your initiative was not approved', 'campaign');
    return r;
  },
  archive(id) { return this.updateById(id, { status: 'archived' }); },
  canLeave(camp) {
    if (!camp || !camp.date) return true;
    const diff = (new Date(camp.date + 'T00:00:00') - new Date()) / 86400000;
    return diff >= 2;
  },
  markUnderProcess(id) { return this.updateById(id, { status: 'under_process' }); },
  markDone(id)      {
    const camp = this.getById(id);
    if (!camp) return false;
    // Grant achievements to all joined users
    const users = UserService.getAll();
    (camp.joinedUsers || []).forEach(uid => {
      const idx = users.findIndex(u => u.id === uid);
      if (idx !== -1) {
        users[idx].achievements = (users[idx].achievements || 0) + 1;
        users[idx].updatedAt = new Date().toISOString();
      }
    });
    DB.set(CONFIG.DB_KEYS.USERS, users);
    return this.updateById(id, { status: 'done', completedAt: new Date().toISOString() });
  },

  /** Join a campaign — returns { success, message } */
  join(campId, user) {
    if (!user) return { success: false, message: t('errorLogin') };
    if (user.status !== 'approved') return { success: false, message: t('errorStatus') };

    const camps = this.getAll();
    const ci = camps.findIndex(c => c.id === campId);
    if (ci === -1) return { success: false, message: 'Campaign not found' };

    const camp = camps[ci];
    if ((camp.joinedUsers || []).includes(user.id)) return { success: false, message: t('joinedBtn') };
    if (camp.status === 'done')     return { success: false, message: t('campDone') };
    if (camp.status === 'rejected') return { success: false, message: t('campUnavailable') };
    if (camp.status === 'pending')  return { success: false, message: t('campUnavailable') };
    if (camp.volunteers >= camp.needed) return { success: false, message: t('campFull') };

    // Update campaign
    camps[ci].volunteers = (camps[ci].volunteers || 0) + 1;
    camps[ci].joinedUsers = [...(camps[ci].joinedUsers || []), user.id];
    if (camps[ci].volunteers >= camps[ci].needed) {
      camps[ci].status = 'under_process';
    }
    camps[ci].updatedAt = new Date().toISOString();
    this.save(camps);

    // Update user
    const hours = camp.volunteerHours || 2;
    const updated = UserService.updateById(user.id, {
      volunteerHours:   (user.volunteerHours   || 0) + hours,
      activitiesJoined: (user.activitiesJoined || 0) + 1,
      joinedCamps:      [...(user.joinedCamps  || []), campId]
    });

    if (camp.createdBy && camp.createdBy !== user.id) {
      NotificationService.add(camp.createdBy, (user.name || 'متطوع') + ' انضم إلى مبادرتك 🤝', (user.name || 'A volunteer') + ' joined your initiative 🤝', 'join');
    }
    const msg = `✓ ${t('successJoined')} +${hours} ${State.lang === 'ar' ? 'ساعة' : 'hrs'}`;
    return { success: true, message: msg, updatedUser: updated };
  },
  leave(campId, user) {
    if (!user) return { success: false };
    const camps = this.getAll();
    const ci = camps.findIndex(c => c.id === campId);
    if (ci === -1) return { success: false };
    const camp = camps[ci];
    if (!(camp.joinedUsers || []).includes(user.id)) return { success: false, message: t('notJoined') };
    camps[ci].joinedUsers = (camp.joinedUsers || []).filter(id => id !== user.id);
    camps[ci].volunteers = Math.max(0, (camp.volunteers || 1) - 1);
    if (camps[ci].status === 'under_process' && camps[ci].volunteers < camps[ci].needed) camps[ci].status = 'approved';
    camps[ci].updatedAt = new Date().toISOString();
    this.save(camps);
    const hours = camp.volunteerHours || 2;
    const updated = UserService.updateById(user.id, {
      volunteerHours:   Math.max(0, (user.volunteerHours   || 0) - hours),
      activitiesJoined: Math.max(0, (user.activitiesJoined || 0) - 1),
      joinedCamps:      (user.joinedCamps || []).filter(id => id !== campId)
    });
    return { success: true, message: t('leftCamp'), updatedUser: updated };
  },
  getParticipants(camp) {
    if (!camp) return [];
    return (camp.joinedUsers || []).map(uid => UserService.getById(uid)).filter(Boolean);
  },
  toggleSave(campId, user) {
    const u = user || State.cu;
    if (!u || !u.id) return false;
    const fresh = UserService.getById(u.id) || u;
    const saved = fresh.savedCampaigns || [];
    const has = saved.includes(campId);
    const next = has ? saved.filter(x => x !== campId) : [...saved, campId];
    UserService.updateById(u.id, { savedCampaigns: next });
    return !has;
  },
  isSaved(campId, user) {
    const u = user || State.cu;
    return !!(u && (u.savedCampaigns || []).includes(campId));
  },
  getSaved(user) {
    const u = user || State.cu;
    return ((u && u.savedCampaigns) || []).map(id => this.getById(id)).filter(Boolean);
  }
};

/* ── DISCOVERY (Phase 4 — query/filter/sort + featured/trending/nearby) ── */
const DiscoveryService = {
  _base() { return CampaignService.getVisible().filter(c => c.status !== 'rejected'); },
  cities() { return [...new Set(this._base().map(c => c.location).filter(Boolean))].sort(); },
  _sort(list, sort) {
    const a = list.slice();
    if (sort === 'popular') a.sort((x, y) => (y.volunteers || 0) - (x.volunteers || 0));
    else if (sort === 'urgent') a.sort((x, y) => String(x.date || '9999').localeCompare(String(y.date || '9999')));
    else a.sort((x, y) => String(y.createdAt || '').localeCompare(String(x.createdAt || '')));
    return a;
  },
  query({ search = '', category = 'all', city = 'all', sort = 'recent' } = {}) {
    let list = this._base();
    if (category && category !== 'all') list = list.filter(c => Models.catKey(c.category) === category);
    if (city && city !== 'all') list = list.filter(c => c.location === city);
    const q = String(search || '').trim().toLowerCase();
    if (q) list = list.filter(c => {
      const tx = Models.getCampText(c);
      return [tx.title, tx.desc, Models.catLabel(c), c.location].filter(Boolean)
        .some(s => String(s).toLowerCase().includes(q));
    });
    return this._sort(list, sort);
  },
  featured(n = 5) { return this._sort(this._base(), 'popular').slice(0, n); },
  trending(n = 6) { return this._sort(this._base(), 'popular').slice(0, n); },
  nearby(city, n = 6) {
    const base = this._base();
    return (city ? base.filter(c => c.location === city) : base).slice(0, n);
  },
  nearest() {
    const today = new Date().toISOString().slice(0, 10);
    const dated = this._base().filter(c => c.date);
    const upcoming = dated.filter(c => c.date >= today).sort((a, b) => a.date.localeCompare(b.date));
    if (upcoming.length) return upcoming[0];
    const past = dated.sort((a, b) => b.date.localeCompare(a.date));
    return past[0] || this._base()[0] || null;
  },
  recommended(user, n = 6) {
    const interests = new Set((user && user.interests) || []);
    if (!interests.size) return this.trending(n);
    const matched = this._base().filter(c => interests.has(Models.catKey(c.category)));
    return (matched.length ? matched : this.trending(n)).slice(0, n);
  }
};

/** Show a toast notification */
function toast(msg, type = 'success') {
  // Remove existing toasts
  document.querySelectorAll('.toast').forEach(el => el.remove());
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => { if (el.parentNode) el.remove(); }, 3200);
}

/** Set button loading state */
function setLoading(btn, loading) {
  if (!btn) return;
  btn.disabled = loading;
  if (loading) {
    btn._origText = btn.textContent;
    btn.textContent = State.lang === 'ar' ? '⏳ جاري...' : '⏳ Loading...';
  } else {
    btn.textContent = btn._origText || btn.textContent;
  }
}

/** Show inline form error under a field */
function showFieldError(form, fieldName, msg) {
  if (!form) return;
  const input = form.querySelector(`[name="${fieldName}"]`);
  if (!input) return;
  // Remove old error
  const old = form.querySelector(`.field-err-${fieldName}`);
  if (old) old.remove();
  if (!msg) return;
  const err = document.createElement('div');
  err.className = `field-err field-err-${fieldName}`;
  err.style.cssText = 'color:var(--red);font-size:var(--fs-sm);margin-top:0.25rem;';
  err.textContent = msg;
  input.parentNode.insertBefore(err, input.nextSibling);
  input.style.borderColor = '#c84c3c';
}

/** Clear all field errors in a form */
function clearFieldErrors(form) {
  if (!form) return;
  form.querySelectorAll('.field-err').forEach(el => el.remove());
  form.querySelectorAll('input, select, textarea').forEach(el => {
    el.style.borderColor = '';
  });
}

/** Convert file to base64 */
function b64(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload  = () => res(r.result);
    r.onerror = () => rej(new Error('File read error'));
    r.readAsDataURL(file);
  });
}

/** Open image viewer overlay */
function openImageViewer(src) {
  if (!src) return;
  const modal = document.createElement('div');
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.95);display:flex;align-items:center;justify-content:center;z-index:9999;cursor:zoom-out;';
  modal.innerHTML = `
    <div style="position:relative;max-width:92vw;max-height:92vh;" onclick="event.stopPropagation()">
      <img src="${src}" style="max-width:100%;max-height:88vh;object-fit:contain;border-radius:0.5rem;">
      <button onclick="this.closest('[style*=fixed]').remove()" style="position:absolute;top:-1rem;right:-1rem;background:rgba(255,255,255,0.15);color:white;border:none;width:36px;height:36px;border-radius:50%;font-size:var(--fs-xl);cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);">✕</button>
    </div>`;
  modal.onclick = () => modal.remove();
  document.body.appendChild(modal);
}

/** Render a single campaign card HTML */
function campCardHTML(c) {
  try {
    const joined = (State.cu?.joinedCamps || []).includes(c.id);
    const txt    = Models.getCampText(c);
    const pct    = c.needed ? Math.min(100, Math.round(((c.volunteers || 0) / c.needed) * 100)) : 0;
    const si     = Models.getStatusInfo(c.status);
    const fallbackColor = ['#3a4a28','#2d3a1e','#4a5a32','#1e2a14'][parseInt(String(c.id).slice(-1)) % 4] || '#3a4a28';
    const title    = txt.title   || 'Campaign';
    const desc     = txt.desc    || '';
    const catMeta  = Models.catMeta(c);
    const cat      = Models.catLabel(c) || 'مبادرة';
    const catIcon  = (catMeta && catMeta.icon) ? catMeta.icon + ' ' : '';
    const location = c.location  || '';
    const date     = c.date      || '';
    const phone    = c.creatorPhone || '';
    const vol      = c.volunteers   || 0;
    const needed   = c.needed       || 0;

    const imgHtml = c.img
      ? `<img src="${c.img}" alt="${title}" loading="lazy" style="width:100%;height:100%;object-fit:cover;display:block;" onclick="event.stopPropagation();openImageViewer('${c.img}')" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
        + `<div class="camp-img-fallback" style="display:none;background:${fallbackColor}">🌿</div>`
      : `<div class="camp-img-fallback" style="background:${fallbackColor}">🌿</div>`;

    let joinBtnHtml = '';
    if (c.status === 'done') {
      joinBtnHtml = `<button class="join-btn" disabled style="opacity:0.5;">✓ ${State.lang === 'ar' ? 'منتهية' : 'Ended'}</button>`;
    } else if (c.status === 'rejected') {
      joinBtnHtml = `<button class="join-btn" disabled style="opacity:0.5;background:#ef4444;">✕ ${State.lang === 'ar' ? 'مرفوضة' : 'Rejected'}</button>`;
    } else if (vol >= needed && needed > 0) {
      joinBtnHtml = `<button class="join-btn" disabled style="opacity:0.5;background:#f59e0b;">📋 ${State.lang === 'ar' ? 'امتلأت' : 'Full'}</button>`;
    } else if (c.status === 'approved' || c.status === 'under_process') {
      joinBtnHtml = `<button class="join-btn" onclick="event.stopPropagation();handleJoin('${c.id}')" ${joined ? 'disabled' : ''}>${joined ? t('joinedBtn') : t('joinBtn')}</button>`;
    } else {
      joinBtnHtml = `<button class="join-btn" disabled>${t('unavailBtn')}</button>`;
    }

    return `
    <div class="camp-card" onclick="openDetail('${c.id}')">
      <div class="camp-img">${imgHtml}<div class="camp-img-overlay"></div>
        <span class="camp-badge camp-badge-status ${si.cls}">${si[State.lang]}</span>
        <span class="camp-badge camp-badge-cat">${catIcon}${cat}</span>
      </div>
      <div class="camp-body">
        <div class="camp-title">${title}</div>
        <div class="camp-desc">${desc}</div>
        <div class="camp-meta">
          ${location ? `<div class="camp-meta-row"><div class="camp-meta-dot"></div>${location}</div>` : ''}
          ${date     ? `<div class="camp-meta-row"><div class="camp-meta-dot"></div>${date}</div>`     : ''}
          ${phone    ? `<div class="camp-meta-row"><div class="camp-meta-dot"></div>📞 ${phone}</div>` : ''}
        </div>
        <div class="prog-track"><div class="prog-fill" style="width:${pct}%"></div></div>
        <div class="prog-label">${vol} ${t('of')} ${needed}</div>
        <div class="camp-footer">
          <div class="camp-pct"><strong>${pct}%</strong> ${t('complete')}</div>
          ${joinBtnHtml}
        </div>
      </div>
    </div>`;
  } catch (e) {
    console.error('[campCardHTML] Error:', e);
    return '';
  }
}

  const m = Math.floor(diff / 60000);
  if (m < 1)    return isAr ? 'الآن' : 'now';
  if (m < 60)   return isAr ? ('منذ ' + m + ' د') : (m + 'm ago');
  const h = Math.floor(m / 60);
  if (h < 24)   return isAr ? ('منذ ' + h + ' س') : (h + 'h ago');
  const d = Math.floor(h / 24);
  if (d < 30)   return isAr ? ('منذ ' + d + ' يوم') : (d + 'd ago');
  return new Date(iso).toLocaleDateString();
}

function admBar(label, value, max, color) {
  const pct = max > 0 ? Math.round((value / max) * 100) : 0;
  return '<div class="adm-bar-row">' +
    '<div style="display:flex;justify-content:space-between;font-size:var(--fs-sm);font-weight:700;color:var(--charcoal-80);margin-bottom:0.3rem;"><span>' + label + '</span><span>' + value + '</span></div>' +
    '<div style="height:8px;background:var(--line);border-radius:9999px;overflow:hidden;"><div style="height:100%;width:' + pct + '%;background:' + color + ';border-radius:9999px;transition:width 0.4s;"></div></div>' +
  '</div>';
}

/* ── Dashboard ── */
function admRenderOverview(users, camps, partners) {
  try {
    users    = users    || UserService.getAll();
    camps    = camps    || CampaignService.getAll();
    partners = partners || PartnerService.getAll();
    const isAr = State.lang === 'ar';

    const approvedUsers = users.filter(u => u.status === 'approved').length;
    const pendingUsers  = users.filter(u => u.status === 'pending');
    const activeCamps   = camps.filter(c => c.status === 'approved' || c.status === 'under_process').length;
    const pendingCamps  = camps.filter(c => c.status === 'pending');
    const totalHours    = Math.round(users.reduce((s, u) => s + (parseFloat(u.volunteerHours) || 0), 0));

    const stats = [
      { num: users.length,        lbl: isAr ? 'إجمالي المستخدمين' : 'Total Users',      kind: 'totalUsers' },
      { num: approvedUsers,       lbl: isAr ? 'مستخدمين مفعّلين'  : 'Approved Users',   kind: 'approvedUsers' },
      { num: pendingUsers.length, lbl: isAr ? 'بانتظار الموافقة'  : 'Pending Users',    kind: 'pendingUsers', accent: true },
      { num: camps.length,        lbl: isAr ? 'إجمالي الحملات'    : 'Total Campaigns',  kind: 'totalCamps' },
      { num: activeCamps,         lbl: isAr ? 'حملات نشطة'        : 'Active Campaigns', kind: 'activeCamps', accent: true },
      { num: totalHours,          lbl: isAr ? 'ساعات التطوع'      : 'Volunteer Hours',  kind: 'hours' }
    ];

    const grid = admEl('admStatsGrid');
    if (grid) {
      grid.innerHTML = stats.map(s =>
        '<div class="adm-stat-card" onclick="admStatDetail(\'' + s.kind + '\')">' +
          '<div class="adm-stat-num' + (s.accent ? ' adm-stat-accent' : '') + '">' + s.num + '</div>' +
          '<div class="adm-stat-lbl">' + s.lbl + '</div>' +
        '</div>'
      ).join('');
    }

    // Quick actions
    const qa = admEl('admQuickActions');
    if (qa) {
      const acts = [
        { icon: '👥', ar: 'المستخدمين',  en: 'Users',     panel: 'users' },
        { icon: '📋', ar: 'الحملات',     en: 'Campaigns', panel: 'campaigns' },
        { icon: '🤝', ar: 'الشراكات',    en: 'Partners',  panel: 'partners' },
        { icon: '📊', ar: 'الإحصائيات',  en: 'Analytics', panel: 'analytics' }
      ];
      qa.innerHTML = acts.map(a =>
        '<button class="adm-quick-btn" onclick="admSwitchPanel(\'' + a.panel + '\')">' +
          '<span style="font-size:var(--fs-2xl);">' + a.icon + '</span>' +
          '<span>' + (isAr ? a.ar : a.en) + '</span>' +
        '</button>'
      ).join('');
    }

    // Pending queue
    const pl = admEl('admPendingList');
    if (pl) {
      let html = '';
      pendingUsers.forEach(u => {
        html +=
          '<div class="admin-card" onclick="admViewUser(\'' + u.id + '\')" style="cursor:pointer;">' +
            '<div class="admin-card-head">' +
              '<div class="admin-ava">' + (u.profilePic ? '<img src="' + u.profilePic + '" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">' : '👤') + '</div>' +
              '<div class="admin-info">' +
                '<div class="admin-info-name">' + (u.name || '') + '</div>' +
                '<div class="admin-info-row">' + (isAr ? 'حساب جديد بانتظار الموافقة' : 'New account awaiting approval') + ' · ' + admTimeAgo(u.createdAt) + '</div>' +
              '</div>' +
            '</div>' +
            '<div class="admin-actions">' +
              '<button class="approve-btn" onclick="event.stopPropagation();handleApproveUser(\'' + u.id + '\')">✓ ' + (isAr ? 'قبول' : 'Approve') + '</button>' +
              '<button class="reject-btn" onclick="event.stopPropagation();handleRejectUser(\'' + u.id + '\')">✕ ' + (isAr ? 'رفض' : 'Reject') + '</button>' +
            '</div>' +
          '</div>';
      });
      pendingCamps.forEach(c => {
        const txt = Models.getCampText(c);
        html +=
          '<div class="admin-card" onclick="admViewCamp(\'' + c.id + '\')" style="cursor:pointer;">' +
            '<div class="admin-info">' +
              '<div class="admin-info-name">📍 ' + (txt.title || '') + '</div>' +
              '<div class="admin-info-row">' + (isAr ? 'حملة جديدة بانتظار الموافقة' : 'New campaign awaiting approval') + ' · 👤 ' + (c.creatorName || '') + '</div>' +
            '</div>' +
            '<div class="admin-actions">' +
              '<button class="approve-btn" onclick="event.stopPropagation();handleApproveCamp(\'' + c.id + '\')">✓ ' + (isAr ? 'قبول' : 'Approve') + '</button>' +
              '<button class="reject-btn" onclick="event.stopPropagation();handleRejectCamp(\'' + c.id + '\')">✕ ' + (isAr ? 'رفض' : 'Reject') + '</button>' +
            '</div>' +
          '</div>';
      });
      pl.innerHTML = html || admEmpty('✅', isAr ? 'لا يوجد طلبات معلّقة' : 'No pending reviews');
    }

    // Recent activity
    const al = admEl('admActivityList');
    if (al) {
      const events = [];
      users.forEach(u => { if (u.createdAt) events.push({ d: u.createdAt, icon: '👤', txt: (isAr ? 'انضم: ' : 'Joined: ') + (u.name || '') }); });
      camps.forEach(c => { if (c.createdAt) events.push({ d: c.createdAt, icon: '📋', txt: (isAr ? 'حملة: ' : 'Campaign: ') + (Models.getCampText(c).title || '') }); });
      partners.forEach(p => { if (p.date) events.push({ d: p.date, icon: '🤝', txt: (isAr ? 'طلب شراكة: ' : 'Partner request: ') + (p.org || '') }); });
      events.sort((a, b) => new Date(b.d) - new Date(a.d));
      al.innerHTML = events.length === 0
        ? admEmpty('🕐', isAr ? 'لا يوجد نشاطات بعد' : 'No activity yet')
        : events.slice(0, 7).map(ev =>
          '<div class="adm-activity-row" style="display:flex;align-items:center;gap:0.7rem;padding:0.6rem 0;border-bottom:1px solid var(--line);">' +
            '<span style="font-size:var(--fs-xl);flex:none;">' + ev.icon + '</span>' +
            '<span style="flex:1;font-size:var(--fs-base);font-weight:600;color:var(--charcoal-80);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + ev.txt + '</span>' +
            '<span style="flex:none;font-size:var(--fs-xs);color:#999;">' + admTimeAgo(ev.d) + '</span>' +
          '</div>'
        ).join('');
    }
  } catch (e) {
    console.error('[admRenderOverview] Error:', e);
  }
}

/* ── Stat detail modal ── */
function admStatDetail(kind) {
  try {
    const isAr = State.lang === 'ar';
    const users = UserService.getAll();
    const camps = CampaignService.getAll();
    let title = '', rows = [], panel = 'users';

    const userRow = u =>
      '<div style="display:flex;align-items:center;gap:0.6rem;padding:0.55rem 0;border-bottom:1px solid var(--line);cursor:pointer;" onclick="admViewUser(\'' + u.id + '\')">' +
        '<span style="flex:1;font-size:var(--fs-base);font-weight:700;color:var(--charcoal);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + (u.name || '') + '</span>' +
        admStatusChip(u.status) +
      '</div>';
    const campRow = c => {
      const txt = Models.getCampText(c);
      return '<div style="display:flex;align-items:center;gap:0.6rem;padding:0.55rem 0;border-bottom:1px solid var(--line);cursor:pointer;" onclick="admViewCamp(\'' + c.id + '\')">' +
        '<span style="flex:1;font-size:var(--fs-base);font-weight:700;color:var(--charcoal);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + (txt.title || '') + '</span>' +
        admStatusChip(c.status) +
      '</div>';
    };

    if (kind === 'totalUsers')    { title = isAr ? 'إجمالي المستخدمين' : 'Total Users';      rows = users.map(userRow); panel = 'users'; }
    if (kind === 'approvedUsers') { title = isAr ? 'مستخدمين مفعّلين'  : 'Approved Users';   rows = users.filter(u => u.status === 'approved').map(userRow); panel = 'users'; }
    if (kind === 'pendingUsers')  { title = isAr ? 'بانتظار الموافقة'  : 'Pending Users';    rows = users.filter(u => u.status === 'pending').map(userRow); panel = 'users'; }
    if (kind === 'totalCamps')    { title = isAr ? 'إجمالي الحملات'    : 'Total Campaigns';  rows = camps.map(campRow); panel = 'campaigns'; }
    if (kind === 'activeCamps')   { title = isAr ? 'حملات نشطة'        : 'Active Campaigns'; rows = camps.filter(c => c.status === 'approved' || c.status === 'under_process').map(campRow); panel = 'campaigns'; }
    if (kind === 'hours') {
      title = isAr ? 'ساعات التطوع' : 'Volunteer Hours';
      panel = 'analytics';
      rows = users.filter(u => (u.volunteerHours || 0) > 0)
        .sort((a, b) => (b.volunteerHours || 0) - (a.volunteerHours || 0))
        .map(u =>
          '<div style="display:flex;align-items:center;gap:0.6rem;padding:0.55rem 0;border-bottom:1px solid var(--line);cursor:pointer;" onclick="admViewUser(\'' + u.id + '\')">' +
            '<span style="flex:1;font-size:var(--fs-base);font-weight:700;color:var(--charcoal);">' + (u.name || '') + '</span>' +
            '<span style="font-weight:800;color:var(--olive);font-size:var(--fs-base);">' + (u.volunteerHours || 0) + (isAr ? ' س' : ' h') + '</span>' +
          '</div>');
    }

    admOpenModal(
      '<h3 style="margin:0 0 1rem;font-size:var(--fs-xl);font-weight:900;color:var(--charcoal);">' + title + ' <span style="font-size:var(--fs-sm);font-weight:800;color:var(--charcoal-50);">(' + rows.length + ')</span></h3>' +
      (rows.length ? rows.join('') : admEmpty('📭', isAr ? 'لا يوجد بيانات' : 'No data')) +
      '<button style="margin-top:1.1rem;width:100%;padding:0.8rem;border:none;border-radius:0.75rem;background:var(--olive);color:#fff;font-weight:800;font-size:var(--fs-md);cursor:pointer;font-family:inherit;" onclick="admSwitchPanel(\'' + panel + '\')">' + (isAr ? 'عرض القسم كاملاً' : 'Open full section') + '</button>'
    );
  } catch (e) {
    console.error('[admStatDetail] Error:', e);
  }
}

/* ── Analytics panel ── */
function admRenderAnalytics(users, camps) {
  try {
    users = users || UserService.getAll();
    camps = camps || CampaignService.getAll();
    const isAr = State.lang === 'ar';

    // Campaigns by category
    const catEl = admEl('admChartCats');
    if (catEl) {
      const counts = {};
      camps.forEach(c => { const k = c.category || 'other'; counts[k] = (counts[k] || 0) + 1; });
      const keys = Object.keys(counts);
      const max = Math.max.apply(null, keys.map(k => counts[k]).concat([1]));
      const colors = ['#5a6b3a', '#8a9a6a', '#c47d1a', '#1d4ed8', '#7c3aed', '#c84c3c'];
      catEl.innerHTML = keys.length === 0
        ? admEmpty('📊', isAr ? 'لا يوجد حملات بعد' : 'No campaigns yet')
        : keys.map((k, i) => {
            const cfg = (CONFIG.CAMP_CATEGORIES || {})[k] || {};
            const label = isAr ? (cfg.ar || k) : (cfg.en || k);
            return admBar(label, counts[k], max, colors[i % colors.length]);
          }).join('');
    }

    // Top volunteers leaderboard
    const lb = admEl('admLeaderboard');
    if (lb) {
      const top = users.filter(u => (u.volunteerHours || 0) > 0)
        .sort((a, b) => (b.volunteerHours || 0) - (a.volunteerHours || 0))
        .slice(0, 5);
      const medals = ['🥇', '🥈', '🥉', '4', '5'];
      lb.innerHTML = top.length === 0
        ? admEmpty('🏆', isAr ? 'لا يوجد ساعات تطوع بعد' : 'No volunteer hours yet')
        : top.map((u, i) =>
          '<div class="adm-lead-row" style="display:flex;align-items:center;gap:0.7rem;padding:0.6rem 0;border-bottom:1px solid var(--line);cursor:pointer;" onclick="admViewUser(\'' + u.id + '\')">' +
            '<span style="flex:none;width:28px;text-align:center;font-weight:900;font-size:' + (i < 3 ? '1.1rem' : '0.85rem') + ';color:var(--charcoal-50);">' + medals[i] + '</span>' +
            '<span style="flex:1;font-size:var(--fs-base);font-weight:700;color:var(--charcoal);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + (u.name || '') + '</span>' +
            '<span style="flex:none;font-weight:800;color:var(--olive);font-size:var(--fs-base);">' + (u.volunteerHours || 0) + (isAr ? ' س' : ' h') + '</span>' +
          '</div>'
        ).join('');
    }

    // Volunteers by city
    const cityEl = admEl('admChartCities');
    if (cityEl) {
      const counts = {};
      users.forEach(u => { const k = (u.city || '').trim(); if (k) counts[k] = (counts[k] || 0) + 1; });
      const keys = Object.keys(counts).sort((a, b) => counts[b] - counts[a]).slice(0, 6);
      const max = Math.max.apply(null, keys.map(k => counts[k]).concat([1]));
      cityEl.innerHTML = keys.length === 0
        ? admEmpty('🏙️', isAr ? 'لا يوجد بيانات مدن' : 'No city data')
        : keys.map(k => admBar(k, counts[k], max, '#8a9a6a')).join('');
    }
  } catch (e) {
    console.error('[admRenderAnalytics] Error:', e);
  }
}

/** Open campaign detail page */
function renderDetail(id) {
  const c = CampaignService.getById(id); if (!c) return;
  const txt = Models.getCampText(c);
  const si  = Models.getStatusInfo(c.status);
  const cm  = Models.catMeta(c);
  const isAr = State.lang === 'ar';
  const pct = c.needed ? Math.min(100, Math.round(((c.volunteers || 0) / c.needed) * 100)) : 0;
  const joined = (State.cu && (State.cu.joinedCamps || []).includes(id));
  const saved = CampaignService.isSaved(id);
  const canManage = Permissions.canManageCampaign(State.cu, c);
  const parts = CampaignService.getParticipants(c);

  const hero = document.getElementById('detailHero');
  if (hero) {
    hero.style.background = c.img ? '' : 'linear-gradient(135deg, var(--forest), var(--olive))';
    hero.innerHTML =
      (c.img ? '<img src="' + c.img + '" alt="" style="width:100%;height:100%;object-fit:cover;" onerror="this.remove()">' : '') +
      '<div class="detail-hero-overlay"></div>' +
      '<button class="detail-back" id="detailBackBtn" onclick="goBack()">' + (isAr ? '‹' : '›') + '</button>' +
      '<button class="detail-hero-save' + (saved ? ' saved' : '') + '" id="detailSaveBtn" onclick="handleSave(\'' + id + '\')" aria-label="save">' + (saved ? '♥' : '♡') + '</button>';
  }

  let actionBtn;
  if (joined) actionBtn = '<button class="detail-join-btn leave" onclick="handleLeave(\'' + id + '\')">' + t('leaveBtn') + '</button>';
  else if (c.status === 'done' || c.status === 'archived') actionBtn = '<button class="detail-join-btn" disabled>' + t('campDone') + '</button>';
  else if (c.status !== 'approved' && c.status !== 'under_process') actionBtn = '<button class="detail-join-btn" disabled>' + t('unavailBtn') + '</button>';
  else if ((c.volunteers || 0) >= (c.needed || 0) && c.needed > 0) actionBtn = '<button class="detail-join-btn" disabled>' + t('campFull') + '</button>';
  else actionBtn = '<button class="detail-join-btn" onclick="handleJoin(\'' + id + '\')">' + t('joinBtn') + '</button>';

  const reqs = [t('req1'), t('req2'), t('req3')];
  const partHtml = parts.length
    ? parts.slice(0, 14).map(u => '<div class="part-chip" title="' + (u.name || '') + '">' + ((u.name || '؟').charAt(0)) + '</div>').join('') + (parts.length > 14 ? '<div class="part-chip more">+' + (parts.length - 14) + '</div>' : '')
    : '<div class="empty-sub">' + t('noParticipants') + '</div>';

  const manage = canManage
    ? '<section class="detail-section"><h3 class="detail-h">' + t('manageCamp') + '</h3><div class="manage-row">' +
      (c.status !== 'done' ? '<button class="manage-btn" onclick="handleManageDone(\'' + id + '\')">' + t('markDoneBtn') + '</button>' : '') +
      (c.status !== 'archived' ? '<button class="manage-btn ghost" onclick="handleArchive(\'' + id + '\')">' + t('archiveBtn') + '</button>' : '') +
      '</div></section>'
    : '';

  document.getElementById('detailBody').innerHTML =
    '<div class="detail-body-inner">' +
      '<div class="detail-badges"><span class="camp-badge ' + si.cls + '">' + si[State.lang] + '</span>' +
        (cm ? '<span class="detail-cat-pill">' + (cm.icon || '') + ' ' + (isAr ? cm.ar : cm.en) + '</span>' : '') + '</div>' +
      '<h1 class="detail-title">' + (txt.title || '') + '</h1>' +
      '<div class="detail-org">👤 ' + (c.creatorName || '') + ' · 📍 ' + (c.location || '') + '</div>' +
      '<div class="detail-actions">' + actionBtn +
        '<button class="detail-icon-btn" onclick="handleShare(\'' + id + '\')" aria-label="share">↗</button></div>' +
      '<div class="detail-stats">' +
        '<div class="dstat"><div class="dstat-n">' + (c.volunteers || 0) + '/' + (c.needed || 0) + '</div><div class="dstat-l">' + t('volLabel') + '</div></div>' +
        '<div class="dstat"><div class="dstat-n">' + (c.volunteerHours || 0) + '</div><div class="dstat-l">' + t('statHours') + '</div></div>' +
        '<div class="dstat"><div class="dstat-n">' + pct + '%</div><div class="dstat-l">' + t('progress') + '</div></div>' +
      '</div>' +
      '<div class="detail-prog-card"><div class="prog-track"><div class="prog-fill" style="width:' + pct + '%"></div></div></div>' +
      '<section class="detail-section"><h3 class="detail-h">' + t('storyTitle') + '</h3><p class="detail-story">' + (txt.desc || '') + '</p></section>' +
      '<section class="detail-section"><h3 class="detail-h">' + t('reqTitle') + '</h3><ul class="detail-reqs">' + reqs.map(r => '<li>' + r + '</li>').join('') + '</ul></section>' +
      '<section class="detail-section"><h3 class="detail-h">' + t('detailsTitle') + '</h3><div class="detail-info-grid">' +
        '<div class="detail-info-card"><div class="detail-info-label">' + t('dateLabel') + '</div><div class="detail-info-value">📅 ' + (c.date || '') + '</div></div>' +
        '<div class="detail-info-card"><div class="detail-info-label">' + t('durationLabel') + '</div><div class="detail-info-value">⏳ ' + (c.volunteerHours || 0) + ' ' + (isAr ? 'ساعات' : 'hrs') + '</div></div>' +
        '<div class="detail-info-card"><div class="detail-info-label">' + t('locationLabel') + '</div><div class="detail-info-value">📍 ' + (c.location || '') + '</div></div>' +
        '<div class="detail-info-card"><div class="detail-info-label">' + t('contactLabel') + '</div><div class="detail-info-value" style="color:var(--olive)">' + (c.creatorPhone ? '📞 ' + c.creatorPhone : '—') + '</div></div>' +
      '</div></section>' +
      '<section class="detail-section"><h3 class="detail-h">' + t('participantsTitle') + ' (' + parts.length + ')</h3><div class="detail-parts">' + partHtml + '</div></section>' +
      manage +
    '</div>';
}

function openDetail(id) {
  try {
    const c = CampaignService.getById(id);
    if (!c) { console.warn('[openDetail] not found:', id); return; }
    State.detailCampId = id;
    renderDetail(id);
    goPage('detail');
  } catch (e) { console.error('[openDetail] Error:', e); }
}

function handleSave(id) {
  if (!requireAuth()) return;
  const now = CampaignService.toggleSave(id);
  State.setUser(UserService.getById(State.cu.id) || State.cu);
  const btn = document.getElementById('detailSaveBtn');
  if (btn) { btn.classList.toggle('saved', now); btn.textContent = now ? '♥' : '♡'; }
  toast(now ? t('saved') : t('unsaved'), '');
}

function handleLeave(id) {
  if (!requireAuth()) return;
  const c = CampaignService.getById(id);
  if (!CampaignService.canLeave(c)) { toast(t('cantLeave'), 'warning'); return; }
  const res = CampaignService.leave(id, State.cu);
  if (res.success) {
    toast(res.message, 'success');
    if (res.updatedUser) State.setUser(res.updatedUser);
    updateBell();
    if (State.currentPage === 'detail') renderDetail(id);

/** Animate home stat counters */
function animateCounters() {
  try {
    const users = UserService.getAll();
    const camps = CampaignService.getAll();
    const targets = {
      cUsers: users.length,
      cCamps: camps.filter(c => c.status === 'done').length,
      cHours: users.reduce((s, u) => s + (u.volunteerHours || 0), 0),
      cCities: 20
    };

        if (count >= target) clearInterval(timer);
      }, 22);
    });
  } catch (e) { console.error('[animateCounters] Error:', e); }
}

  explore:       { title: 'navExplore',     onEnter: () => ExploreUI.enter() },
  community:     { title: 'communityTitle', onEnter: () => {} },

  detail:        { title: 'detailHeaderTitle', back: true, onEnter: () => {} },
  profile:       { title: 'navProfile',     onEnter: () => renderProfile() },

/* ── Header system (Phase 3.2 — context-aware) ── */
const Header = {
  update(name) {
    const route = ROUTES[name] || {};
    const back = document.getElementById('navBack');
    const logo = document.getElementById('navLogo');
    const title = document.getElementById('navTitle');
    if (back) back.style.display = route.back ? 'inline-flex' : 'none';
    if (title) {
      if (route.title) {
        title.style.display = 'block';
        title.setAttribute('data-i18n', route.title);
        title.textContent = t(route.title);
      } else {
        title.style.display = 'none';
        title.removeAttribute('data-i18n');
      }
    }
    if (logo) logo.style.display = route.title ? 'none' : 'flex';
  }
};

const Router = {
  stack: [],
  go(name, opts = {}) {
    const route = ROUTES[name];
    if (!route) { console.warn('[Router] unknown route:', name); return; }
    // Guards: authentication-aware + role-based (protected screens)
    if (route.auth && (!State.cu || State.isGuest)) { requireAuth(); return; }
    if (route.roles && !route.roles.includes(Permissions.roleOf(State.cu))) {
      this.go('home', { replace: true });
      return;
    }
    // History stack (real multi-level back)
    if (!opts.replace && State.currentPage && State.currentPage !== name) {
      this.stack.push(State.currentPage);
      if (this.stack.length > 50) this.stack.shift();
    }
    try {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(n => n.classList.remove('active'));
      const pg = document.getElementById(name + 'Page');
      const nb = document.getElementById('nav-' + name);
      if (pg) pg.classList.add('active');
      if (nb) nb.classList.add('active');
      State.setPage(name);
      Header.update(name);
      if (route.onEnter) route.onEnter();
      window.scrollTo(0, 0);
    } catch (e) { console.error('[Router.go] Error:', e); }
  },
  back() {
    if (this.stack.length) this.go(this.stack.pop(), { replace: true });
    else this.go('home', { replace: true });
  },
  current() { return State.currentPage; }
};

/* Thin wrappers — keep existing onclick="goPage(...)" working everywhere */
/* ── Smart back + iOS edge swipe-back (Phase 3.3) ── */
function smartBack() {
  const openModal = document.querySelector('.modal-overlay.open');
  if (openModal) { openModal.classList.remove('open'); return; }
  const vs = document.getElementById('verifyScreen');
  if (vs && vs.classList.contains('show')) { Verify.close(); return; }
  Router.back();
}

(function attachSwipeBack() {
  let startX = 0, startY = 0, tracking = false;
  const EDGE = 28, THRESH = 70;
  document.addEventListener('touchstart', (e) => {
    tracking = false;
    const app = document.getElementById('appScreen');
    if (!app || !app.classList.contains('show')) return;
    if (document.querySelector('.modal-overlay.open, #onboardingScreen.show, #verifyScreen.show')) return;
    const t = e.touches[0];
    const isRTL = document.documentElement.dir === 'rtl';
    const fromStartEdge = isRTL ? (t.clientX > window.innerWidth - EDGE) : (t.clientX < EDGE);
    if (fromStartEdge) { tracking = true; startX = t.clientX; startY = t.clientY; }
  }, { passive: true });
  document.addEventListener('touchend', (e) => {
    if (!tracking) return; tracking = false;
    const t = e.changedTouches[0];
    const dx = t.clientX - startX, dy = t.clientY - startY;
    const isRTL = document.documentElement.dir === 'rtl';
    const horizontal = Math.abs(dx) > Math.abs(dy) * 1.5;
    const backward = isRTL ? (dx < -THRESH) : (dx > THRESH);
    if (horizontal && backward) smartBack();
  }, { passive: true });
})();

function goPage(name) { Router.go(name); }
function goBack() { smartBack(); }

/* Populate DOB day/month/year selects (Phase 2 signup) */
function populateDob() {
  const dayS = document.querySelector('[name="dobDay"]');
  const monS = document.querySelector('[name="dobMonth"]');
  const yrS  = document.querySelector('[name="dobYear"]');
  if (dayS && dayS.options.length <= 1)
    for (let d = 1; d <= 31; d++) { const o = document.createElement('option'); o.value = d; o.textContent = d; dayS.appendChild(o); }
  if (monS && monS.options.length <= 1)
    for (let m = 1; m <= 12; m++) { const o = document.createElement('option'); o.value = m; o.textContent = m; monS.appendChild(o); }
  if (yrS && yrS.options.length <= 1) {
    const now = new Date().getFullYear();
    for (let y = now - 13; y >= now - 80; y--) { const o = document.createElement('option'); o.value = y; o.textContent = y; yrS.appendChild(o); }
  }
}

async function doSignup(e) {
  e.preventDefault();
  const form = e.target;
  const btn  = form.querySelector('.submit-btn');
  clearFieldErrors(form);

  const _digits = (form.querySelector('[name="phone"]')?.value || '').replace(/\D/g, '').replace(/^0+/, '');
  const _dY = form.querySelector('[name="dobYear"]')?.value  || '';
  const _dM = form.querySelector('[name="dobMonth"]')?.value || '';
  const _dD = form.querySelector('[name="dobDay"]')?.value   || '';
  const data = {
    name:     form.querySelector('[name="name"]')?.value    || '',
    email:    form.querySelector('[name="email"]')?.value   || '',
    password: form.querySelector('[name="password"]')?.value || '',
    phone:    _digits ? '+963' + _digits : '',
    country:  form.querySelector('[name="country"]')?.value || '',
    city:     form.querySelector('[name="city"]')?.value    || '',
    dob:      (_dY && _dM && _dD) ? (_dY + '-' + String(_dM).padStart(2,'0') + '-' + String(_dD).padStart(2,'0')) : '',
    special:  form.querySelector('[name="special"]')?.value || ''
  };

  const _pw2 = form.querySelector('[name="password2"]')?.value || '';
  if (data.password !== _pw2) {
    clearFieldErrors(form);
    showFieldError(form, 'password2', t('errorPwMatch'));
    return;
  }

  // Validate (early, before loading/file reads)
  const { valid, errors } = Validators.signup(data);
  if (!valid) {
    Object.entries(errors).forEach(([field, msg]) => showFieldError(form, field, msg));
    btn && (btn.disabled = false);
    return;
  }
  if (UserService.getByEmail(data.email)) {
    showFieldError(form, 'email', t('errorEmail'));
    return;
  }

  setLoading(btn, true);
  try {
    const ppFile = form.querySelector('[name="profilePic"]');
    const idFile = form.querySelector('[name="idPhoto"]');
    data.profilePic = ppFile?.files[0] ? await b64(ppFile.files[0]) : null;
    data.idPhoto    = idFile?.files[0] ? await b64(idFile.files[0]) : null;

    const res = AuthService.register(data);
    if (!res.ok) {
      Object.entries(res.errors).forEach(([field, msg]) => showFieldError(form, field, msg));
      setLoading(btn, false);
      return;
    }

    form.reset();
    Reg.show(1);
    Auth.go('pending');
  } catch (err) {
    console.error('[doSignup] Error:', err);
    toast(State.lang === 'ar' ? 'حدث خطأ، حاول مجدداً' : 'An error occurred, please try again', 'error');
  }
  setLoading(btn, false);
}

/* ── Register multi-step controller (Phase 2.4) ── */
const Reg = {
  step: 1,
  show(s) {
    this.step = s;
    document.querySelectorAll('#authRegister .reg-step').forEach(el =>
      el.classList.toggle('active', Number(el.dataset.regstep) === s));
    document.querySelectorAll('#authRegister .auth-step').forEach(el =>
      el.classList.toggle('active', Number(el.dataset.step) <= s));
    const ls = document.getElementById('loginScreen'); if (ls) ls.scrollTop = 0;
  },
  back() { if (this.step === 2) this.show(1); else Auth.go('welcome'); },
  next() {
    const form = document.querySelector('#authRegister form');
    if (!form) return;
    clearFieldErrors(form);
    const val = n => (form.querySelector('[name="' + n + '"]')?.value || '');
    let ok = true;
    if (!Validators.isName(val('name')))    { showFieldError(form, 'name', t('errorNameLength')); ok = false; }
    if (!Validators.isEmail(val('email')))  { showFieldError(form, 'email', t('errorEmailFormat')); ok = false; }
    else if (UserService.getByEmail(val('email'))) { showFieldError(form, 'email', t('errorEmail')); ok = false; }
    if (!Validators.isRequired(val('phone'))) { showFieldError(form, 'phone', t('errorRequired')); ok = false; }
    if (!Validators.isPassword(val('password'))) { showFieldError(form, 'password', t('errorPasswordLength')); ok = false; }
    if (val('password') !== val('password2')) { showFieldError(form, 'password2', t('errorPwMatch')); ok = false; }
    if (ok) this.show(2);
  }
};

/* ── Forgot-password flow controller (Phase 2.5) ── */
const Forgot = {
  step: 1, userId: null, channel: null,
  _form() { return document.querySelector('#authForgot form'); },
  _val(n) { const el = this._form() && this._form().querySelector('[name="' + n + '"]'); return el ? el.value : ''; },
  show(s) {
    this.step = s;
    document.querySelectorAll('#authForgot .fp-step').forEach(el =>
      el.classList.toggle('active', Number(el.dataset.fpstep) === s));
    const ls = document.getElementById('loginScreen'); if (ls) ls.scrollTop = 0;
  },
  back() { if (this.step > 1 && this.step < 4) this.show(this.step - 1); else Auth.go('login'); },
  request() {
    const form = this._form(); clearFieldErrors(form);
    const id = this._val('fpId').trim();
    if (!id) { showFieldError(form, 'fpId', t('errorRequired')); return; }
    const res = AuthService.requestReset(id);
    if (!res.ok) { showFieldError(form, 'fpId', t('errorNoAccount')); return; }
    this.userId = res.userId; this.channel = res.channel;
    toast(t('codeSentDemo') + ' ' + res.code, 'success'); // demo: no backend email/SMS yet
    this.show(2);
  },
  verify() {
    const form = this._form(); clearFieldErrors(form);
    const code = this._val('fpCode').trim();
    if (OtpService.verify(this.userId, this.channel, code)) this.show(3);
    else showFieldError(form, 'fpCode', t('errorCode'));
  },
  reset() {
    const form = this._form(); clearFieldErrors(form);
    const pw = this._val('fpPw'), pw2 = this._val('fpPw2');
    if (!Validators.isPassword(pw)) { showFieldError(form, 'fpPw', t('errorPasswordLength')); return; }
    if (pw !== pw2) { showFieldError(form, 'fpPw2', t('errorPwMatch')); return; }
    const res = AuthService.resetPassword(this.userId, null, pw);
    if (res.ok) this.show(4);
    else toast(t('soon'), 'error');
  }
};

/* ── Onboarding controller (Phase 2.6) ── */
const Onb = {
  cats: new Set(), causes: new Set(),
  needs(user) {
    return !!(user && !user.isGuest && user.email !== CONFIG.ADMIN_EMAIL
      && user.status === 'approved' && !user.onboarded);
  },
  render() {
    this.cats   = new Set((State.cu && State.cu.interests) || []);
    this.causes = new Set((State.cu && State.cu.causes) || []);
    const isAr = State.lang === 'ar';
    const build = (id, dict, set) => {
      const el = document.getElementById(id); if (!el) return;
      el.innerHTML = Object.keys(dict).map(k => {
        const m = dict[k]; const sel = set.has(k) ? ' selected' : ''; const label = isAr ? m.ar : m.en;
        return `<button type="button" class="onb-chip${sel}" data-key="${k}" onclick="Onb.toggle('${id}','${k}',this)">${label}</button>`;
      }).join('');
    };
    build('onbCats', CONFIG.CAMP_CATEGORIES, this.cats);
    build('onbCauses', CONFIG.CAUSES, this.causes);
  },
  toggle(id, key, el) {
    const set = (id === 'onbCats') ? this.cats : this.causes;
    if (set.has(key)) { set.delete(key); el.classList.remove('selected'); }
    else { set.add(key); el.classList.add('selected'); }
  },
  show() { this.render(); document.getElementById('onboardingScreen').classList.add('show'); },
  hide() { document.getElementById('onboardingScreen').classList.remove('show'); },
  finish() {
    if (State.cu && State.cu.id)
      UserService.updateById(State.cu.id, { interests: [...this.cats], causes: [...this.causes], onboarded: true });
    this.hide(); goPage('home'); animateCounters(); toast(t('onbWelcome'), 'success');
  },
  skip() {
    if (State.cu && State.cu.id) UserService.updateById(State.cu.id, { onboarded: true });
    this.hide(); goPage('home'); animateCounters();
  }
};

function doLogin(e) {
  e.preventDefault();
  const form  = e.target;
  clearFieldErrors(form);
  const identifier = form.querySelector('[name="email"]')?.value    || '';
  const password   = form.querySelector('[name="password"]')?.value || '';

  const res = AuthService.login(identifier, password);
  if (!res.ok) {
    if (res.error === 'required') {
      if (!identifier.trim()) showFieldError(form, 'email', t('errorRequired'));
      if (!password.trim())   showFieldError(form, 'password', t('errorRequired'));
    } else if (res.error === 'banned') {
      const until = (res.user && res.user.banned) ? new Date(res.user.banned.until).toLocaleDateString() : '';
      toast(t('bannedMsg') + ' ' + until, 'error');
    } else if (res.error === 'rejected') {
      toast(t('rejectedBanner'), 'error');
    } else {
      showFieldError(form, 'email', t('errorLogin'));
      showFieldError(form, 'password', ' ');
    }
    return;
  }

  const remember = form.querySelector('[name="remember"]')?.checked !== false;
  AuthService.startSession(res.user, remember);
  closeModal('loginModal');
  enterApp();
}

function doLogout() {
  AuthService.logout();
  document.getElementById('loginScreen').style.display = 'flex';
  Auth.go('welcome');
  document.getElementById('appScreen').classList.remove('show');
  document.getElementById('navbar').style.display = 'none';
  document.getElementById('bottomNav').classList.remove('show');
  document.getElementById('createFab').classList.remove('show');
}

/* ── Guest gate: actions that need a real account (Phase 2) ── */
function requireAuth() {
  if (State.cu && !State.isGuest) return true;
  document.getElementById('appScreen').classList.remove('show');
  document.getElementById('navbar').style.display = 'none';
  const bn = document.getElementById('bottomNav'); if (bn) bn.classList.remove('show');
  const ls = document.getElementById('loginScreen'); if (ls) ls.style.display = 'flex';
  Auth.go('login');
  toast(t('guestPrompt'), '');
  return false;
}

function enterApp() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appScreen').classList.add('show');
  document.getElementById('navbar').style.display = 'block';
  document.getElementById('bottomNav').classList.add('show');
  document.getElementById('createFab').classList.add('show');

  const ut = document.getElementById('userTag');
  if (ut) { ut.textContent = State.cu ? State.cu.name : t('guest'); ut.classList.add('show'); }
  const lb = document.getElementById('logoutBtn');
  if (lb) { lb.style.display = 'block'; lb.textContent = State.isGuest ? t('loginCta') : t('logout'); }

  const adminRow = document.getElementById('menuAdminRow');
  if (adminRow) adminRow.style.display = State.isAdmin ? 'flex' : 'none';

  Verify._dismissed = false;
  Verify.bannerCheck();
  NotificationService.ensureWelcome(State.cu);
  updateBell();

  if (Onb.needs(State.cu)) {
    Onb.show();
  } else {
    goPage('home');
    animateCounters();
  }
}

/* ── CAMPAIGNS ── */
async function doCreate(e) {
  e.preventDefault();
  if (!requireAuth()) return;
  const form = e.target;
  const btn  = form.querySelector('.submit-btn');
  clearFieldErrors(form);

  if (!State.isAdmin && State.cu?.status !== 'approved') {
    toast(t('errorStatus'), 'warning');
    return;
  }

  const data = {
    title:    form.querySelector('[name="title"]')?.value    || '',
    category: form.querySelector('[name="category"]')?.value || '',
    location: form.querySelector('[name="location"]')?.value || '',
    date:     form.querySelector('[name="date"]')?.value     || '',
    needed:   form.querySelector('[name="needed"]')?.value   || '',
    hours:    form.querySelector('[name="hours"]')?.value    || '2',
    desc:     form.querySelector('[name="desc"]')?.value     || ''
  };

  const { valid, errors } = Validators.campaign(data);
  if (!valid) {
    Object.entries(errors).forEach(([field, msg]) => showFieldError(form, field, msg));
    return;
  }

  setLoading(btn, true);
  try {
    const imgFile = form.querySelector('[name="img"]');
    const img = imgFile?.files[0] ? await b64(imgFile.files[0]) : null;

    const camp = Models.createCampaign({ ...data, img }, State.cu, State.isAdmin);
    CampaignService.add(camp);

    // Increment activity count for creator
    UserService.updateById(State.cu.id, {
      activitiesJoined: (State.cu.activitiesJoined || 0) + 1
    });

    closeModal('createModal');
    form.reset();
    toast(State.isAdmin ? t('campCreated') : t('campPending'), 'success');
    renderCampaigns();
    renderMyCamps();
  } catch (err) {
    console.error('[doCreate] Error:', err);
    toast(State.lang === 'ar' ? 'حدث خطأ' : 'An error occurred', 'error');
  }
  setLoading(btn, false);
}

function handleJoin(id) {
  if (!requireAuth()) return;
  const result = CampaignService.join(id, State.cu);
  if (result.success) {
    toast(result.message, 'success');
    if (result.updatedUser) State.setUser(result.updatedUser);
    NotificationService.add(State.cu.id, 'انضممت إلى مبادرة جديدة ✓ شكراً لك!', 'You joined a new initiative ✓ Thank you!', 'join');
    updateBell();
    renderCampaigns();
    if (typeof ExploreUI !== 'undefined') ExploreUI.render();
    if (State.currentPage === 'detail') renderDetail(id);
    animateCounters();
  } else {
    toast(result.message, 'warning');
  }
}

/* ── ADMIN ACTIONS ── */
function handleBanUser(id, days) {
  if (!State.isAdmin) return;
  UserService.ban(id, days, 'no-show');
  NotificationService.add(id, 'تم تعليق حسابك لمدة ' + days + ' أيام بسبب عدم الحضور.', 'Your account is suspended for ' + days + ' days due to no-show.', 'ban');
  toast(t('userBanned'), 'success');
  admViewUser(id);
  if (typeof renderAdmin === 'function') renderAdmin();
}
function handleUnbanUser(id) {
  if (!State.isAdmin) return;
  UserService.unban(id);
  toast(t('userUnbanned'), 'success');
  admViewUser(id);
  if (typeof renderAdmin === 'function') renderAdmin();
}
function handleApproveUser(id) {
  const result = UserService.approve(id);
  if (result) { toast(t('approved'), 'success'); renderAdmin(); }
}

function handleRejectUser(id) {
  const result = UserService.reject(id);
  if (result) { toast(t('rejected'), 'warning'); renderAdmin(); }
}

function handleApproveCamp(id) {
  CampaignService.approve(id);
  toast(t('approved'), 'success');
  renderAdmin();
  renderCampaigns();
}

function handleRejectCamp(id) {
  CampaignService.reject(id);
  toast(t('rejected'), 'warning');
  renderAdmin();
  renderCampaigns();
}

function handleCampUnderProcess(id) {
  CampaignService.markUnderProcess(id);
  toast(t('campStatusUpdated'), 'success');
  renderAdmin();
  renderCampaigns();
}

function handleCampDone(id) {
  CampaignService.markDone(id);
  toast(t('campDoneMsg'), 'success');
  renderAdmin();
  renderCampaigns();
  animateCounters();
}

/* ── PROFILE ── */
async function uploadAvatar(event) {
  if (!requireAuth()) return;
  const file = event.target.files[0];
  if (!file || !State.cu || State.isAdmin) return;
  try {
    const data  = await b64(file);
    const result = UserService.updateById(State.cu.id, { profilePic: data });
    if (result) {
      toast(t('photoUpdated'), 'success');
      renderProfile();
    }
  } catch (e) {
    console.error('[uploadAvatar] Error:', e);
    toast(t('uploadError'), 'error');
  }
  event.target.value = '';
}

/* ── PARTNER FORM ── */
function submitPartner(e) {
  e.preventDefault();
  const form = e.target;
  const btn  = form.querySelector('.submit-btn') || form.querySelector('button[type="submit"]');
  clearFieldErrors(form);

  const data = {
    org:     form.querySelector('[name="org"]')?.value     || '',
    contact: form.querySelector('[name="contact"]')?.value || '',
    email:   form.querySelector('[name="email"]')?.value   || '',
    phone:   form.querySelector('[name="phone"]')?.value   || '',
    type:    form.querySelector('[name="type"]')?.value    || '',
    msg:     form.querySelector('[name="msg"]')?.value     || ''
  };

  const { valid, errors } = Validators.partner(data);
  if (!valid) {
    Object.entries(errors).forEach(([field, msg]) => showFieldError(form, field, msg));
    return;
  }

  setLoading(btn, true);
  const partner = Models.createPartner(data);
  PartnerService.add(partner);
  form.reset();
  toast(t('successSent'), 'success');
  setLoading(btn, false);
}

    populateDob();
    populateCategories();

    if (AuthService.restoreSession()) {
      enterApp();
    }

    // Attach modal backdrop close handlers
    document.querySelectorAll('.modal-overlay').forEach(m => {
      m.addEventListener('click', e => {
        if (e.target === m) m.classList.remove('open');
      });
    });
  } catch (e) {
    console.error('[ATHAR Bootstrap] Fatal error:', e);
  }
});
