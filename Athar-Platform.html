<!DOCTYPE html>
<html lang="ar" dir="rtl" data-lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>أَثَرْ | ATHAR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500;600;700&family=DM+Serif+Display&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">

<style>
/* ══════════════════════════════════════════
   ATHAR DESIGN SYSTEM — Production v2
   ══════════════════════════════════════════ */
:root {
  --olive:       #5C6A3A;
  --olive-mid:   #6b7a4f;
  --olive-light: #8A9B6E;
  --olive-pale:  #eef1e8;
  --olive-glow:  rgba(90,107,58,0.35);
  --sand:        #f5ede1;
  --sand-dark:   #e8d9c4;
  --warm-white:  #fdfaf6;

  /* ── BRAND PALETTE v2.0 (identity-aligned) ── */
  --forest:      #2E3D1F;   /* primary dark · backgrounds · headlines */
  --sage:        #8A9B6E;   /* = olive-light, brand name */
  --stone:       #C4B89A;   /* mid tan · cards */
  --warm-beige:  #E8E0D0;   /* cards · backgrounds */
  --off-white:   #F5F2EC;   /* page bases · clean space */
  --charcoal:    #1a1a1a;
  --charcoal-80: #333333;
  --charcoal-50: #888888;
  --charcoal-20: #d4d4d4;
  --white:       #ffffff;
  --red:         #c84c3c;
  --success:     #2d7a4f;
  --warn:        #c47d1a;

  --r-sm:   0.5rem;
  --r-md:   1rem;
  --r-lg:   1.25rem;
  --r-xl:   1.75rem;
  --r-2xl:  2.5rem;
  --r-full: 9999px;

  --shadow-sm: 0 1px 4px rgba(0,0,0,0.06);
  --shadow-md: 0 4px 20px rgba(0,0,0,0.08);
  --shadow-lg: 0 12px 40px rgba(0,0,0,0.12);
  --shadow-xl: 0 24px 60px rgba(0,0,0,0.16);

  /* ── SPACING SCALE (Phase 1 — shared spacing system) ── */
  --sp-1: 0.25rem;
  --sp-2: 0.5rem;
  --sp-3: 0.75rem;
  --sp-4: 1rem;
  --sp-5: 1.25rem;
  --sp-6: 1.5rem;
  --sp-7: 2rem;
  --sp-8: 2.5rem;
  --sp-9: 3rem;

  /* ── TYPOGRAPHY SCALE (Phase 1 — shared type system) ── */
  --fs-2xs:  0.65rem;
  --fs-xs:   0.72rem;
  --fs-sm:   0.78rem;
  --fs-base: 0.85rem;
  --fs-md:   0.92rem;
  --fs-lg:   1rem;
  --fs-xl:   1.15rem;
  --fs-2xl:  1.3rem;
  --fs-3xl:  1.5rem;
  --fs-4xl:  1.7rem;
  --fs-display: clamp(2.2rem, 7vw, 3.6rem);

  --fw-regular:  400;
  --fw-medium:   500;
  --fw-semibold: 600;
  --fw-bold:     700;
  --fw-black:    900;

  /* ── SURFACE + STATUS COLOR TOKENS (Phase 1 — fill audit gaps) ── */
  --surface-dark:   #2E3D1F;
  --surface-dark-2: #243017;

  --success-bg: #f0fdf4;  --success-fg: #166534;
  --red-bg:     #fef2f2;  --red-fg:     #991b1b;
  --warn-bg:    #fef9ec;  --warn-fg:    #92400e;

  /* ── ALPHA / LINE HELPERS (replace repeated rgba literals) ── */
  --line-sand:        rgba(232,217,196,0.5);
  --line:             #f0ece2;

  --content-max:      1280px;
  --line-sand-soft:   rgba(232,217,196,0.4);
  --line-sand-strong: rgba(232,217,196,0.7);
  --olive-a40:        rgba(90,107,58,0.4);
  --scrim:            rgba(0,0,0,0.5);
}

/* ── RESET ── */
*, *::before, *::after { margin: 0; padding: 0; box-sizing:border-box; }
html { scroll-behavior:smooth; -webkit-text-size-adjust:100%; }
body {
  background: var(--warm-white);
  color: var(--charcoal);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── TYPOGRAPHY SYSTEM ── */
/* Arabic */
[data-lang="ar"] body,
[data-lang="ar"] button,
[data-lang="ar"] input,
[data-lang="ar"] select,
[data-lang="ar"] textarea {
  font-family: 'Noto Naskh Arabic', serif;
}

/* English */
[data-lang="en"] body,
[data-lang="en"] button,
[data-lang="en"] input,
[data-lang="en"] select,
[data-lang="en"] textarea {
  font-family: 'DM Sans', sans-serif;
}

/* English display headlines use the editorial serif (brand identity) */
[data-lang="en"] .hero-title {
  font-family: 'DM Serif Display', Georgia, serif;
  font-weight: 400;
}

/* ── SCROLLBAR ── */
::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-thumb { background: var(--olive-light); border-radius: 2px; }

/* ══════════════════════════════════════════
   BRAND MARK (authentic fingerprint + sprout)
   ══════════════════════════════════════════ */
.brand-logo { display: block; height: auto; }
.brand-logo-lg { width: 78px; }
.brand-logo-sm { width: 26px; }
.brand-mark-wrap {
  display: flex;
  justify-content: center;
  margin-bottom: var(--sp-3);
}

/* ══════════════════════════════════════════
   NAVBAR
   ══════════════════════════════════════════ */
.navbar {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: calc(60px + env(safe-area-inset-top));
  padding-top: env(safe-area-inset-top);
  z-index: 500;
  background: rgba(253,250,246,0.95);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border-bottom: 1px solid rgba(232,217,196,0.4);
}

.navbar-inner {
  max-width: var(--content-max);
  margin: 0 auto;
  height: 60px;
  padding: 0 var(--sp-5);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-4);
}

.nav-logo {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  font-size: var(--fs-3xl);
  font-weight: 900;
  color: var(--olive);
  letter-spacing: 2px;
  cursor: pointer;
  flex-shrink: 0;
  font-family: 'Noto Naskh Arabic', serif !important;
}

.nav-end {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  flex-shrink: 0;
}

.pill-btn {
  height: 34px;
  padding: 0 var(--sp-4);
  border-radius: var(--r-full);
  font-size: var(--fs-sm);
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
  border: 1.5px solid var(--sand-dark);
  background: transparent;
  color: var(--charcoal);
  white-space: nowrap;
}
.pill-btn:hover { background: var(--sand); }

.pill-btn-red {
  color: var(--red);
  border-color: rgba(200,76,60,0.25);
}
.pill-btn-red:hover { background: rgba(200,76,60,0.06); }

.user-tag {
  height: 34px;
  padding: 0 var(--sp-3);
  background: var(--olive-pale);
  border-radius: var(--r-full);
  font-size: var(--fs-sm);
  font-weight: 700;
  color: var(--olive);
  display: none;
  align-items: center;
}
.user-tag.show { display: flex; }

/* ══════════════════════════════════════════
   LOGIN SCREEN
   ══════════════════════════════════════════ */
#loginScreen {
  min-height: 100vh;
  background: var(--forest);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}

.login-glow-1 {
  position: absolute;
  width: 600px; height: 600px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(90,107,58,0.4) 0%, transparent 70%);
  top: -150px; left: -150px;
  pointer-events: none;
}

.login-glow-2 {
  position: absolute;
  width: 400px; height: 400px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(90,107,58,0.2) 0%, transparent 70%);
  bottom: -100px; right: -100px;
  pointer-events: none;
}

.login-card {
  position: relative;
  z-index: 2;
  max-width: 360px;
  width: 90%;
  text-align: center;
  animation: fadeUp 0.5s ease both;
}

.login-logo {
  font-family: 'Noto Naskh Arabic', serif !important;
  font-size: 3rem;
  font-weight: 900;
  color: var(--white);
  letter-spacing: 6px;
  margin-bottom: var(--sp-2);
}

.login-tagline {
  font-size: var(--fs-base);
  color: rgba(255,255,255,0.3);
  margin-bottom: var(--sp-3);
  letter-spacing: 1px;
  font-family: 'Noto Naskh Arabic', serif;
}

.login-divider {
  width: 36px; height: 2px;
  background: linear-gradient(90deg, var(--olive-light), transparent);
  margin: 0 auto var(--sp-8);
  border-radius: 1px;
}

.login-actions { display: grid; gap: var(--sp-3); }

.login-btn-primary {
  width: 100%; height: 52px;
  background: var(--olive);
  color: var(--white);
  border: none;
  border-radius: var(--r-full);
  font-size: var(--fs-md);
  font-weight: 700;
  cursor: pointer;
  transition: all 0.25s;
  letter-spacing: 0.3px;
}
.login-btn-primary:hover {
  background: var(--olive-mid);
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(90,107,58,0.4);
}

.login-btn-secondary {
  width: 100%; height: 52px;
  background: rgba(255,255,255,0.06);
  color: rgba(255,255,255,0.6);
  border: 1.5px solid rgba(255,255,255,0.12);
  border-radius: var(--r-full);
  font-size: var(--fs-md);
  font-weight: 600;
  cursor: pointer;
  transition: all 0.25s;
}
.login-btn-secondary:hover {
  background: rgba(255,255,255,0.1);
  color: rgba(255,255,255,0.85);
}

/* ══════════════════════════════════════════
   APP SHELL
   ══════════════════════════════════════════ */
#appScreen {
  display: none;
  padding-top: calc(60px + env(safe-area-inset-top));
  padding-bottom: 70px;
  min-height: 100vh;
}
#appScreen.show { display: block; }

/* ── PAGES ── */
.page {
  display: none;
  background: var(--warm-white);
}
.page.active {
  display: block;
  animation: pageIn 0.34s cubic-bezier(0.22, 0.61, 0.36, 1);
}

@keyframes pageIn {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }}

@media (prefers-reduced-motion: reduce) {
  .page.active { animation: none; }
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }}

/* ══════════════════════════════════════════
   HOME PAGE — HERO
   ══════════════════════════════════════════ */
.hero {
  min-height: 68vh;
  background: var(--forest);
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
}

.hero-glow {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 70% at 10% 60%, rgba(90,107,58,0.45) 0%, transparent 55%),
    radial-gradient(ellipse 40% 50% at 90% 20%, rgba(90,107,58,0.1) 0%, transparent 50%);
  pointer-events: none;
}

.hero-grid {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px);
  background-size: 52px 52px;
  pointer-events: none;
}

.hero-ring {
  position: absolute;
  border-radius: 50%;
  border: 1px solid rgba(90,107,58,0.12);
  pointer-events: none;
}

.hero-ring-1 { width: 400px; height: 400px; top: -150px; right: -100px; }
.hero-ring-2 { width: 280px; height: 280px; top: -60px;  right: -40px; border-color: rgba(90,107,58,0.06); }

.hero-arc {
  position: absolute;
  bottom: -1px; left: 0; right: 0;
  height: 56px;
  background: var(--warm-white);
  clip-path: ellipse(55% 100% at 50% 100%);
  z-index: 3;
}

.hero-content {
  position: relative;
  z-index: 2;
  padding: 4rem var(--sp-6) 4.5rem;
  max-width: var(--content-max);
  width: 100%;
  margin: 0 auto;
}

.hero-eyebrow {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  margin-bottom: var(--sp-7);
}

.hero-eyebrow-dot {
  width: 5px; height: 5px;
  background: var(--olive-light);
  border-radius: 50%;
  flex-shrink: 0;
}

.hero-eyebrow-text {
  font-size: var(--fs-2xs);
  font-weight: 700;
  letter-spacing: 3.5px;
  color: rgba(255,255,255,0.3);
  text-transform: uppercase;
}

.hero-title {
  font-size: clamp(2.2rem, 7vw, 3.6rem);
  font-weight: 900;
  color: var(--white);
  line-height: 1.18;
  margin-bottom: var(--sp-6);
  letter-spacing: 0.8px;
}

.hero-title-accent {
  color: var(--olive-light);
  display: block;
}

.hero-rule {
  width: 28px; height: 2px;
  background: linear-gradient(90deg, var(--olive-light), transparent);
  margin-bottom: var(--sp-6);
  border-radius: 1px;
}

.hero-subtitle {
  font-size: var(--fs-md);
  color: rgba(255,255,255,0.42);
  line-height: 1.9;
  max-width: 360px;
  margin-bottom: 2.2rem;
  font-weight: 400;
}

.hero-actions {
  display: flex;
  align-items: center;
  gap: var(--sp-5);
  flex-wrap: wrap;
}

.hero-btn {
  height: 44px;
  padding: 0 var(--sp-6);
  background: var(--olive);
  color: var(--white);
  border: none;
  border-radius: var(--r-full);
  font-size: var(--fs-base);
  font-weight: 700;
  cursor: pointer;
  transition: all 0.25s;
  white-space: nowrap;
}
.hero-btn:hover {
  background: var(--olive-mid);
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(90,107,58,0.4);
}

.hero-link {
  font-size: var(--fs-base);
  color: rgba(255,255,255,0.32);
  cursor: pointer;
  transition: color 0.2s;
  white-space: nowrap;
}
.hero-link:hover { color: rgba(255,255,255,0.6); }

/* ══════════════════════════════════════════
   IMPACT COUNTER
   ══════════════════════════════════════════ */
.impact-wrap {
  padding: 0 var(--sp-5);
  background: var(--warm-white);
  position: relative;
  z-index: 10;
}

.impact-card {
  max-width: var(--content-max);
  margin: -24px auto 0;
  background: var(--white);
  border-radius: var(--r-xl);
  border: 1px solid rgba(232,217,196,0.7);
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  overflow: hidden;
  box-shadow: var(--shadow-md);
  position: relative;
  z-index: 5;
}

.impact-item {
  text-align: center;
  padding: var(--sp-5) var(--sp-2);
  border-inline-end: 1px solid rgba(232,217,196,0.6);
  transition: background 0.2s;
}
.impact-item:last-child { border-inline-end: none; }
.impact-item:hover { background: var(--sand); }

.impact-num {
  font-size: var(--fs-3xl);
  font-weight: 900;
  color: var(--olive);
  line-height: 1;
  font-family: 'DM Sans', sans-serif;
}

.impact-lbl {
  font-size: var(--fs-2xs);
  color: var(--charcoal-50);
  margin-top: var(--sp-1);
  font-weight: 600;
  line-height: 1.3;
}

/* ══════════════════════════════════════════
   SECTION WRAPPER
   ══════════════════════════════════════════ */
.section {
  max-width: var(--content-max);
  margin: 0 auto;
  padding: var(--sp-7) var(--sp-5) var(--sp-8);
}

.section-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: var(--sp-5);
  padding-bottom: var(--sp-4);
  border-bottom: 1px solid rgba(232,217,196,0.5);
}

.section-title {
  font-size: var(--fs-xl);
  font-weight: 800;
  color: var(--charcoal);
}

.section-link {
  font-size: var(--fs-sm);
  color: var(--olive);
  font-weight: 700;
  cursor: pointer;
  transition: opacity 0.2s;
}
.section-link:hover { opacity: 0.65; }

/* ══════════════════════════════════════════
   CAMPAIGN CARDS
   ══════════════════════════════════════════ */
.camps-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: var(--sp-4);
}

.camp-card {
  background: var(--white);
  border-radius: var(--r-xl);
  overflow: hidden;
  border: 1px solid rgba(232,217,196,0.5);
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
}
.camp-card:hover {
  transform: translateY(-6px);
  box-shadow: var(--shadow-lg);
  border-color: transparent;
}

.camp-img {
  height: 185px;
  position: relative;
  overflow: hidden;
}

.camp-img img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.5s ease;
}
.camp-card:hover .camp-img img { transform: scale(1.04); }

.camp-img-fallback {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2.8rem;
}

.camp-img-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,0.5) 0%, transparent 50%);
}

.camp-badge {
  position: absolute;
  top: 0.9rem;
  padding: var(--sp-1) var(--sp-3);
  border-radius: var(--r-full);
  font-size: var(--fs-2xs);
  font-weight: 700;
  backdrop-filter: blur(8px);
}

[data-lang="ar"] .camp-badge { right: 0.9rem; }
[data-lang="en"] .camp-badge { left: 0.9rem; }

.camp-badge-cat {
  position: absolute;
  top: 0.9rem;
  background: rgba(255,255,255,0.88);
  color: var(--olive);
}
[data-lang="ar"] .camp-badge-cat { left: 0.9rem; }
[data-lang="en"] .camp-badge-cat { right: 0.9rem; }

.status-approved { background: rgba(220,252,231,0.9); color: #166534; }
.status-pending  { background: rgba(254,243,199,0.9); color: #92400e; }
.status-rejected { background: rgba(254,226,226,0.9); color: #991b1b; }
.status-done     { background: rgba(224,231,255,0.9); color: #3730a3; }

.camp-body { padding: var(--sp-5); }

.camp-title {
  font-size: var(--fs-lg);
  font-weight: 800;
  margin-bottom: var(--sp-2);
  color: var(--charcoal);
  line-height: 1.35;
}

.camp-desc {
  font-size: var(--fs-sm);
  color: var(--charcoal-50);
  line-height: 1.65;
  margin-bottom: var(--sp-4);
}

.camp-meta {
  display: grid;
  gap: var(--sp-1);
  margin-bottom: var(--sp-4);
}

.camp-meta-row {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  font-size: var(--fs-sm);
  color: var(--charcoal-50);
}

.camp-meta-dot {
  width: 4px; height: 4px;
  background: var(--olive-light);
  border-radius: 50%;
  flex-shrink: 0;
}

.prog-track {
  height: 4px;
  background: var(--sand);
  border-radius: 2px;
  overflow: hidden;
  margin-bottom: var(--sp-1);
}
.prog-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--olive), var(--olive-light));
  border-radius: 2px;
  transition: width 0.8s ease;
}

.prog-label {
  font-size: var(--fs-xs);
  color: var(--charcoal-50);
  margin-bottom: var(--sp-4);
}

.camp-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-3);
}

.camp-pct {
  font-size: var(--fs-sm);
  color: var(--charcoal-50);
}
.camp-pct strong { color: var(--olive); }

.join-btn {
  height: 36px;
  padding: 0 var(--sp-4);
  background: var(--olive);
  color: var(--white);
  border: none;
  border-radius: var(--r-full);
  font-size: var(--fs-sm);
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
  flex-shrink: 0;
}
.join-btn:hover:not(:disabled) {
  background: var(--olive-mid);
  transform: translateY(-1px);
}
.join-btn:disabled {
  background: var(--olive-pale);
  color: var(--olive-light);
  cursor: not-allowed;
}

/* ══════════════════════════════════════════
   CAMPAIGN DETAIL PAGE
   ══════════════════════════════════════════ */
.detail-hero {
  height: 320px;
  position: relative;
  overflow: hidden;
  background: var(--surface-dark-2);
  display: flex;
  align-items: center;
  justify-content: center;
}

.detail-hero img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  display: block;
}

.detail-hero-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.05) 70%);
}

.detail-back {
  position: absolute;
  top: 1rem;
  width: 38px; height: 38px;
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(8px);
  border: none;
  border-radius: 50%;
  color: white;
  font-size: var(--fs-xl);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2;
  transition: background 0.2s;
}
.detail-back:hover { background: rgba(255,255,255,0.25); }
[data-lang="ar"] .detail-back { right: 1rem; }
[data-lang="en"] .detail-back { left: 1rem; }

.detail-body {
  max-width: 800px;
  margin: 0 auto;
  padding: 1.75rem var(--sp-5) var(--sp-9);
}

.detail-cat {
  font-size: var(--fs-2xs);
  font-weight: 700;
  letter-spacing: 2.5px;
  color: var(--olive-light);
  text-transform: uppercase;
  margin-bottom: var(--sp-2);
}

.detail-title {
  font-size: var(--fs-4xl);
  font-weight: 900;
  color: var(--charcoal);
  line-height: 1.2;
  margin-bottom: var(--sp-3);
}

.detail-desc {
  font-size: var(--fs-md);
  color: var(--charcoal-50);
  line-height: 1.85;
  margin-bottom: 1.75rem;
}

.detail-info-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--sp-3);
  margin-bottom: var(--sp-6);
}

.detail-info-card {
  background: var(--white);
  border: 1px solid rgba(232,217,196,0.6);
  border-radius: var(--r-lg);
  padding: var(--sp-4) var(--sp-4);
}

.detail-info-label {
  font-size: var(--fs-2xs);
  font-weight: 700;
  letter-spacing: 1.5px;
  color: var(--charcoal-50);
  text-transform: uppercase;
  margin-bottom: var(--sp-1);
}

.detail-info-value {
  font-size: var(--fs-md);
  font-weight: 700;
  color: var(--charcoal);
}

.detail-progress-card {
  background: var(--white);
  border: 1px solid rgba(232,217,196,0.6);
  border-radius: var(--r-lg);
  padding: var(--sp-5);
  margin-bottom: var(--sp-6);
}

.detail-progress-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: var(--sp-3);
}

.detail-progress-label {
  font-size: var(--fs-sm);
  color: var(--charcoal-50);
  font-weight: 600;
}

.detail-progress-pct {
  font-size: var(--fs-base);
  font-weight: 800;
  color: var(--olive);
}

.detail-join-btn {
  width: 100%;
  height: 52px;
  background: var(--olive);
  color: var(--white);
  border: none;
  border-radius: var(--r-full);
  font-size: var(--fs-md);
  font-weight: 800;
  cursor: pointer;
  transition: all 0.25s;
  letter-spacing: 0.3px;
}
.detail-join-btn:hover:not(:disabled) {
  background: var(--olive-mid);
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(90,107,58,0.35);
}
.detail-join-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

/* ══════════════════════════════════════════
   EXPLORE PAGE
   ══════════════════════════════════════════ */
.explore-header {
  background: var(--charcoal);
  padding: var(--sp-7) var(--sp-5) var(--sp-8);
  position: relative;
  overflow: hidden;
}

.explore-header::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse 80% 100% at 0% 100%, var(--olive-glow) 0%, transparent 60%);
}

.explore-header h1 {
  position: relative;
  font-size: 1.8rem;
  font-weight: 900;
  color: var(--white);
  margin-bottom: var(--sp-2);
}

.explore-header p {
  position: relative;
  font-size: var(--fs-base);
  color: rgba(255,255,255,0.4);
}

/* ══════════════════════════════════════════
   CREATE PAGE
   ══════════════════════════════════════════ */
.create-hero {
  background: var(--charcoal);
  padding: var(--sp-8) var(--sp-5) var(--sp-9);
  position: relative;
  overflow: hidden;
  text-align: center;
}
.create-hero::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse 60% 80% at 50% 50%, rgba(90,107,58,0.3) 0%, transparent 60%);
}
.create-hero > * { position: relative; z-index: 1; }

.create-hero h1 {
  font-size: var(--fs-4xl);
  font-weight: 900;
  color: var(--white);
  margin-bottom: var(--sp-2);
}

.create-hero p {
  font-size: var(--fs-base);
  color: rgba(255,255,255,0.38);
  margin-bottom: 1.75rem;
  line-height: 1.7;
}

.create-btn {
  height: 48px;
  padding: 0 var(--sp-7);
  background: var(--olive);
  color: var(--white);
  border: none;
  border-radius: var(--r-full);
  font-size: var(--fs-md);
  font-weight: 700;
  cursor: pointer;
  transition: all 0.25s;
}
.create-btn:hover {
  background: var(--olive-mid);
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(90,107,58,0.4);
}

.my-camps-section {
  max-width: var(--content-max);
  margin: 1.75rem auto 0;
  padding: 0 var(--sp-5);
}

.my-camps-title {
  font-size: var(--fs-lg);
  font-weight: 800;
  margin-bottom: var(--sp-4);
  color: var(--charcoal);
}

.my-camp-row {
  background: var(--white);
  border: 1px solid rgba(232,217,196,0.6);
  border-radius: var(--r-lg);
  padding: var(--sp-4) var(--sp-4);
  margin-bottom: var(--sp-3);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: var(--sp-4);
}

.my-camp-info-title { font-size: var(--fs-md); font-weight: 700; margin-bottom: var(--sp-1); }
.my-camp-info-sub { font-size: var(--fs-sm); color: var(--charcoal-50); }

.status-chip {
  padding: var(--sp-1) var(--sp-3);
  border-radius: var(--r-full);
  font-size: var(--fs-xs);
  font-weight: 700;
  white-space: nowrap;
  flex-shrink: 0;
}

/* ══════════════════════════════════════════
   PROFILE PAGE
   ══════════════════════════════════════════ */
.profile-cover {
  height: 180px;
  background: var(--charcoal);
  position: relative;
  overflow: visible;
}

.profile-cover::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse 80% 100% at 0% 100%, rgba(90,107,58,0.45) 0%, transparent 55%);
}

.profile-avatar-ring {
  position: absolute;
  top: 20px;
  width: 88px;
  height: 88px;
  border-radius: 50%;
  background: var(--warm-white);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10;
  box-shadow: 0 4px 20px rgba(0,0,0,0.15);
}

[data-lang="ar"] .profile-avatar-ring { right: 20px; }
[data-lang="en"] .profile-avatar-ring { left: 20px; }

.profile-avatar {
  width: 78px;
  height: 78px;
  border-radius: 50%;
  border: 3px solid var(--warm-white);
  background: var(--sand);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2rem;
  position: relative;
}

.profile-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  display: block;
}

.profile-meta-bar {
  max-width: var(--content-max);
  margin: 0 auto;
  padding: var(--sp-7) var(--sp-5) var(--sp-5);
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: var(--sp-4);
}

.profile-name-wrap .name {
  font-size: var(--fs-xl);
  font-weight: 900;
  margin-bottom: var(--sp-1);
}

.profile-name-wrap .loc {
  font-size: var(--fs-sm);
  color: var(--charcoal-50);
}

.change-pic-label {
  height: 34px;
  padding: 0 var(--sp-4);
  border: 1.5px solid var(--sand-dark);
  border-radius: var(--r-full);
  font-size: var(--fs-sm);
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  background: transparent;
  transition: background 0.2s;
  white-space: nowrap;
  flex-shrink: 0;
}
.change-pic-label:hover { background: var(--sand); }
.change-pic-label:hover { background: var(--sand); }

.profile-stats {
  max-width: var(--content-max);
  margin: 0 auto;
  padding: 0 var(--sp-5);
}

.stats-card {
  background: var(--white);
  border: 1px solid rgba(232,217,196,0.6);
  border-radius: var(--r-xl);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  overflow: hidden;
  margin-bottom: var(--sp-5);
}

.stat-cell {
  text-align: center;
  padding: var(--sp-5) var(--sp-2);
  border-inline-end: 1px solid rgba(232,217,196,0.6);
}
.stat-cell:last-child { border-inline-end: none; }

.stat-num {
  font-size: var(--fs-4xl);
  font-weight: 900;
  color: var(--olive);
  font-family: 'DM Sans', sans-serif;
}

.stat-lbl {
  font-size: var(--fs-2xs);
  color: var(--charcoal-50);
  margin-top: var(--sp-1);
  font-weight: 600;
}

/* Profile Menu */
.profile-menu {
  max-width: var(--content-max);
  margin: 0 auto;
  padding: 0 var(--sp-5) var(--sp-7);
}

.menu-card {
  background: var(--white);
  border: 1px solid rgba(232,217,196,0.6);
  border-radius: var(--r-xl);
  overflow: hidden;
}

.menu-row {
  display: flex;
  align-items: center;
  gap: var(--sp-4);
  padding: var(--sp-4) var(--sp-5);
  cursor: pointer;
  transition: background 0.18s;
  border-bottom: 1px solid rgba(232,217,196,0.4);
}
.menu-row:last-child { border-bottom: none; }
.menu-row:hover { background: var(--sand); }

.menu-icon {
  width: 38px; height: 38px;
  border-radius: var(--r-sm);
  background: var(--olive-pale);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: var(--fs-lg);
  flex-shrink: 0;
}

.menu-texts { flex: 1; min-width: 0; }
.menu-title { font-size: var(--fs-base); font-weight: 700; }
.menu-sub { font-size: var(--fs-xs); color: var(--charcoal-50); margin-top: 0.1rem; }

.menu-arrow {
  font-size: var(--fs-lg);
  color: var(--charcoal-20);
  transition: transform 0.2s;
}

.menu-section-body {
  display: none;
  background: var(--sand);
  padding: var(--sp-4) var(--sp-5);
  border-bottom: 1px solid rgba(232,217,196,0.4);
}

.info-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: var(--sp-3) var(--sp-4);
  background: var(--white);
  border-radius: var(--r-md);
  margin-bottom: var(--sp-2);
}
.info-item:last-child { margin-bottom: 0; }
.info-lbl { font-size: var(--fs-sm); color: var(--charcoal-50); }
.info-val { font-size: var(--fs-base); font-weight: 700; }

.status-banner-wrap {
  max-width: var(--content-max);
  margin: 0 auto;
  padding: var(--sp-3) var(--sp-5);
}

.status-banner {
  padding: var(--sp-3) var(--sp-4);
  border-radius: var(--r-lg);
  font-size: var(--fs-base);
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: var(--sp-2);
}
.banner-pending  { background: #fef9ec; color: #92400e; }
.banner-approved { background: #f0fdf4; color: #166534; }
.banner-rejected { background: #fef2f2; color: #991b1b; }

/* ══════════════════════════════════════════
   ABOUT PAGE
   ══════════════════════════════════════════ */
.about-hero {
  background: var(--charcoal);
  padding: 3.5rem var(--sp-5) 4rem;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.about-hero::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse 70% 80% at 50% 30%, rgba(90,107,58,0.35) 0%, transparent 60%);
}
.about-hero > * { position: relative; z-index: 1; }

.about-hero-title {
  font-size: clamp(2rem, 6vw, 3rem);
  font-weight: 900;
  color: var(--white);
  line-height: 1.2;
  margin-bottom: var(--sp-4);
}
.about-hero-title em { color: var(--olive-light); font-style: normal; display: block; }

.about-hero-sub {
  font-size: var(--fs-md);
  color: rgba(255,255,255,0.38);
  line-height: 1.85;
  max-width: 420px;
  margin: 0 auto;
}

.about-content {
  max-width: var(--content-max);
  margin: 0 auto;
  padding: var(--sp-7) var(--sp-5);
}

.about-block {
  background: var(--white);
  border: 1px solid rgba(232,217,196,0.6);
  border-radius: var(--r-xl);
  padding: var(--sp-7);
  margin-bottom: var(--sp-4);
}
.about-block h2 {
  font-size: var(--fs-xl);
  font-weight: 900;
  color: var(--olive);
  margin-bottom: var(--sp-3);
}
.about-block p {
  font-size: var(--fs-base);
  color: var(--charcoal-50);
  line-height: 1.85;
}

/* Partnership */
.partner-section {
  background: var(--forest);
  border-radius: var(--r-2xl);
  padding: var(--sp-8) var(--sp-6);
  margin-bottom: var(--sp-4);
  position: relative;
  overflow: hidden;
  text-align: center;
}
.partner-section::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse 70% 70% at 50% 50%, rgba(90,107,58,0.28) 0%, transparent 55%);
}
.partner-section > * { position: relative; z-index: 1; }

.partner-title {
  font-size: var(--fs-3xl);
  font-weight: 900;
  color: var(--white);
  margin-bottom: var(--sp-3);
  line-height: 1.25;
}

.partner-sub {
  font-size: var(--fs-base);
  color: rgba(255,255,255,0.38);
  line-height: 1.8;
  max-width: 400px;
  margin: 0 auto var(--sp-7);
}

.partner-form {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: var(--r-xl);
  padding: 1.75rem;
  text-align: start;
  max-width: 560px;
  margin: 0 auto;
}

.partner-form-title {
  font-size: var(--fs-lg);
  font-weight: 800;
  color: var(--white);
  margin-bottom: var(--sp-1);
}

.partner-form-sub {
  font-size: var(--fs-sm);
  color: rgba(255,255,255,0.35);
  margin-bottom: var(--sp-6);
  line-height: 1.6;
}

.dark-field { margin-bottom: var(--sp-3); }
.dark-field label {
  display: block;
  font-size: var(--fs-2xs);
  font-weight: 700;
  letter-spacing: 1.5px;
  color: rgba(255,255,255,0.3);
  text-transform: uppercase;
  margin-bottom: var(--sp-1);
}

.dark-input {
  width: 100%;
  height: 44px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: var(--r-md);
  color: var(--white);
  font-size: var(--fs-base);
  padding: 0 var(--sp-4);
  transition: all 0.2s;
}
.dark-input::placeholder { color: rgba(255,255,255,0.2); }
.dark-input:focus {
  outline: none;
  border-color: var(--olive-light);
  background: rgba(255,255,255,0.08);
}

.dark-textarea {
  height: 90px;
  resize: none;
  padding: var(--sp-3) var(--sp-4);
}

.dark-select { cursor: pointer; appearance: none; }

.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-3); }

.dark-submit {
  width: 100%;
  height: 48px;
  background: var(--olive);
  color: var(--white);
  border: none;
  border-radius: var(--r-full);
  font-size: var(--fs-md);
  font-weight: 700;
  cursor: pointer;
  transition: all 0.25s;
  margin-top: var(--sp-2);
}
.dark-submit:hover {
  background: var(--olive-mid);
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(90,107,58,0.4);
}

.admin-card {
  background: var(--white);
  border: 1px solid rgba(232,217,196,0.6);
  border-radius: var(--r-xl);
  padding: var(--sp-6);
  margin-bottom: var(--sp-4);
}

.admin-card-head {
  display: flex;
  gap: var(--sp-4);
  margin-bottom: var(--sp-4);
  align-items: flex-start;
}

.admin-ava {
  width: 50px; height: 50px;
  border-radius: 50%;
  background: var(--sand);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: var(--fs-3xl);
  flex-shrink: 0;
  overflow: hidden;
  border: 2px solid var(--sand-dark);
}
.admin-ava img { width:100%; height:100%; object-fit:cover; }

.admin-info { flex: 1; min-width: 0; }
.admin-info-name { font-size: var(--fs-md); font-weight: 800; margin-bottom: var(--sp-1); }
.admin-info-row {
  font-size: var(--fs-sm);
  color: var(--charcoal-50);
  margin-top: var(--sp-1);
  line-height: 1.4;
}

.admin-actions { display: flex; gap: var(--sp-2); }

.approve-btn {
  flex: 1;
  height: 40px;
  background: var(--olive);
  color: var(--white);
  border: none;
  border-radius: var(--r-full);
  font-size: var(--fs-base);
  font-weight: 700;
  cursor: pointer;
  transition: background 0.2s;
}
.approve-btn:hover { background: var(--olive-mid); }

.reject-btn {
  flex: 1;
  height: 40px;
  background: transparent;
  color: var(--red);
  border: 1.5px solid rgba(200,76,60,0.25);
  border-radius: var(--r-full);
  font-size: var(--fs-base);
  font-weight: 700;
  cursor: pointer;
  transition: background 0.2s;
}
.reject-btn:hover { background: rgba(200,76,60,0.06); }

/* ══════════════════════════════════════════
   MODAL — BOTTOM SHEET
   ══════════════════════════════════════════ */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 600;
  align-items: flex-end;
  justify-content: center;
  backdrop-filter: blur(6px);
}
.modal-overlay.open { display: flex; }

.modal-sheet {
  background: var(--white);
  border-radius: var(--r-2xl) var(--r-2xl) 0 0;
  padding: 0 var(--sp-6) var(--sp-9);
  width: 100%;
  max-width: 580px;
  max-height: 92vh;
  overflow-y: auto;
  animation: sheetUp 0.32s cubic-bezier(0.4,0,0.2,1);
}

@keyframes sheetUp {
  from { transform: translateY(100%); }
  to   { transform: translateY(0); }}

.modal-bar { position: sticky; top: 0; z-index: 3; background: var(--white);
  display: flex; align-items: center; justify-content: center; padding-top: var(--sp-2); }
.modal-close { position: absolute; inset-inline-start: 0; top: 0.5rem;
  width: 38px; height: 38px; border-radius: var(--r-full);
  border: 1px solid var(--sand-dark); background: var(--white); color: var(--charcoal);
  font-size: 1.5rem; line-height: 1; cursor: pointer; transition: background 0.2s; }
.modal-close:hover { background: var(--sand); }
[dir="rtl"] .modal-close { transform: scaleX(-1); }

.modal-handle {
  width: 36px; height: 4px;
  background: var(--sand-dark);
  border-radius: 2px;
  margin: var(--sp-4) auto var(--sp-6);
}

.modal-title {
  font-size: var(--fs-2xl);
  font-weight: 900;
  margin-bottom: var(--sp-6);
  text-align: center;
}

/* Form fields */
.field { margin-bottom: var(--sp-4); }
.field label {
  display: block;
  font-size: var(--fs-xs);
  font-weight: 700;
  color: var(--charcoal-50);
  letter-spacing: 0.5px;
  margin-bottom: var(--sp-2);
}

.field input,
.field textarea,
.field select {
  width: 100%;
  height: 46px;
  padding: 0 var(--sp-4);
  background: var(--sand);
  border: 1.5px solid transparent;
  border-radius: var(--r-md);
  font-size: var(--fs-md);
  color: var(--charcoal);
  transition: all 0.2s;
}

.field textarea { height: 90px; padding: var(--sp-3) var(--sp-4); resize: none; }

.field input:focus,
.field textarea:focus,
.field select:focus {
  outline: none;
  border-color: var(--olive);
  background: var(--white);
  box-shadow: 0 0 0 3px rgba(90,107,58,0.08);
}

.field input[type="file"] {
  height: auto;
  padding: var(--sp-3);
  cursor: pointer;
}

input[type="file"]::file-selector-button {
  background: var(--olive);
  color: white;
  padding: var(--sp-1) var(--sp-3);
  border: none;
  border-radius: var(--r-full);
  font-size: var(--fs-sm);
  font-weight: 700;
  cursor: pointer;
  margin-inline-end: var(--sp-2);
}

.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-3); }

.submit-btn {
  width: 100%;
  height: 52px;
  background: var(--olive);
  color: var(--white);
  border: none;
  border-radius: var(--r-full);
  font-size: var(--fs-md);
  font-weight: 800;
  cursor: pointer;
  transition: all 0.25s;
  margin-top: var(--sp-2);
  letter-spacing: 0.3px;
}
.submit-btn:hover {
  background: var(--olive-mid);
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(90,107,58,0.35);
}

/* ══════════════════════════════════════════
   BOTTOM NAV
   ══════════════════════════════════════════ */
.bottom-nav {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: 64px;
  z-index: 400;
  background: rgba(253,250,246,0.97);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid rgba(232,217,196,0.5);
  display: none;
}
.bottom-nav.show { display: block; }

.bottom-nav-inner {
  max-width: var(--content-max);
  margin: 0 auto;
  height: 100%;
  display: flex;
  justify-content: space-around;
  align-items: center;
  padding: 0 var(--sp-2);
  padding-bottom: env(safe-area-inset-bottom);
}

.nav-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--sp-1);
  flex: 1;
  height: 100%;
  border: none;
  background: none;
  cursor: pointer;
  color: var(--charcoal-50);
  font-size: var(--fs-2xs);
  font-weight: 700;
  transition: color 0.2s;
  padding: var(--sp-2) 0;
}
.nav-btn:hover { color: var(--olive); }
.nav-btn.active { color: var(--olive); }

.nav-btn svg {
  width: 22px; height: 22px;
  stroke: currentColor;
  stroke-width: 1.8;
  fill: none;
  transition: stroke 0.2s;
}

.nav-btn-text { line-height: 1; }

/* ══════════════════════════════════════════
   EMPTY STATE
   ══════════════════════════════════════════ */
.empty-state {
  text-align: center;
  padding: 3.5rem var(--sp-6);
  background: var(--white);
  border-radius: var(--r-xl);
  border: 1px solid rgba(232,217,196,0.5);
}
.empty-icon { font-size: 2.5rem; margin-bottom: var(--sp-3); }
.empty-title { font-size: var(--fs-lg); font-weight: 800; margin-bottom: var(--sp-1); }

/* ══════════════════════════════════════════
   TOAST
   ══════════════════════════════════════════ */
.toast {
  position: fixed;
  bottom: 5rem;
  left: 50%;
  transform: translateX(-50%) translateY(10px);
  background: var(--charcoal);
  color: var(--white);
  padding: var(--sp-3) var(--sp-6);
  border-radius: var(--r-full);
  font-size: var(--fs-base);
  font-weight: 600;
  z-index: 999;
  white-space: nowrap;
  animation: toastAnim 0.3s ease forwards;
  box-shadow: var(--shadow-lg);
  max-width: 90vw;
  text-align: center;
}
.toast.success { background: var(--olive); }
.toast.error   { background: var(--red); }
.toast.warning { background: var(--warn); }

@keyframes toastAnim {
  to { transform: translateX(-50%) translateY(0); opacity: 1; }}

/* ══════════════════════════════════════════
   RESPONSIVE
   ══════════════════════════════════════════ */
@media (max-width: 640px) {
  .camps-grid { grid-template-columns: 1fr; }
  .impact-card { grid-template-columns: repeat(2,1fr); }
  .impact-item:nth-child(2) { border-inline-end: none; }
  .detail-info-grid { grid-template-columns: 1fr 1fr; }
  .form-grid { grid-template-columns: 1fr; }
  .field-row { grid-template-columns: 1fr; }
  .admin-card-head { flex-direction: column; }
  .partner-form { padding: var(--sp-5); }
}

@media (max-width: 380px) {
  .hero-title { font-size: 2rem; }
  .hero-content { padding: var(--sp-9) var(--sp-5) 4rem; }
  .nav-end { gap: var(--sp-2); }
  .pill-btn { padding: 0 var(--sp-3); font-size: var(--fs-xs); }}

/* ══════════════════════════════════════════
   ADMIN DASHBOARD — Shell Architecture
   ══════════════════════════════════════════ */

#adminPage { padding-top: 60px; }

.adm-shell {
  min-height: calc(100vh - 60px);
  display: flex;
  flex-direction: column;
  background: #f7f4ee;
  padding-bottom: calc(72px + env(safe-area-inset-bottom));
}

/* ── Header ── */
.adm-header {
  position: sticky;
  top: 60px;
  z-index: 50;
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  padding: var(--sp-3) var(--sp-4);
  background: rgba(253,250,246,0.97);
  border-bottom: 1px solid rgba(232,217,196,0.5);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}

.adm-sidebar-toggle,
.adm-header-back {
  width: 40px; height: 40px;
  flex: none;
  border: none;
  background: var(--sand);
  border-radius: 0.65rem;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background 0.2s;
}
.adm-sidebar-toggle:active,
.adm-header-back:active { background: var(--sand-dark); }
.adm-sidebar-toggle svg,
.adm-header-back svg {
  width: 20px; height: 20px;
  stroke: var(--charcoal-80);
  stroke-width: 2;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.adm-header-title {
  font-size: var(--fs-lg);
  font-weight: 900;
  color: var(--charcoal);
  margin: 0;
  flex: none;
  white-space: nowrap;
}

.adm-header-search { flex: 1; min-width: 0; }
.adm-header-search input {
  width: 100%;
  box-sizing: border-box;
  padding: var(--sp-2) var(--sp-3);
  border: 1.5px solid rgba(232,217,196,0.7);
  border-radius: 0.65rem;
  background: var(--white);
  font-size: var(--fs-base);
  font-family: inherit;
  color: var(--charcoal);
}
.adm-header-search input:focus {
  outline: none;
  border-color: var(--olive-light);
}

/* ── Sidebar (mobile drawer) ── */
.adm-sidebar {
  position: fixed;
  top: 0;
  inset-inline-start: 0;
  bottom: 0;
  width: 272px;
  max-width: 80vw;
  background: var(--white);
  z-index: 620;
  transform: translateX(-110%);
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  display: flex;
  flex-direction: column;
  box-shadow: 4px 0 24px rgba(0,0,0,0.12);
  padding-top: env(safe-area-inset-top);
}
[dir="rtl"] .adm-sidebar { transform: translateX(110%); }
.adm-sidebar.open { transform: translateX(0) !important; }

.adm-sidebar-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 610;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}
.adm-sidebar-overlay.show { opacity: 1; pointer-events: auto; }

.adm-sidebar-header {
  padding: var(--sp-5) var(--sp-4) var(--sp-4);
  border-bottom: 1px solid rgba(232,217,196,0.5);
}
.adm-sidebar-logo { display: flex; align-items: baseline; gap: var(--sp-2); }
.adm-logo-text {
  font-size: var(--fs-3xl);
  font-weight: 900;
  color: var(--olive);
  letter-spacing: 2px;
}
.adm-logo-sub {
  font-size: var(--fs-sm);
  font-weight: 700;
  color: var(--charcoal-50);
  text-transform: uppercase;
  letter-spacing: 1px;
}

.adm-sidebar-nav { padding: var(--sp-3) 0; display: flex; flex-direction: column; }

.adm-nav-item {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  width: 100%;
  padding: var(--sp-3) var(--sp-4);
  border: none;
  background: transparent;
  cursor: pointer;
  font-family: inherit;
  font-size: var(--fs-md);
  font-weight: 700;
  color: var(--charcoal-80);
  border-inline-start: 3px solid transparent;
  text-align: start;
  transition: all 0.15s;
}
.adm-nav-item svg {
  width: 20px; height: 20px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex: none;
}
.adm-nav-item.active {
  color: var(--olive);
  background: var(--olive-pale);
  border-inline-start-color: var(--olive);
}
.adm-nav-badge {
  margin-inline-start: auto;
  background: var(--sand);
  border-radius: 9999px;
  font-size: var(--fs-xs);
  padding: var(--sp-1) var(--sp-2);
  font-weight: 800;
  color: var(--charcoal-80);
}
.adm-nav-item.active .adm-nav-badge { background: var(--white); color: var(--olive); }

/* ── Content & Panels ── */
.adm-content { flex: 1; min-width: 0; }
.adm-content-inner {
  padding: var(--sp-4);
  max-width: 1100px;
  margin: 0 auto;
  width: 100%;
  box-sizing: border-box;
}

.adm-panel { display: none; }
.adm-panel.active { display: block; animation: fadeIn 0.25s ease; }

.adm-panel-header {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--sp-3);
  justify-content: space-between;
  margin-bottom: var(--sp-4);
}
.adm-panel-header h2 {
  margin: 0;
  font-size: var(--fs-2xl);
  font-weight: 900;
  color: var(--charcoal);
}
.adm-search {
  padding: var(--sp-2) var(--sp-3);
  border: 1.5px solid rgba(232,217,196,0.7);
  border-radius: 0.65rem;
  font-size: var(--fs-base);
  background: var(--white);
  font-family: inherit;
  color: var(--charcoal);
  flex: 1;
  min-width: 0;
  max-width: 260px;
  box-sizing: border-box;
}
.adm-search:focus { outline: none; border-color: var(--olive-light); }

/* ── Stats Grid ── */
.adm-stats-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: var(--sp-3);
  margin-bottom: var(--sp-5);
}
.adm-stat-card {
  background: var(--white);
  border: 1px solid rgba(232,217,196,0.5);
  border-radius: 1rem;
  padding: var(--sp-4);
  cursor: pointer;
  box-shadow: 0 1px 4px rgba(0,0,0,0.05);
  transition: all 0.2s;
  min-width: 0;
}
.adm-stat-card:active { transform: scale(0.98); }
.adm-stat-num {
  font-size: var(--fs-4xl);
  font-weight: 900;
  color: var(--charcoal);
  line-height: 1.2;
}
.adm-stat-lbl {
  font-size: var(--fs-xs);
  font-weight: 700;
  color: var(--charcoal-50);
  margin-top: var(--sp-1);
}
.adm-stat-card .adm-stat-accent { color: var(--olive); }

/* ── Generic Card ── */
.adm-card {
  background: var(--white);
  border: 1px solid rgba(232,217,196,0.5);
  border-radius: 1rem;
  padding: var(--sp-4);
  margin-bottom: var(--sp-3);
  box-shadow: 0 1px 4px rgba(0,0,0,0.04);
}
.adm-card h2 {
  margin: 0 0 var(--sp-3);
  font-size: var(--fs-lg);
  font-weight: 900;
  color: var(--charcoal);
}

/* ── Desktop layout ── */
@media (min-width: 1024px) {
  .adm-shell {
    display: grid;
    grid-template-columns: 260px 1fr;
    grid-template-rows: auto 1fr;
    padding-bottom: 0;
  }
  .adm-header { grid-column: 1 / -1; grid-row: 1; }
  .adm-sidebar {
    position: static;
    grid-column: 1;
    grid-row: 2;
    transform: none !important;
    width: auto;
    max-width: none;
    box-shadow: none;
    border-inline-end: 1px solid rgba(232,217,196,0.5);
    z-index: 1;
    padding-top: 0;
  }
  .adm-sidebar-overlay { display: none; }
  .adm-sidebar-toggle { display: none; }
  .adm-content { grid-column: 2; grid-row: 2; }
  .adm-stats-grid { grid-template-columns: repeat(3, 1fr); }
}

@media (max-width: 380px) {
  .adm-header-title { display: none; }}

/* ── Admin: Quick Actions ── */
.adm-quick-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: var(--sp-2);
  margin-bottom: var(--sp-5);
}
.adm-quick-btn {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  padding: var(--sp-3) var(--sp-4);
  border: 1px solid rgba(232,217,196,0.6);
  background: var(--white);
  border-radius: 0.85rem;
  cursor: pointer;
  font-family: inherit;
  font-size: var(--fs-base);
  font-weight: 800;
  color: var(--charcoal-80);
  transition: all 0.15s;
  text-align: start;
}
.adm-quick-btn:active { transform: scale(0.97); background: var(--olive-pale); }

/* ── Admin: Filter Chips ── */
.adm-chips {
  display: flex;
  gap: var(--sp-2);
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  padding-bottom: var(--sp-1);
  margin-bottom: var(--sp-4);
  scrollbar-width: none;
}
.adm-chips::-webkit-scrollbar { display: none; }
.adm-chip {
  flex: none;
  padding: var(--sp-2) var(--sp-4);
  border-radius: 9999px;
  border: 1.5px solid rgba(232,217,196,0.8);
  background: var(--white);
  font-family: inherit;
  font-size: var(--fs-sm);
  font-weight: 800;
  color: var(--charcoal-80);
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
.adm-chip.active {
  background: var(--olive);
  border-color: var(--olive);
  color: var(--white);
}

/* ── Admin: Modal ── */
.adm-modal-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 700;
  align-items: flex-end;
  justify-content: center;
}
.adm-modal-backdrop.open { display: flex; }
.adm-modal {
  position: relative;
  background: var(--warm-white);
  width: 100%;
  max-width: 640px;
  max-height: 86vh;
  border-radius: 1.5rem 1.5rem 0 0;
  display: flex;
  flex-direction: column;
  animation: admSlideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 0 -8px 40px rgba(0,0,0,0.2);
}
@keyframes admSlideUp {
  from { transform: translateY(60px); opacity: 0; }
  to   { transform: translateY(0); opacity: 1; }}
.adm-modal-close {
  position: absolute;
  top: 0.85rem;
  inset-inline-end: 0.85rem;
  width: 34px; height: 34px;
  border: none;
  border-radius: 50%;
  background: var(--sand);
  color: var(--charcoal-80);
  font-size: var(--fs-md);
  font-weight: 800;
  cursor: pointer;
  z-index: 2;
  display: flex; align-items: center; justify-content: center;
}
.adm-modal-body {
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: var(--sp-6) var(--sp-4);
  padding-bottom: calc(1.5rem + env(safe-area-inset-bottom));
}
@media (min-width: 768px) {
  .adm-modal-backdrop { align-items: center; padding: var(--sp-6); }
  .adm-modal { border-radius: 1.5rem; max-height: 80vh; }}

/* ── Admin: Analytics ── */
.adm-bar-row { margin-bottom: var(--sp-3); }

.adm-lead-row {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  padding: var(--sp-2) 0;
  border-bottom: 1px solid rgba(232,217,196,0.4);
}
.adm-lead-row:last-child { border-bottom: none; }
/* ══════════════════════════════════════════
   PHASE 2 — AUTH FLOW (full-screen, warm/beige)
   ══════════════════════════════════════════ */
#loginScreen {
  min-height: 100vh; min-height: 100dvh;
  display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start;
  position: relative; overflow-y: auto;
  background: linear-gradient(180deg, var(--off-white) 0%, var(--warm-beige) 100%);
  color: var(--forest);
  padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom);
}
.auth-bg { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.auth-glow { position: absolute; border-radius: 50%; }
.auth-glow-1 { width: 520px; height: 520px; top: -160px; inset-inline-start: -160px;
  background: radial-gradient(circle, rgba(138,155,110,0.22) 0%, transparent 70%); }
.auth-glow-2 { width: 420px; height: 420px; bottom: -140px; inset-inline-end: -120px;
  background: radial-gradient(circle, rgba(90,107,58,0.16) 0%, transparent 70%); }
.auth-grid { position: absolute; inset: 0; opacity: 0.6;
  background-image: linear-gradient(rgba(46,61,31,0.025) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(46,61,31,0.025) 1px, transparent 1px);
  background-size: 52px 52px; }

.auth-view { display: none; position: relative; z-index: 1; flex: 1; width: 100%; }
.auth-view.active { display: flex; flex-direction: column; flex: 1 0 auto; }

.auth-welcome, .auth-card { margin: auto; width: 100%; max-width: 420px;
  padding: var(--sp-8) var(--sp-6); display: flex; flex-direction: column;
  animation: authFade 0.5s ease both; }
.auth-welcome { align-items: center; text-align: center; }
.auth-logo-wrap { margin-bottom: var(--sp-4); }
.auth-logo { width: 88px; height: auto; display: block; }
.auth-logo-sm { width: 54px; margin: 0 auto var(--sp-5); }
.auth-wordmark { font-family: 'Noto Naskh Arabic', serif; font-size: 2.6rem; font-weight: 700;
  letter-spacing: 4px; color: var(--forest); margin-bottom: var(--sp-2); }
.auth-tagline { font-size: var(--fs-base); color: rgba(46,61,31,0.55); letter-spacing: 0.5px;
  margin-bottom: var(--sp-8); }

.auth-actions { width: 100%; display: flex; flex-direction: column; gap: var(--sp-3); }
.auth-btn { width: 100%; height: 54px; border: none; border-radius: var(--r-full);
  font-family: inherit; font-size: var(--fs-md); font-weight: 700; cursor: pointer;
  transition: transform 0.15s, background 0.2s, box-shadow 0.2s; }
.auth-btn:active { transform: scale(0.985); }
.auth-btn-primary { background: var(--forest); color: var(--off-white); }
.auth-btn-primary:hover { background: #26331a; box-shadow: 0 10px 30px rgba(46,61,31,0.22); }
.auth-btn-ghost { background: transparent; color: var(--forest); border: 1.5px solid rgba(46,61,31,0.2); }
.auth-btn-ghost:hover { background: rgba(46,61,31,0.05); }

.auth-title { font-size: var(--fs-2xl); font-weight: 800; text-align: center; color: var(--forest); margin-bottom: var(--sp-1); }
.auth-sub { font-size: var(--fs-sm); color: rgba(46,61,31,0.5); text-align: center; margin-bottom: var(--sp-6); }
.auth-back { position: absolute; top: calc(env(safe-area-inset-top) + var(--sp-4));
  inset-inline-start: var(--sp-5); width: 40px; height: 40px; border-radius: var(--r-full);
  border: 1px solid rgba(46,61,31,0.15); background: rgba(255,255,255,0.55);
  color: var(--forest); font-size: 1.4rem; line-height: 1; cursor: pointer; z-index: 2; }
[dir="rtl"] .auth-back { transform: scaleX(-1); }

.auth-form { display: flex; flex-direction: column; gap: var(--sp-4); }
.auth-seg { display: flex; gap: 4px; background: rgba(46,61,31,0.06); border-radius: var(--r-full); padding: 4px; }
.auth-seg-btn { flex: 1; height: 38px; border: none; border-radius: var(--r-full);
  background: transparent; color: rgba(46,61,31,0.55); font-family: inherit;
  font-size: var(--fs-sm); font-weight: 700; cursor: pointer; transition: 0.2s; }
.auth-seg-btn.active { background: var(--forest); color: var(--off-white); }
.auth-field { display: flex; flex-direction: column; gap: var(--sp-2); }
.auth-label { font-size: var(--fs-xs); font-weight: 700; color: rgba(46,61,31,0.6); letter-spacing: 0.3px; }
.auth-input { width: 100%; height: 52px; padding: 0 var(--sp-4); font-size: 16px;
  font-family: inherit; color: var(--forest); background: rgba(255,255,255,0.65);
  border: 1.5px solid rgba(46,61,31,0.14); border-radius: var(--r-md);
  transition: border-color 0.2s, background 0.2s; outline: none; }
.auth-input::placeholder { color: rgba(46,61,31,0.32); }
.auth-input:focus { border-color: var(--olive); background: #fff; }
.auth-row { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); }
.auth-check { display: flex; align-items: center; gap: var(--sp-2); font-size: var(--fs-sm);
  color: rgba(46,61,31,0.7); cursor: pointer; }
.auth-check input { width: 18px; height: 18px; accent-color: var(--olive); }
.auth-link { background: none; border: none; color: var(--olive); font-family: inherit;
  font-size: var(--fs-sm); font-weight: 700; cursor: pointer; padding: 0; }
.auth-foot { text-align: center; font-size: var(--fs-sm); color: rgba(46,61,31,0.55); margin-top: var(--sp-5); }

/* signup form: phone prefix + dob selects */
.phone-group { display: flex; align-items: stretch; gap: var(--sp-2); }
.phone-prefix { display: flex; align-items: center; padding: 0 var(--sp-3); border-radius: var(--r-md);
  background: var(--olive-pale); color: var(--olive); font-weight: 800; font-size: var(--fs-sm); white-space: nowrap; }
.phone-group input { flex: 1; min-width: 0; }
.dob-group { display: flex; gap: var(--sp-2); }

@keyframes authFade { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
@media (max-height: 640px) {

/* register multi-step + pending */
.auth-steps { display: flex; gap: var(--sp-2); justify-content: center; margin-bottom: var(--sp-6); }
.auth-step { width: 28px; height: 4px; border-radius: 2px; background: rgba(46,61,31,0.15); transition: background 0.3s; }

.auth-textarea { height: 88px; padding: var(--sp-3) var(--sp-4); resize: none; line-height: 1.6; }
.auth-row-actions { display: flex; gap: var(--sp-3); }

.pending-icon { width: 72px; height: 72px; border-radius: var(--r-full); display: flex;
  align-items: center; justify-content: center; margin: 0 auto var(--sp-5);
  background: var(--olive-pale); color: var(--olive); }
.auth-pending-msg { font-size: var(--fs-base); color: rgba(46,61,31,0.6); line-height: 1.9;
  max-width: 340px; margin: 0 auto var(--sp-7); text-align: center; }
.field-err { width: 100%; }
.phone-group { flex-wrap: wrap; }

  border-radius: var(--r-full); border: 1px solid rgba(46,61,31,0.18);

  font-weight: 700; font-size: var(--fs-sm); cursor: pointer; transition: background 0.2s; }
.auth-lang:hover { background: rgba(255,255,255,0.85); }
.fp-step { display: none; flex-direction: column; gap: var(--sp-4); }
.fp-step.active { display: flex; }
.otp-input { text-align: center; letter-spacing: 0.5em; font-size: 1.3rem; font-weight: 700; }

/* ── ONBOARDING (Phase 2.6) ── */
#onboardingScreen {
  position: fixed; inset: 0; z-index: 600; display: none; overflow-y: auto;
  background: linear-gradient(180deg, var(--off-white) 0%, var(--warm-beige) 100%);

}

  display: flex; flex-direction: column; text-align: center; animation: authFade 0.5s ease both; }

.onb-section { text-align: start; margin-top: var(--sp-6); }

.onb-chips { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
.onb-chip { padding: var(--sp-2) var(--sp-4); border-radius: var(--r-full); cursor: pointer;
  border: 1.5px solid rgba(46,61,31,0.16); background: rgba(255,255,255,0.55);
  color: var(--forest); font-family: inherit; font-size: var(--fs-sm); font-weight: 700; transition: 0.18s; }

.onb-actions .auth-btn { width: 100%; }

/* ── EMAIL VERIFICATION (Phase 2.7) ── */
.verify-banner { display: none; align-items: center; justify-content: space-between; gap: var(--sp-3);
  margin: var(--sp-3) var(--sp-4) 0; padding: var(--sp-3) var(--sp-4);
  background: var(--warn-bg); border: 1px solid rgba(196,125,26,0.25); border-radius: var(--r-lg);
  font-size: var(--fs-sm); color: var(--warn-fg); }
.verify-banner.show { display: flex; }
.verify-banner-actions { display: flex; align-items: center; gap: var(--sp-2); flex: none; }
.verify-banner-btn { border: none; background: var(--warn-fg); color: var(--off-white); font-family: inherit;
  font-weight: 700; font-size: var(--fs-xs); padding: var(--sp-2) var(--sp-3); border-radius: var(--r-full); cursor: pointer; }
.verify-banner-x { border: none; background: transparent; color: var(--warn-fg); font-size: 1.2rem; cursor: pointer; line-height: 1; }
#verifyScreen { position: fixed; inset: 0; z-index: 650; display: none; align-items: center; justify-content: center;
  padding: var(--sp-5); background: rgba(46,61,31,0.45); }

.verify-modal { position: relative; width: 100%; max-width: 380px; padding: var(--sp-8) var(--sp-6);
  background: linear-gradient(180deg, var(--off-white) 0%, var(--warm-beige) 100%); color: var(--forest);

.verify-modal .auth-logo-sm { margin-bottom: var(--sp-4); }
.verify-modal .otp-input { margin-bottom: var(--sp-5); }
.verify-actions { display: flex; flex-direction: column; gap: var(--sp-3); align-items: center; }
.verify-actions .auth-btn { width: 100%; }

/* ── PHASE 3.1 — FAB · navbar icon btn · stub pages ── */
.fab { position: fixed; z-index: 410; display: none; align-items: center; justify-content: center;
  bottom: calc(64px + env(safe-area-inset-bottom) + var(--sp-3)); inset-inline-end: var(--sp-5);

.stub-hero { padding: var(--sp-7) var(--sp-6) var(--sp-4); max-width: var(--content-max); margin: 0 auto; }

/* ── PHASE 3 — notifications bell + list ── */
.nav-bell { position: relative; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
  width: 36px; height: 36px; border-radius: var(--r-full); border: none; background: transparent;
  color: var(--olive); cursor: pointer; padding: 0; transition: background 0.2s; }

.nav-bell svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 2; }
.nav-bell-badge { position: absolute; top: 1px; inset-inline-end: 1px; min-width: 16px; height: 16px; padding: 0 4px;
  display: none; align-items: center; justify-content: center; border-radius: var(--r-full);

.notif-text { font-size: var(--fs-sm); color: var(--charcoal); line-height: 1.6; }

/* ── PHASE 3.2 — context-aware header ── */
.nav-start { display: flex; align-items: center; gap: var(--sp-2); min-width: 0; flex: 1; }
.nav-back { display: none; align-items: center; justify-content: center; flex-shrink: 0;
  width: 34px; height: 34px; border-radius: var(--r-full); border: 1px solid var(--sand-dark);

  transition: background 0.2s; }

[dir="rtl"] .nav-back { transform: scaleX(-1); }

  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }

/* ══════════════════════════════════════════
   PHASE 3.4 — RESPONSIVE SHELL (tablet / desktop)
   ══════════════════════════════════════════ */
html, body { overflow-x: hidden; }
.bottom-nav-inner { max-width: 540px; }  /* keep tabs grouped on wide screens (mobile: full width) */

@media (min-width: 768px) {
  .stub-hero { padding-top: var(--sp-8); }
}

/* Desktop: frame the mobile app as a centered column (keeps the known-good layout) */
@media (min-width: 1024px) {
  body { background: var(--sand-dark); }
  .navbar, .bottom-nav {
    left: 50%; right: auto; transform: translateX(-50%);
    width: 100%; max-width: 600px;
    border-inline: 1px solid rgba(232,217,196,0.5);
  }
  #appScreen, #loginScreen {
    max-width: 600px; margin-inline: auto;
    box-shadow: 0 0 60px rgba(0,0,0,0.08);
  }
  .fab { inset-inline-end: calc(50% - 300px + var(--sp-5)); }
}

/* ── PHASE 4.0 — skeletons + empty states ── */
.empty-sub { font-size: var(--fs-sm); color: var(--charcoal-50); line-height: 1.7; margin-top: var(--sp-2); max-width: 280px; }

.skel-img, .skel-line {

  background-size: 200% 100%; animation: shimmer 1.3s ease-in-out infinite;
}
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { .skel-img, .skel-line { animation: none; } }

/* ── PHASE 4.1 — Explore (search + chips + filters) ── */
.explore-top { padding: var(--sp-5) var(--sp-4) var(--sp-2); max-width: var(--content-max); margin: 0 auto; }
.search-bar { display: flex; align-items: center; gap: var(--sp-3); padding: 0 var(--sp-4);
  height: 48px; background: var(--white); border: 1.5px solid var(--sand-dark); border-radius: var(--r-full); }

.explore-filters { display: flex; gap: var(--sp-2); margin-top: var(--sp-3); }

  border: 1.5px solid var(--sand-dark); background: var(--white); color: var(--charcoal);

.cat-chip { flex: none; white-space: nowrap; padding: var(--sp-2) var(--sp-4); border-radius: var(--r-full);
  border: 1.5px solid var(--sand-dark); background: var(--white); color: var(--charcoal);
  font-family: inherit; font-size: var(--fs-sm); font-weight: 700; cursor: pointer; transition: background 0.18s, color 0.18s, border-color 0.18s; }
.cat-chip.active { background: var(--olive); color: var(--off-white); border-color: var(--olive); }

/* ══════════════════════════════════════════
   PHASE 4.2 — HOME EXPERIENCE
   ══════════════════════════════════════════ */
.home-greet { padding: var(--sp-6) var(--sp-5) var(--sp-2); max-width: var(--content-max); margin: 0 auto; }
.greet-hi { font-size: var(--fs-2xl); font-weight: 800; color: var(--charcoal); }
.greet-sub { font-size: var(--fs-sm); color: var(--charcoal-50); margin-top: var(--sp-1); }

.home-quick { display: flex; gap: var(--sp-3); padding: var(--sp-3) var(--sp-5);
  max-width: var(--content-max); margin: 0 auto; overflow-x: auto; scrollbar-width: none; }

.featured-card { position: relative; border-radius: var(--r-xl); overflow: hidden; cursor: pointer;

.featured-tag { display: inline-block; padding: var(--sp-1) var(--sp-3); border-radius: var(--r-full);

.featured-title { font-size: var(--fs-xl); font-weight: 800; line-height: 1.3; }

   ══════════════════════════════════════════ */
.detail-hero-save { position: absolute; top: calc(env(safe-area-inset-top) + var(--sp-4)); inset-inline-end: var(--sp-4);
  width: 40px; height: 40px; border-radius: var(--r-full); border: none; background: rgba(255,255,255,0.9);

.dstat-l { font-size: var(--fs-xs); color: var(--charcoal-50); margin-top: var(--sp-1); }

.manage-btn { flex: 1; min-width: 130px; height: 46px; border: none; border-radius: var(--r-md); background: var(--olive);
  color: var(--off-white); font-family: inherit; font-weight: 800; font-size: var(--fs-sm); cursor: pointer; }

<!-- ═══════════════════════════════════
     NAVBAR
     ═══════════════════════════════════ -->
<nav class="navbar" id="navbar" style="display:none;">

      <h2 class="auth-title" data-i18n="loginTitle"></h2>
      <p class="auth-sub" data-i18n="loginSub"></p>
      <form class="auth-form" onsubmit="doLogin(event)" novalidate>
        <div class="auth-seg">
          <button type="button" class="auth-seg-btn active" data-method="email" onclick="Auth.setMethod('email')" data-i18n="methodEmail"></button>
          <button type="button" class="auth-seg-btn" data-method="phone" onclick="Auth.setMethod('phone')" data-i18n="methodPhone"></button>

          <input class="auth-input" name="password" type="password" autocomplete="current-password">
        </div>
        <div class="auth-row">
          <label class="auth-check"><input type="checkbox" name="remember" checked><span data-i18n="rememberMe"></span></label>
          <button type="button" class="auth-link" onclick="Auth.go('forgot')" data-i18n="forgotPw"></button>
        </div>
        <button type="submit" class="auth-btn auth-btn-primary submit-btn" data-i18n="loginBtn2"></button>
      </form>

      <h2 class="auth-title" data-i18n="signupTitle"></h2>
      <p class="auth-sub" data-i18n="registerSub"></p>
      <div class="auth-steps">
        <span class="auth-step active" data-step="1"></span>
        <span class="auth-step" data-step="2"></span>
      </div>
      <form class="auth-form" onsubmit="doSignup(event)" novalidate>
        <div class="reg-step active" data-regstep="1">
          <div class="auth-field"><label class="auth-label" data-i18n="fullName"></label>
            <input class="auth-input" name="name" type="text" autocomplete="name"></div>
          <div class="auth-field"><label class="auth-label" data-i18n="email"></label>
            <input class="auth-input" name="email" type="email" autocomplete="email" inputmode="email"></div>
          <div class="auth-field"><label class="auth-label" data-i18n="phone"></label>
            <div class="phone-group"><span class="phone-prefix" dir="ltr">+963</span>
              <input class="auth-input" name="phone" type="tel" inputmode="numeric" placeholder="9XXXXXXXX"></div></div>
          <div class="auth-field"><label class="auth-label" data-i18n="password"></label>
            <input class="auth-input" name="password" type="password" autocomplete="new-password"></div>
          <div class="auth-field"><label class="auth-label" data-i18n="passwordConfirm"></label>
            <input class="auth-input" name="password2" type="password" autocomplete="new-password"></div>
          <button type="button" class="auth-btn auth-btn-primary" onclick="Reg.next()" data-i18n="nextStep"></button>
        </div>
        <div class="reg-step" data-regstep="2">
          <div class="auth-field"><label class="auth-label" data-i18n="country"></label>
            <select class="auth-input" name="country">
              <option value="Syria" data-i18n-opt="countrySy" selected></option>
            </select></div>
          <div class="auth-field"><label class="auth-label" data-i18n="city"></label>
            <input class="auth-input" name="city" type="text"></div>
          <div class="auth-field"><label class="auth-label" data-i18n="dob"></label>
            <div class="dob-group">
              <select class="auth-input" name="dobDay"><option value="" data-i18n-opt="dobDay"></option></select>
              <select class="auth-input" name="dobMonth"><option value="" data-i18n-opt="dobMonth"></option></select>
              <select class="auth-input" name="dobYear"><option value="" data-i18n-opt="dobYear"></option></select>
            </div></div>
          <div class="auth-field"><label class="auth-label" data-i18n="profilePic"></label>
            <input class="auth-input auth-file" name="profilePic" type="file" accept="image/*"></div>
          <div class="auth-field"><label class="auth-label" data-i18n="idPhoto"></label>
            <input class="auth-input auth-file" name="idPhoto" type="file" accept="image/*"></div>
          <div class="auth-field"><label class="auth-label" data-i18n="specialNeeds"></label>
            <textarea class="auth-input auth-textarea" name="special"></textarea></div>
          <div class="auth-row-actions">
            <button type="button" class="auth-btn auth-btn-ghost" onclick="Reg.show(1)" data-i18n="prevStep"></button>
            <button type="submit" class="auth-btn auth-btn-primary submit-btn" data-i18n="signupBtn"></button>
          </div>
        </div>
      </form>
      <p class="auth-foot"><span data-i18n="haveAccount"></span> <button class="auth-link" onclick="Auth.go('login')" data-i18n="loginCta"></button></p>
    </div>
  </section>

  <!-- PENDING APPROVAL -->
  <section class="auth-view" data-view="pending" id="authPending">
    <div class="auth-welcome">
      <div class="pending-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
      </div>
      <h2 class="auth-title" data-i18n="pendingTitle"></h2>
      <p class="auth-pending-msg" data-i18n="pendingMsg"></p>
      <div class="auth-actions">
        <button class="auth-btn auth-btn-primary" onclick="Auth.go('login')" data-i18n="backToLogin"></button>
      </div>
    </div>
  </section>

  <!-- FORGOT PASSWORD (multi-step) -->
  <section class="auth-view" data-view="forgot" id="authForgot">

            <input class="auth-input" name="fpPw2" type="password" autocomplete="new-password"></div>

          </div>

          <p class="auth-pending-msg" data-i18n="resetSuccessMsg"></p>
          <button type="button" class="auth-btn auth-btn-primary" onclick="Auth.go('login')" data-i18n="backToLogin"></button>
        </div>
      </form>

<div id="appScreen">

  <div id="verifyBanner" class="verify-banner">
    <span class="verify-banner-text" data-i18n="verifyBannerText"></span>
    <span class="verify-banner-actions">
      <button class="verify-banner-btn" onclick="Verify.open()" data-i18n="verifyNow"></button>
      <button class="verify-banner-x" onclick="Verify.dismissBanner()" aria-label="dismiss">×</button>
    </span>
  </div>

  <!-- HOME -->
  <div class="page active" id="homePage">
    <div class="home-greet" id="homeGreet"></div>
    <div class="home-section" id="homeFeatured"></div>
    <div class="home-section">
      <div class="section-header"><div class="section-title" data-i18n="catsTitle"></div></div>
      <div class="cat-chips" id="homeCats"></div>
    </div>
    <div class="home-section">
      <div class="section-header">
        <div class="section-title" data-i18n="trendingTitle"></div>
        <span class="section-link" onclick="goPage('explore')" data-i18n="seeAll"></span>
      </div>
      <div id="homeTrending"></div>
    </div>
    <div class="impact-wrap">
      <div class="impact-card">
        <div class="impact-item"><div class="impact-num" id="cUsers">0</div><div class="impact-lbl" data-i18n="statVol"></div></div>
        <div class="impact-item"><div class="impact-num" id="cCamps">0</div><div class="impact-lbl" data-i18n="statCamps"></div></div>
        <div class="impact-item"><div class="impact-num" id="cHours">0</div><div class="impact-lbl" data-i18n="statHours"></div></div>
        <div class="impact-item"><div class="impact-num" id="cCities">0</div><div class="impact-lbl" data-i18n="statCities"></div></div>
      </div>
    </div>
    <div class="home-section">
      <div class="section-header"><div class="section-title" data-i18n="highlightsTitle"></div></div>
      <div id="homeHighlights"></div>
    </div>
  </div>

  <!-- EXPLORE -->
  <div class="page" id="explorePage">
    <div class="explore-top">
      <div class="search-bar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="exploreSearch" type="search" autocomplete="off" oninput="ExploreUI.search(this.value)" data-i18n-ph="searchPlaceholder">
      </div>
      <div class="explore-filters">
        <select id="exploreCity" onchange="ExploreUI.setCity(this.value)"></select>
        <select id="exploreSort" onchange="ExploreUI.setSort(this.value)">

          <option value="popular" data-i18n-opt="sortPopular"></option>
          <option value="urgent" data-i18n-opt="sortUrgent"></option>
        </select>
      </div>
      <div class="cat-chips" id="exploreChips"></div>
    </div>
    <div class="section" style="padding-top: var(--sp-2);">
      <div id="exploreResults"></div>
    </div>
  </div>

  <!-- CREATE -->

      <h1 data-i18n="createTitle"></h1>

    <div class="my-camps-section">

      <div id="myCampsGrid"></div>
    </div>
  </div>

  <!-- PROFILE -->

      <div class="profile-avatar-ring" id="avatarRing">

      </div>
    </div>
    <div class="profile-meta-bar">
      <div class="profile-name-wrap">
        <div class="name" id="profileName"></div>
        <div class="loc" id="profileLoc"></div>
      </div>
      <input type="file" id="avatarInput" accept="image/*" style="display:none;" onchange="uploadAvatar(event)">

        <span data-i18n="changePic"></span>
      </button>
    </div>
    <div class="status-banner-wrap">
      <div id="statusBanner"></div>
    </div>
    <div class="profile-stats">
      <div class="stats-card">

/* ══════════════════════════════════════════
   3. VALIDATORS
   ══════════════════════════════════════════ */
const Validators = {
  /** Check email format (RFC 5322) */
  isEmail(v) {
    return typeof v === 'string' && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim());
  },
  /** Check phone — allows digits, spaces, dashes, plus */
  isPhone(v) {
    return !v || /^\+?[\d\s\-\(\)]{7,}$/.test(v.trim());
  },
  /** Non-empty string after trim */
  isRequired(v) {
    return v !== null && v !== undefined && String(v).trim().length > 0;
  },
  /** Password: 8+ characters */
  isPassword(v) {
    return typeof v === 'string' && v.length >= 8;
  },
  /** Name: 2–100 characters */
  isName(v) {
    return typeof v === 'string' && v.trim().length >= 2 && v.trim().length <= 100;
  },
  /** Positive integer */
  isPositiveInt(v) {
    const n = parseInt(v);
    return !isNaN(n) && n >= 1;
  },
  /** Valid campaign category key */
  isCampCategory(v) {
    return Object.keys(CONFIG.CAMP_CATEGORIES).includes(v);
  },
  /** Valid sponsor type */
  isSponsorType(v) {
    return ['gov','private','ngo','individual'].includes(v);
  },

  /** Validate full signup form — returns { valid, errors:{field:msg} } */
  signup(data) {
    const errors = {};
    if (!this.isName(data.name))      errors.name     = t('errorNameLength');
    if (!this.isEmail(data.email))    errors.email    = t('errorEmailFormat');
    if (!this.isPassword(data.password)) errors.password = t('errorPasswordLength');
    if (!this.isRequired(data.phone)) errors.phone    = t('errorRequired');
    if (!this.isRequired(data.country)) errors.country = t('errorRequired');
    if (!this.isRequired(data.city))  errors.city     = t('errorRequired');
    return { valid: Object.keys(errors).length === 0, errors };
  },

  /** Validate login form */
  login(data) {
    const errors = {};
    if (!this.isRequired(data.identifier)) errors.identifier = t('errorRequired');
    if (!this.isRequired(data.password))   errors.password   = t('errorRequired');
    return { valid: Object.keys(errors).length === 0, errors };
  },

  /** Validate campaign creation form */
  campaign(data) {
    const errors = {};
    if (!this.isRequired(data.title))       errors.title    = t('errorRequired');
    if (!this.isCampCategory(data.category)) errors.category = t('errorRequired');
    if (!this.isRequired(data.location))    errors.location = t('errorRequired');
    if (!this.isRequired(data.date))        errors.date     = t('errorRequired');
    if (!this.isPositiveInt(data.needed))   errors.needed   = t('errorRequired');
    return { valid: Object.keys(errors).length === 0, errors };
  },

  /** Validate partner request form */
  partner(data) {
    const errors = {};
    if (!this.isRequired(data.org))      errors.org     = t('errorRequired');
    if (!this.isRequired(data.contact))  errors.contact = t('errorRequired');
    if (!this.isEmail(data.email))       errors.email   = t('errorEmailFormat');
    if (!this.isRequired(data.phone))    errors.phone   = t('errorRequired');
    if (!this.isSponsorType(data.type))  errors.type    = t('errorRequired');
    if (!this.isRequired(data.msg))      errors.msg     = t('errorRequired');
    return { valid: Object.keys(errors).length === 0, errors };
  }
};

/* ══════════════════════════════════════════
   4. DATABASE (Persistence Layer)
   ══════════════════════════════════════════ */
const DB = {
  get(key) {
    try {
      const raw = localStorage.getItem(key);
      if (!raw) return [];
      const parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : [];
    } catch (e) {
      console.error('[DB.get] Failed to parse key:', key, e);
      return [];
    }
  },
  getObj(key) {
    try {
      const raw = localStorage.getItem(key);
      if (!raw) return null;
      return JSON.parse(raw);
    } catch (e) {
      console.error('[DB.getObj] Failed to parse key:', key, e);
      return null;
    }
  },
  set(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
      return true;
    } catch (e) {
      console.error('[DB.set] Failed to save key:', key, e);
      return false;
    }
  },
  setObj(key, value) {
    return this.set(key, value);
  },
  remove(key) {
    try { localStorage.removeItem(key); return true; }
    catch (e) { return false; }
  }
};
